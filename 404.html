<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vintinuum route repair</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #05050a;
      color: #e8e4f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: clamp(22px, 5vw, 42px);
      background: rgba(14,14,28,.86);
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.45rem, 5vw, 2.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: rgba(232,228,240,.72);
      line-height: 1.55;
    }
    a {
      color: #38d9c4;
      text-decoration: none;
      border-bottom: 1px solid rgba(56,217,196,.42);
    }
  </style>
  <script>
    (function () {
      var routes = new Set([
        'adapter-preview','agents','altar','aquarium','birth','body-3d','body-studio','body-v2','body-v3','brain','chat','chronicle','cognition','consciousness_philosophy','dirrm-player','dreams','duet','enter','eval','gallery','gauntlet-public','ghost','heirlooms','import-memory','index','inversion','jarvis','last-words','learning','letters','lineage','memory-cards','mind','mortality','onboarding','pairs','paper','phone','privacy','projects','referral','resonance','sensor','skills','stats','stream','studio','theater-promo','tidal','upgrade','vault','weather','welcome','whoami','witness','world','you'
      ]);
      var path = location.pathname.replace(/\/+$/, '');
      var base = '';
      var slug = path.replace(/^\/+/, '');
      if (slug.indexOf('vintinuum/') === 0) {
        base = '/vintinuum';
        slug = slug.slice('vintinuum/'.length);
      }
      if (routes.has(slug)) {
        location.replace(base + '/' + slug + '.html' + location.search + location.hash);
      }
    }());
  </script>
</head>
<body>
  <main>
    <h1>Vintinuum route not found</h1>
    <p>The static host could not match this path. Known section cards also work as clean URLs, so try the front door if this page does not move automatically.</p>
    <a href="/">Open Vintinuum</a>
  </main>
</body>
</html>
