<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DirRM Player</title>
  <style>
    :root {
      --dirrm-gold: #F5A623;
      --dirrm-gold-dim: rgba(245, 166, 35, 0.6);
      --dirrm-bg: rgba(13, 11, 8, 0.92);
      --dirrm-bg-solid: #0d0b08;
      --dirrm-border: rgba(245, 166, 35, 0.25);
      --dirrm-text: #f0e6d3;
      --dirrm-text-muted: rgba(240, 230, 211, 0.5);
      --dirrm-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 1px rgba(245, 166, 35, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dirrm-bg-solid);
      color: var(--dirrm-text);
      overflow: hidden;
    }

    /* ============================================
       MAIN PLAYER CONTAINER
       ============================================ */
    .dirrm-player {
      position: fixed;
      background: var(--dirrm-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--dirrm-border);
      border-radius: 16px;
      box-shadow: var(--dirrm-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 9999;
      transition: border-radius 0.2s ease;
      /* Never escape the viewport — applies to every mode and every drag/resize. */
      max-width: 100vw;
      max-height: 100svh;
    }

    .dirrm-player[data-mode="main"] {
      width: 860px;
      height: 520px;
      min-width: 480px;
      min-height: 320px;
      /* OG DirHaven incremental sizing: +/- buttons scale this var. */
      transform: scale(var(--dirrm-scale, 1));
      transform-origin: center center;
      transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
    }
    .dirrm-player[data-mode="mini"] { transform: scale(var(--dirrm-scale-mini, 1)); transform-origin: center center; }

    .dirrm-player[data-mode="mini"] {
      width: 380px;
      height: auto;
      min-width: 300px;
      min-height: 120px;
    }

    .dirrm-player[data-mode="pip"] {
      width: 320px;
      height: 180px;
      min-width: 200px;
      min-height: 120px;
      border-radius: 12px;
    }

    .dirrm-player[data-mode="theater"] {
      width: 100vw;
      height: 100svh;
      min-width: 100vw;
      min-height: 100svh;
      border-radius: 0;
      top: 0 !important;
      left: 0 !important;
    }

    /* ============================================
       TITLE BAR (draggable)
       ============================================ */
    .dirrm-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(245, 166, 35, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(245, 166, 35, 0.1);
      cursor: move;
      user-select: none;
      flex-shrink: 0;
    }

    .dirrm-titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .dirrm-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--dirrm-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dirrm-subtitle {
      font-size: 11px;
      color: var(--dirrm-text-muted);
      letter-spacing: 0.04em;
      /* Its sibling .dirrm-title has had nowrap+ellipsis since day one; this one
         never did. At 320-375px "Offline on Kick" / "12,481 watching on Kick"
         wrapped to three lines and shoved the window-control buttons out of the
         titlebar — a real No-Collision violation, found while shipping K3NUPWK.
         Flex children default to min-width:auto and refuse to shrink below their
         content, so min-width:0 is the load-bearing half of this fix. */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .dirrm-titlebar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ============================================
       WINDOW CONTROL BUTTONS
       ============================================ */
    .dirrm-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--dirrm-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }

    .dirrm-btn:hover {
      background: rgba(245, 166, 35, 0.12);
      border-color: var(--dirrm-border);
      color: var(--dirrm-gold);
    }

    .dirrm-btn--primary {
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.2) 0%, rgba(245, 166, 35, 0.1) 100%);
      border-color: var(--dirrm-border);
      color: var(--dirrm-gold);
    }

    .dirrm-btn--primary:hover {
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.35) 0%, rgba(245, 166, 35, 0.2) 100%);
    }

    .dirrm-btn--danger:hover {
      background: rgba(255, 60, 60, 0.15);
      border-color: rgba(255, 60, 60, 0.4);
      color: #ff6b6b;
    }

    .dirrm-btn--active {
      background: rgba(245, 166, 35, 0.15);
      border-color: var(--dirrm-gold);
      color: var(--dirrm-gold);
    }

    /* ============================================
       MEDIA CONTAINER
       ============================================ */
    .dirrm-media-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dirrm-media-container video,
    .dirrm-media-container audio,
    .dirrm-media-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .dirrm-media-container video {
      width: 100%;
      height: 100%;
    }

    .dirrm-media-container img {
      max-width: 100%;
      max-height: 100%;
    }

    /* Audio visualizer — full canvas */
    .dirrm-audio-visualizer {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .dirrm-audio-visualizer canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .dirrm-viz-label {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(245, 166, 35, 0.4);
      pointer-events: none;
      text-transform: uppercase;
    }

    /* PDF/Ebook viewer */
    .dirrm-document-viewer {
      width: 100%;
      height: 100%;
      background: #1a1814;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .dirrm-document-viewer iframe {
      width: 100%;
      height: 100%;
      flex: 1;
      border: none;
    }

    .dirrm-doc-toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(13, 11, 8, 0.85);
      border-bottom: 1px solid var(--dirrm-border);
      flex-shrink: 0;
      align-items: center;
    }

    .dirrm-doc-toolbar a,
    .dirrm-doc-toolbar button {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(245, 166, 35, 0.1);
      color: var(--dirrm-gold);
      border: 1px solid var(--dirrm-border);
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .dirrm-doc-toolbar a:hover,
    .dirrm-doc-toolbar button:hover {
      background: rgba(245, 166, 35, 0.2);
    }

    /* Embed (YouTube / Vimeo / Twitch / SoundCloud / Spotify / Bandcamp) */
    .dirrm-embed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      overflow: hidden;
    }

    .dirrm-embed iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 3D model viewer */
    .dirrm-model-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #1a1814 0%, #000 100%);
      overflow: hidden;
    }

    .dirrm-model-wrap model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Text / code viewer */
    .dirrm-text-viewer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #0d0b08;
      overflow: hidden;
    }

    .dirrm-text-toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(13, 11, 8, 0.95);
      border-bottom: 1px solid var(--dirrm-border);
      flex-shrink: 0;
      align-items: center;
      justify-content: flex-end;
    }

    .dirrm-text-toolbar button,
    .dirrm-text-toolbar a {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(245, 166, 35, 0.1);
      color: var(--dirrm-gold);
      border: 1px solid var(--dirrm-border);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .dirrm-text-toolbar button:hover,
    .dirrm-text-toolbar a:hover {
      background: rgba(245, 166, 35, 0.22);
    }

    .dirrm-text-body {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.55;
      color: #f0e6d3;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .dirrm-text-body.markdown {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      white-space: normal;
      font-size: 15px;
    }

    .dirrm-text-body.markdown h1,
    .dirrm-text-body.markdown h2,
    .dirrm-text-body.markdown h3 {
      color: var(--dirrm-gold);
      margin: 0.8em 0 0.4em;
    }

    .dirrm-text-body.markdown a { color: var(--dirrm-gold); }

    .dirrm-text-body.markdown code,
    .dirrm-text-body.markdown pre {
      background: rgba(245, 166, 35, 0.08);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    }

    .dirrm-text-body.markdown pre {
      padding: 12px 14px;
      overflow: auto;
    }

    /* Info card (archive / torrent / fallback) */
    .dirrm-info-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1814 0%, #000 100%);
      padding: 24px;
      overflow: auto;
    }

    .dirrm-info-card-inner {
      max-width: 420px;
      /* Flex children default to min-width:auto and refuse to shrink below their
         content — pin it so the card can never exceed the player box at 320px. */
      min-width: 0;
      width: 100%;
      text-align: center;
      background: rgba(245, 166, 35, 0.05);
      border: 1px solid var(--dirrm-border);
      border-radius: 14px;
      padding: 28px 24px;
    }

    .dirrm-info-icon {
      font-size: 52px;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 12px rgba(245, 166, 35, 0.4));
    }

    .dirrm-info-title {
      font-size: 16px;
      color: var(--dirrm-gold);
      font-weight: 600;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .dirrm-info-meta {
      font-size: 12px;
      color: var(--dirrm-text-muted);
      margin-bottom: 18px;
      letter-spacing: 0.05em;
      /* The refusal card interpolates a live hostname here. A long unbroken host
         would otherwise push this box past the card at 320px — No-Collision Law. */
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .dirrm-info-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .dirrm-info-btn {
      /* 44px minimum touch target — mobile-first mandate. */
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.25), rgba(245, 166, 35, 0.1));
      border: 1px solid var(--dirrm-border);
      color: var(--dirrm-gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .dirrm-info-btn:hover {
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.4), rgba(245, 166, 35, 0.2));
      transform: translateY(-1px);
    }

    /* ============================================
       OFFLINE CARD (task K3NUPWK)
       ============================================
       An offline Kick channel must never read as a broken player. Everything
       here is inside .dirrm-info-card-inner, which is already max-width:420px /
       min-width:0 / text-align:center inside an absolute inset:0 overflow:auto
       parent — so this content scrolls INTERNALLY and cannot touch the titlebar,
       the transport bar or the host frame's chrome at any size. */

    /* The icon is an inline SVG here rather than an emoji glyph, so it is sized
       by the box, not by font-size. Centred on its own line — never beside text. */
    .dirrm-offline-card .dirrm-info-icon {
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--dirrm-gold);
      line-height: 0;
    }
    .dirrm-offline-card .dirrm-info-icon svg {
      width: clamp(30px, 9vw, 46px);
      height: clamp(30px, 9vw, 46px);
      display: block;
    }
    @media (max-height: 320px) {
      .dirrm-offline-card .dirrm-info-icon svg { width: 26px; height: 26px; }
    }

    /* The channel name is the loudest thing on the card — it answers "who?".
       clamp() because this card renders in everything from a 320px phone to a
       1920px theater window (mobile-first mandate: no fixed px type). */
    .dirrm-offline-channel {
      font-size: clamp(1.05rem, 4.2vw, 1.6rem);
      line-height: 1.2;
      font-weight: 700;
      color: var(--dirrm-gold);
      margin-bottom: 4px;
      /* A 64-char channel slug is legal on Kick. Without this it would blow the
         420px box apart — No-Collision Law, the unbroken-token case. */
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* "Not live right now" — the sentence that does the actual job. */
    .dirrm-offline-headline {
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--dirrm-text, #f0e6d3);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .dirrm-offline-card .dirrm-info-meta {
      /* Body copy reads as prose, not as an error string. */
      letter-spacing: 0;
      line-height: 1.5;
      font-size: clamp(0.72rem, 2.4vw, 0.8rem);
      margin-bottom: 14px;
    }

    /* The countdown is a promise being kept in public: it proves the player is
       alive and working rather than hung. Tabular numerals so the text does not
       reflow (and nudge the buttons) once per second. */
    .dirrm-offline-countdown {
      display: block;
      margin: 0 auto 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(245, 166, 35, 0.08);
      border: 1px solid var(--dirrm-border);
      color: var(--dirrm-gold);
      font-size: clamp(0.68rem, 2.2vw, 0.76rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      /* Own line, own box — never shares pixels with the buttons below it. */
      width: fit-content;
      max-width: 100%;
    }

    /* SHORT-FRAME SURVIVAL. The council task board docks this player in frames
       as short as ~98px. The card must degrade gracefully rather than clip: the
       channel name and the "not live" line are the two things that must survive
       to the very last pixel, so the prose and icon yield first. Same tier
       thresholds as the chrome compression above — nothing overlaps, elements
       are only removed from flow and the survivors re-stack normally. */
    @media (max-height: 320px) {
      .dirrm-offline-card .dirrm-info-card-inner { padding: 14px 16px; }
      .dirrm-offline-card .dirrm-info-icon { font-size: 26px; margin-bottom: 6px; }
      .dirrm-offline-card .dirrm-info-meta { margin-bottom: 10px; }
    }
    @media (max-height: 220px) {
      .dirrm-offline-card .dirrm-info-icon { display: none; }
      .dirrm-offline-card .dirrm-info-meta { display: none; }
      .dirrm-offline-card .dirrm-info-card-inner { padding: 10px 12px; }
      .dirrm-offline-countdown { margin-bottom: 8px; padding: 5px 10px; }
    }
    @media (max-height: 140px) {
      /* Bare minimum truth: WHO, that they're offline, and the way out. */
      .dirrm-offline-card { padding: 6px; align-items: center; }
      .dirrm-offline-card .dirrm-info-card-inner { padding: 7px 10px; background: none; border: none; }
      .dirrm-offline-card .dirrm-offline-channel { font-size: 0.9rem; margin-bottom: 2px; }
      .dirrm-offline-card .dirrm-offline-headline { font-size: 0.72rem; margin-bottom: 6px; }
      .dirrm-offline-countdown { display: none; }
      .dirrm-offline-card .dirrm-info-btn { min-height: 32px; padding: 5px 12px; font-size: 11px; }
    }

    /* Tier 4 — the ~98px board dock, the shortest frame we actually ship into.
       At this height even the tier-3 stack needs one more squeeze, so the card
       goes to a single centred ROW: name + state on the left, the two actions on
       the right. Still zero overlap — it's a flex row with a real gap, and the
       text column gets min-width:0 so a long slug ellipsizes instead of shoving
       the buttons out of the frame. */
    @media (max-height: 108px) {
      .dirrm-offline-card { padding: 4px 8px; }
      .dirrm-offline-card .dirrm-info-card-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 2px 4px;
        text-align: left;
        max-width: 100%;
      }
      /* Only two children may exist in the row: the text column and the actions.
         The icon, prose and countdown are already gone by tier 2/3, but pin them
         here too so this tier is correct on its own terms. */
      .dirrm-offline-card .dirrm-info-icon,
      .dirrm-offline-card .dirrm-info-meta,
      .dirrm-offline-card .dirrm-offline-countdown { display: none !important; }
      .dirrm-offline-card .dirrm-offline-text { min-width: 0; }
      .dirrm-offline-card .dirrm-offline-channel {
        font-size: 0.8rem; margin-bottom: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .dirrm-offline-card .dirrm-offline-headline {
        font-size: 0.66rem; margin-bottom: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .dirrm-offline-card .dirrm-info-actions { flex-wrap: nowrap; flex-shrink: 0; }
      .dirrm-offline-card .dirrm-info-btn { min-height: 28px; padding: 4px 10px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dirrm-info-btn { transition: none; }
      .dirrm-info-btn:hover { transform: none; }
    }

    /* Type badge in title bar */
    .dirrm-type-badge {
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 166, 35, 0.12);
      border: 1px solid var(--dirrm-border);
      color: var(--dirrm-gold);
      text-transform: uppercase;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* ============================================
       CONTROLS BAR
       ============================================ */
    .dirrm-controls {
      padding: 12px 16px;
      background: linear-gradient(0deg, rgba(13, 11, 8, 0.6) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Progress/Seek bar */
    .dirrm-seek-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dirrm-seek-track {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      touch-action: none; /* enables pointer-drag scrubbing on touch */
    }

    /* Invisible expanded hit area — thumb-zone scrubbing needs ≥44px of grab */
    .dirrm-seek-track::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -16px;
      bottom: -16px;
    }

    /* Scrub preview bubble — shows target time while dragging */
    .dirrm-scrub-bubble {
      position: absolute;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(13, 11, 8, 0.92);
      border: 1px solid var(--dirrm-border);
      color: var(--dirrm-gold);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      padding: 4px 9px;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 8;
      display: none;
    }
    .dirrm-scrub-bubble.visible { display: block; }

    .dirrm-seek-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--dirrm-gold) 0%, #e8941a 100%);
      border-radius: 3px;
      position: relative;
      transition: width 0.1s linear;
    }

    .dirrm-seek-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--dirrm-gold);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .dirrm-seek-track:hover .dirrm-seek-thumb {
      opacity: 1;
    }

    .dirrm-time {
      font-size: 11px;
      color: var(--dirrm-text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 45px;
    }

    /* Transport row */
    .dirrm-transport {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dirrm-transport-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dirrm-transport-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dirrm-transport-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Play button (larger) */
    .dirrm-btn--play {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
    }

    /* Skip buttons */

       ============================================ */
    .dirrm-resize {

      background: transparent;
      z-index: 10;

    .dirrm-resize--se {
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: se-resize;
    }

    .dirrm-resize--se::after {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--dirrm-gold-dim);
      border-bottom: 2px solid var(--dirrm-gold-dim);
      opacity: 0.5;
      transition: opacity 0.15s ease;
    }

    .dirrm-resize--se:hover::after {
      opacity: 1;
    }

    .dirrm-resize--sw {
      left: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: sw-resize;
    }

    .dirrm-resize--ne {
      right: 0;
      top: 0;
      width: 20px;
      height: 20px;
      cursor: ne-resize;
    }

    .dirrm-resize--nw {
      left: 0;
      top: 0;
      width: 20px;
      height: 20px;
      cursor: nw-resize;
    }

    .dirrm-resize--e {
      right: 0;
      top: 20px;
      bottom: 20px;
      width: 6px;
      cursor: e-resize;
    }

    .dirrm-resize--w {
      left: 0;
      top: 20px;
      bottom: 20px;
      width: 6px;
      cursor: w-resize;
    }

    .dirrm-resize--n {
      top: 0;
      left: 20px;
      right: 20px;
      height: 6px;

    /* ============================================
       EMBEDDED LAYOUT — THE PLAYER IS THE WINDOW
       ============================================
       ROOT CAUSE OF "all sound no video" (fixed here):
       .dirrm-player is position:fixed with per-mode PIXEL geometry
       (mini = 380x auto, main = 860x520, pip = 320x180). That is correct when
       the player owns a real browser window. Inside a HOST IFRAME — the council
       task board's #dirrmSurface, brain.html, jarvis, any embedIn: element —
       position:fixed resolves against the IFRAME's viewport, so the player
       declared a 380px-wide, content-height box inside a frame that was often
       only ~98px tall. body{overflow:hidden} then CLIPPED it: the titlebar and
       controls consumed the visible strip and the media container was pushed
       entirely below the fold. The <video> was present, decoding and audible —
       just scrolled out of view. Audio played. No video. Exactly the report.

       THE CURE: when embedded, the HOST iframe owns the box, not the player.
       The player becomes a flow-filling flex column at 100%/100% and every
       per-mode pixel size is neutralised. Geometry has exactly ONE owner at a
       time — the host when embedded, the player when standalone. That is the
       box-model rule, applied.

       This class is set by JS (_applyEmbedLayout) on <html>, so it is live
       before first paint and cannot be beaten by the inline styles setMode()
       writes — hence the !important on the geometry properties only. */
    html.dirrm-embedded,
    html.dirrm-embedded body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* Geometry reset — beats setMode()'s inline width/height for EVERY mode.
       Nothing else about the mode is touched: mini still hides what mini hides,
       pip still overlays its chrome. Only the BOX is taken back. */
    html.dirrm-embedded .dirrm-player,
    html.dirrm-embedded .dirrm-player[data-mode="main"],
    html.dirrm-embedded .dirrm-player[data-mode="mini"],
    html.dirrm-embedded .dirrm-player[data-mode="pip"],
    html.dirrm-embedded .dirrm-player[data-mode="theater"] {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      min-width: 0 !important;
      min-height: 0 !important;
      /* THE PLAYER IS THE WINDOW: no rounded black box around the media when
         we are inside someone else's frame. The host draws the frame. */
      border-radius: 0 !important;
      border: 0 !important;
      box-shadow: none !important;
      /* A scale transform inside a host frame would letterbox the media inside
         its own window — the exact bordered-box artefact the law forbids. */
      transform: none !important;
      animation: none;
    }

    /* The media container must be the ONLY element that flexes, and it must be
       allowed to shrink. min-height:0 is load-bearing: without it a flex child
       refuses to shrink below content height and blows the column out of the
       frame — the second half of the original defect. */
    html.dirrm-embedded .dirrm-media-container {
      flex: 1 1 auto !important;
      height: auto !important;
      min-height: 0 !important;
      min-width: 0 !important;
    }

    /* Chrome keeps its natural height and never grows; it can only ever take
       what it needs, so the media always gets the remainder. */
    html.dirrm-embedded .dirrm-titlebar,
    html.dirrm-embedded .dirrm-controls {
      flex: 0 0 auto !important;
    }

    /* RESIZE HANDLES BELONG TO WHOEVER OWNS THE BOX.
       Embedded, the HOST owns resize (the board's own #dirrmRsz grip), so these
       eight absolutely-positioned z-index:10 strips are not just redundant —
       they line every edge of the media and SWALLOW pointer events over the
       video (the "zero video interaction" half of the report), and the SE one
       lands in the same pixels as the host's grip, which is a straight
       No-Collision violation. Removed from the layer entirely when embedded. */
    html.dirrm-embedded .dirrm-resize {
      display: none !important;
    }

    /* SHORT-FRAME SURVIVAL — THE MEDIA ALWAYS WINS THE BOX.
       Mini docks, pip corners, 98px board frames, phones in landscape. In a
       short frame the fixed chrome (titlebar ~45px + controls ~95px = 140px)
       eats the entire height and the video is left a sliver — a milder form of
       the very bug this block exists to kill. So the chrome compresses in
       tiers, and it compresses BEFORE the media gives up a single pixel.

       Measured (headless, embedded): 360x210 pip gave the media only 26% of the
       frame and 460x98 mini only 30% before these tiers were tuned. The
       thresholds below are set from those real numbers, not guessed.

       Nothing here overlaps anything: every tier only REMOVES chrome from the
       flex column or shrinks its padding, so the remaining siblings still
       stack in normal flow and the media simply receives the reclaimed space. */

    /* Tier 1 — under 320px: the title has nowhere to go. The host frame already
       shows the title on its own drag rail, so this is a duplicate, not a loss. */
    @media (max-height: 320px) {
      html.dirrm-embedded .dirrm-titlebar { display: none !important; }
      html.dirrm-embedded .dirrm-kbd-legend { display: none !important; }
      html.dirrm-embedded .dirrm-controls { padding: 6px 10px !important; gap: 6px !important; }
    }

    /* Tier 2 — under 220px: drop the secondary control row (skip/volume/extras)
       and keep only the transport line. */
    @media (max-height: 220px) {
      html.dirrm-embedded .dirrm-controls { padding: 4px 8px !important; gap: 4px !important; }
      html.dirrm-embedded .dirrm-skip { display: none !important; }
      html.dirrm-embedded .dirrm-viz-label { display: none !important; }
    }

    /* Tier 3 — under 140px (the board's mini dock): transport only, minimum
       padding, volume gone. Below this the frame is an audio dock by nature. */
    @media (max-height: 140px) {
      html.dirrm-embedded .dirrm-controls { padding: 2px 6px !important; gap: 2px !important; }
      html.dirrm-embedded .dirrm-volume { display: none !important; }
      html.dirrm-embedded .dirrm-time { display: none !important; }
    }
    @media (max-height: 130px) {
      html.dirrm-embedded .dirrm-controls { padding: 2px 6px !important; }
      html.dirrm-embedded .dirrm-volume { display: none !important; }
    }

    /* ============================================
       ICONS (inline SVG)
       ============================================ */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

       ============================================ */
    @media (max-width: 900px) {

      .dirrm-player[data-mode="mini"],

        top: 0 !important;

      }

    }

    @media (max-width: 480px) {

      .dirrm-btn--play { width: 48px; height: 48px; font-size: 20px; }

    /* Mode buttons — compact icon-only on mobile, still accessible */
    @media (max-width: 640px) {

        height: 32px !important;

      }
    }

    #dirrm-platform-badge {

    #dirrm-platform-badge[data-platform="audio"]   { color: #f7b731; display: block; }
    #dirrm-platform-badge[data-platform="embed"]   { color: #aaa;    display: block; }

    <!-- Media Container -->

        <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> seek</span>

      <!-- Transport controls -->
      <div class="dirrm-transport">
        <div class="dirrm-transport-left">

        <div class="dirrm-transport-right">

              <div class="dirrm-volume-fill" id="volume-fill" style="width: 100%"></div>

    <!-- Resize handles -->
    <div class="dirrm-resize dirrm-resize--se" data-dir="se"></div>
    <div class="dirrm-resize dirrm-resize--sw" data-dir="sw"></div>
    <div class="dirrm-resize dirrm-resize--ne" data-dir="ne"></div>
    <div class="dirrm-resize dirrm-resize--nw" data-dir="nw"></div>
    <div class="dirrm-resize dirrm-resize--e" data-dir="e"></div>
    <div class="dirrm-resize dirrm-resize--w" data-dir="w"></div>
    <div class="dirrm-resize dirrm-resize--n" data-dir="n"></div>
    <div class="dirrm-resize dirrm-resize--s" data-dir="s"></div>
  </div>

  <script>
    /* ============================================
       DIRRM PLAYER - Clawdbot Media Player
       ============================================ */

    /* ── EMBED DETECTION — runs BEFORE the player is constructed ─────────────
       When this document is inside a host iframe, the HOST owns the box and we
       must not fight it with position:fixed pixel geometry. Setting the class
       on <html> synchronously here (the script is below the markup but before
       any media loads) means the embedded layout is in force for the first
       paint — no flash of a clipped player, and no race with setMode().

       Why `window.top !== window.self` and not a URL param: it is the ONE
       signal that is always true and needs no cooperation from the caller.
       Every existing embedder (task board, brain.html, jarvis, the extension,
       any future embedIn:) gets the fix for free with zero call-site changes.
       Wrapped in try/catch because a cross-origin parent throws on access —
       and a throw there ALSO means we are embedded, so we set the class. */
    var DIRRM_EMBEDDED = false;
    try { DIRRM_EMBEDDED = (window.top !== window.self); }
    catch (_) { DIRRM_EMBEDDED = true; }
    if (DIRRM_EMBEDDED) document.documentElement.classList.add('dirrm-embedded');

    class DirRMPlayer {
      constructor() {
        this.player = document.getElementById('dirrm-player');
        this.titlebar = document.getElementById('titlebar');
        this.mediaContainer = document.getElementById('media-container');
        this.loading = document.getElementById('loading');
        this.controls = document.getElementById('controls');
        this.kbdLegend = document.getElementById('kbd-legend');
        
        this.mediaTitle = document.getElementById('media-title');
        this.mediaSubtitle = document.getElementById('media-subtitle');
        this.typeBadge = document.getElementById('type-badge');
        
        this.seekTrack = document.getElementById('seek-track');
        this.seekFill = document.getElementById('seek-fill');
        this.timeCurrent = document.getElementById('time-current');
        this.timeDuration = document.getElementById('time-duration');
        
        this.volumeTrack = document.getElementById('volume-track');
        this.volumeFill = document.getElementById('volume-fill');
        this.volumeIcon = document.getElementById('volume-icon');
        this.playIcon = document.getElementById('play-icon');
        
        this.mode = 'main';
        this.mediaElement = null;
        this.mediaType = null;
        this.isPlaying = false;
        // Live WebRTC state — set before loadMedia('', title, 'live') is called
        this._pendingLiveStream = null;
        this._pendingLocalStream = null;
        this._liveStream = null;
        this._localStream = null;
        this.isMuted = false;
        this.volume = 1;
        this.isDragging = false;
        this.isResizing = false;
        this.dragOffset = { x: 0, y: 0 };
        this.resizeDir = null;
        this.startRect = null;
        this.startPos = { x: 0, y: 0 };
        
        this.init();
      }

      init() {
        this.bindEvents();
        this.centerPlayer();
        this.loadFromUrl();
        // Show keyboard legend briefly on first paint, then auto-hide
        this.showKbdLegend(4000);
      }

      showKbdLegend(timeoutMs) {
        if (!this.kbdLegend) return;
        this.kbdLegend.classList.add('visible');
        if (this._kbdLegendTimer) clearTimeout(this._kbdLegendTimer);
        if (timeoutMs > 0) {
          this._kbdLegendTimer = setTimeout(() => {
            this.kbdLegend.classList.remove('visible');
          }, timeoutMs);
        }
      }

      bindEvents() {
        // Window controls
        document.getElementById('btn-close').addEventListener('click', () => this.close());
        document.getElementById('btn-mini').addEventListener('click', () => this.setMode('mini'));
        document.getElementById('btn-maximize').addEventListener('click', () => this.setMode('main'));
        document.getElementById('btn-pip').addEventListener('click', () => this.setMode('pip'));
        document.getElementById('btn-theater').addEventListener('click', () => this.setMode('theater'));
        document.getElementById('btn-fullscreen').addEventListener('click', () => this.toggleFullscreen());
        document.getElementById('btn-viz').addEventListener('click', () => this.cycleViz());
        // OG DirHaven +/- incremental sizing
        document.getElementById('btn-size-up').addEventListener('click', () => this.nudgeSize(+1));
        document.getElementById('btn-size-down').addEventListener('click', () => this.nudgeSize(-1));
        
        // Transport controls
        document.getElementById('btn-play').addEventListener('click', () => this.togglePlay());
        document.getElementById('btn-prev').addEventListener('click', () => this.prev());
        document.getElementById('btn-next').addEventListener('click', () => this.next());
        document.getElementById('btn-back10').addEventListener('click', () => this.seek(-10));
        document.getElementById('btn-fwd10').addEventListener('click', () => this.seek(10));
        document.getElementById('btn-mute').addEventListener('click', () => this.toggleMute());
        
        // Seek bar — pointer-drag scrubbing (mouse + touch) with live preview bubble.
        // A tap is just a zero-length scrub, so click handling comes free.
        this._bindScrub();
        
        // Volume
        this.volumeTrack.addEventListener('click', (e) => this.handleVolume(e));
        
        // Drag
        this.titlebar.addEventListener('mousedown', (e) => this.startDrag(e));
        document.addEventListener('mousemove', (e) => this.onDrag(e));
        document.addEventListener('mouseup', () => this.endDrag());
        
        // Resize
        document.querySelectorAll('.dirrm-resize').forEach(handle => {
          handle.addEventListener('mousedown', (e) => this.startResize(e));
        });
        document.addEventListener('mousemove', (e) => this.onResize(e));
        document.addEventListener('mouseup', () => this.endResize());
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => this.handleKeyboard(e));
        
        // Listen for postMessage from parent
        window.addEventListener('message', (e) => this.handleMessage(e));
      }

      loadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        const title = params.get('title');
        const type = params.get('type');
        
        if (url) {
          this.loadMedia(url, title || this.extractTitle(url), type);
        }
      }

      handleMessage(event) {
        const { action, url, title, type, mode } = event.data || {};

        if (action === 'load') {
          this.loadMedia(url, title, type);
        } else if (action === 'loadLive') {
          // Same-page live stream handoff from dirrm-launch.js.
          // The MediaStream cannot cross postMessage JSON boundaries, so dirrm-launch
          // stores it in window.__DIRRM_LIVE_STREAMS[streamKey] before sending this
          // message. We pull it by key here, never via serialised JSON.
          const key = (event.data || {}).streamKey;
          const localKey = (event.data || {}).localStreamKey;
          const stream = key && window.__DIRRM_LIVE_STREAMS && window.__DIRRM_LIVE_STREAMS[key];
          const localStream = localKey && window.__DIRRM_LIVE_STREAMS && window.__DIRRM_LIVE_STREAMS[localKey];
          if (stream) {
            this._pendingLiveStream = stream;
            this._pendingLocalStream = localStream || null;
            // Clean up registry slot once consumed
            delete window.__DIRRM_LIVE_STREAMS[key];
            if (localKey) delete window.__DIRRM_LIVE_STREAMS[localKey];
          }
          this.loadMedia(url || '', title || 'Live', 'live');
        } else if (action === 'setLocalStream') {
          // Attach / replace the local self-view stream without reloading the whole player.
          const lkey = (event.data || {}).localStreamKey;
          const ls = lkey && window.__DIRRM_LIVE_STREAMS && window.__DIRRM_LIVE_STREAMS[lkey];
          if (lkey) delete window.__DIRRM_LIVE_STREAMS[lkey];
          this._attachSelfView(ls || null);
        } else if (action === 'setMode') {
          this.setMode(mode);
        } else if (action === 'queryState') {
          // PLAYBACK GUARD contract (Vinta directive 2026-08-19, task P3HVHZJ):
          // brain.js snapshots what is playing before engaging the mic so that
          // opening the mic can never silently kill Vinta's song. The player is
          // the only thing that knows its own transport state, so it answers.
          try {
            const el = this.mediaElement;
            const live = el ? (!el.paused && !el.ended) : !!this.isPlaying;
            (event.source || window.parent)?.postMessage({
              action: 'playbackState',
              isPlaying: live,
              hasMedia: !!el,
            }, '*');
          } catch {}
        } else if (action === 'play') {
          this.play();
        } else if (action === 'pause') {
          this.pause();
        } else if (action === 'stop') {
          // Stop = pause + rewind to start. Matches dirrm-launch handle.stop().
          try {
            if (this.mediaElement) {
              this.mediaElement.pause();
              this.mediaElement.currentTime = 0;
            }
          } catch {}
        } else if (action === 'close') {
          this.close();
        }
      }

      extractTitle(url) {
        try {
          const pathname = new URL(url).pathname;
          const filename = pathname.split('/').pop();
          return decodeURIComponent(filename.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' '));
        } catch {
          return 'Unknown';
        }
      }

      // ── PLAY TELEMETRY (U3 — feeds the memory hook) ────────────────────────
      // Every play start/progress/end POSTs to /api/dirrm/play-event so the
      // brain records what was watched and, for ≥30s watches, turns it into a
      // shared experiential memory. This is what makes DirRM "addicting and
      // long-lasting" — Vintinuum REMEMBERS what you watched together.
      _telemetryApiBase() {
        return window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
      }
      // Rewrite a media URL to go THROUGH the brain's media proxy. The proxy
      // fetches with cert-checking off + open CORS, so it beats
      // ERR_CERT_AUTHORITY_INVALID, CORS blocks, and picky open-dir servers.
      _proxify(url) {
        if (!url || url.startsWith('blob:') || url.startsWith('data:')) return url;
        const base = this._telemetryApiBase();
        if (url.startsWith(base + '/api/media/proxy')) return url; // already proxied
        return base + '/api/media/proxy?url=' + encodeURIComponent(url);
      }
      // Should we proxy this URL UPFRONT (before even trying direct)? Yes for any
      // cross-origin http(s) media — open-dir hosts routinely have junk certs
      // (ERR_CERT_AUTHORITY_INVALID) and no CORS headers, which both break a
      // direct <audio>/<video> load AND silently MUTE it through Web Audio
      // (tainted source). Routing through the brain proxy (cert-off + CORS:*)
      // fixes sound + real visualizer in one move.
      _shouldProxyUpfront(url) {
        try {
          if (!url || url.startsWith('blob:') || url.startsWith('data:')) return false;
          const u = new URL(url, location.href);
          if (!/^https?:$/.test(u.protocol)) return false;
          // Same-origin as the player → no proxy needed.
          if (u.origin === location.origin) return false;
          // Already a proxy URL → no.
          if (url.includes('/api/media/proxy')) return false;
          return true;
        } catch (_) { return false; }
      }
      // Set a media element's src with automatic one-time proxy fallback. When
      // the direct load errors (bad cert/CORS), swap to the proxied URL once.
      _setMediaSrc(el, url) {
        el.dataset.origUrl = url;
        el.dataset.proxied = '0';
        const onErr = () => {
          if (el.dataset.proxied === '1') return; // already retried — give up
          el.dataset.proxied = '1';
          const px = this._proxify(url);
          console.warn('[DirRM] direct load failed, retrying via proxy:', px.slice(0, 80));
          try { el.src = px; el.load && el.load(); } catch (_) {}
        };
        el.addEventListener('error', onErr);
        if (el.tagName === 'IMG') el.onerror = onErr; // img uses onerror too
        el.src = url;
      }
      _suspiciousPublicMediaReason(url, title) {
        if (!url || /^blob:|^data:|^magnet:/i.test(url)) return '';
        try {
          const u = new URL(url, location.href);
          if (!/^https?:$/i.test(u.protocol)) return '';
          let decoded;
          try {
            decoded = decodeURIComponent(
              [u.hostname, u.pathname, u.search, title || ''].join(' ')
            );
          } catch (_) {
            decoded = [u.hostname, u.pathname, u.search, title || ''].join(' ');
          }
          const hay = decoded.toLowerCase();
          const directVideo = /\.(mp4|mkv|avi|mov|m4v|webm|wmv|flv)(\?|#|$)/i.test(u.pathname);
          const moviePath = /(^|[\/\s._-])(movies?|films?)([\/\s._-]|$)/i.test(decoded);
          const releaseMarker =
            /\b(yts|rarbg|eztv|ettv|1337x|thepiratebay|torrentgalaxy|tgx|yify)\b/i.test(decoded) ||
            /\b(webrip|web[-.\s]?dl|brrip|bluray|dvdrip|hdrip|camrip|hdtc|telesync|xvid|x264|x265|hevc)\b/i.test(decoded) ||
            /\[(1080p|720p|2160p|4k|webrip|web[-.\s]?dl|brrip|bluray|yts|yify)[^\]]*\]/i.test(decoded);
          const openDirHost = /\b(files?|cdn|media|dl|downloads?|public)\b/i.test(u.hostname);
          const publicOpenDir = moviePath && (openDirHost || hay.includes('/public/'));
          if (releaseMarker && (directVideo || publicOpenDir) && (moviePath || openDirHost || hay.includes('/public/'))) {
            return 'This looks like a public movie-release URL, so DirRM will not open it.';
          }
        } catch (_) {}
        return '';
      }
      _detectSurface() {
        // Best-effort: how is this player being shown?
        try {
          if (window.parent !== window) {
            const h = (document.referrer || '').toLowerCase();
            if (h.includes('brain')) return 'brain';
            if (h.includes('jarvis')) return 'jarvis';
            return 'iframe';
          }
          const ref = (document.referrer || '').toLowerCase();
          if (ref.includes('kick.com')) return 'kick';
          if (/android|iphone|ipad|mobile/i.test(navigator.userAgent)) return 'mobile';
          return 'tab';
        } catch { return 'unknown'; }
      }
      _newPlaySession(url, title, type) {
        this._playSession = {
          id: 'dp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
          url, title, type,
          startedAt: Date.now(),
          watched: 0,           // cumulative seconds actually played
          lastTick: null,       // last timeupdate timestamp for delta accumulation
          duration: 0,
          ended: false,
          // ── DWELL/TASTE signal (growth-frontier) ──
          seekEvents: [],       // [{from_s,to_s}] every skip/rewind — taste fingerprint
          seekFrom: null,       // position captured at 'seeking', resolved at 'seeked'
          abandonAt: null,      // currentTime when abandoned / ended early
          replayCount: 0,       // restarts after >50% watched (love signal)
          maxProgressPct: 0,    // furthest fractional progress reached (for replay detect)
        };
      }
      _postPlayEvent(event, extra = {}) {
        const s = this._playSession;
        if (!s) return;
        const body = {
          session_id: s.id,
          url: s.url,
          title: s.title,
          media_type: s.type || this.mediaType,
          event,
          position_seconds: extra.position || 0,
          duration_seconds: s.duration || extra.duration || 0,
          watched_seconds: s.watched || 0,
          surface: this._detectSurface(),
          mode: this.mode || 'main',
          // ── DWELL/TASTE signal ──
          abandon_at_seconds: s.abandonAt,
          seek_events: (s.seekEvents && s.seekEvents.length) ? JSON.stringify(s.seekEvents.slice(0, 60)) : null,
          replay_count: s.replayCount || 0,
          completed: (s.duration > 0 && (s.watched / s.duration) >= 0.9) ? 1 : 0,
        };
        try {
          // keepalive so 'end'/'abandoned' survives a tab close
          fetch(this._telemetryApiBase() + '/api/dirrm/play-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            keepalive: true,
            credentials: 'omit',
          }).catch(() => {});
        } catch {}
      }
      // Attach watch-time accounting to whatever media element just loaded.
      _attachTelemetry(el) {
        if (!el || !this._playSession) return;
        const s = this._playSession;
        const tick = () => {
          const now = Date.now();
          if (s.lastTick && !el.paused) {
            const delta = (now - s.lastTick) / 1000;
            if (delta > 0 && delta < 5) s.watched += delta;  // ignore big jumps (seeks)
          }
          s.lastTick = now;
          if (el.duration && isFinite(el.duration)) s.duration = el.duration;
          // Track furthest progress for replay detection.
          if (el.duration > 0) {
            const pct = el.currentTime / el.duration;
            if (pct > s.maxProgressPct) s.maxProgressPct = pct;
          }
        };
        el.addEventListener('play',  () => { s.lastTick = Date.now(); this._postPlayEvent('start', { position: el.currentTime }); });
        el.addEventListener('timeupdate', tick);
        el.addEventListener('pause', () => { tick(); /* pause is not an end */ });
        el.addEventListener('ended', () => { tick(); s.ended = true; this._postPlayEvent('end', { position: el.currentTime, duration: el.duration }); });

        // ── SEEK capture (taste signal): 'seeking' marks the FROM, 'seeked' the TO.
        el.addEventListener('seeking', () => {
          // currentTime has already moved by 'seeking', so use the last known
          // play position as FROM. We snapshot it on each tick via lastPos.
          s.seekFrom = (s._lastPos != null) ? s._lastPos : el.currentTime;
        });
        el.addEventListener('seeked', () => {
          const to = el.currentTime;
          const from = (s.seekFrom != null) ? s.seekFrom : to;
          // Ignore micro-seeks (<1.5s) — those are just scrub noise, not taste.
          if (Math.abs(to - from) >= 1.5 && s.seekEvents.length < 60) {
            s.seekEvents.push({ from_s: Math.round(from * 10) / 10, to_s: Math.round(to * 10) / 10 });
          }
          // Replay detection: jumped back near start after watching >50%.
          if (to < 3 && s.maxProgressPct > 0.5) s.replayCount++;
          s.seekFrom = null;
        });
        // Keep a running last-known position for accurate seek FROM.
        el.addEventListener('timeupdate', () => { if (!el.seeking) s._lastPos = el.currentTime; });

        // Abandoned: tab close / navigation while still watching ≥10s. Record
        // the abandon position so the brain learns WHERE people bail.
        if (!this._beforeUnloadBound) {
          this._beforeUnloadBound = true;
          window.addEventListener('beforeunload', () => {
            const cur = this._playSession;
            if (cur && !cur.ended && cur.watched >= 10) {
              cur.abandonAt = (this.mediaElement && isFinite(this.mediaElement.currentTime)) ? this.mediaElement.currentTime : null;
              this._postPlayEvent('abandoned', { position: cur.abandonAt || 0 });
            }
          });
        }
      }

      detectMediaType(url, providedType) {
        // Normalize aliases from extension context menu
        const aliases = {
          docs: 'pdf', document: 'pdf', ebook: 'ebook',
          movie: 'video', music: 'audio', song: 'audio', picture: 'image', photo: 'image',
          stream: 'stream', code: 'text', markdown: 'text',
          model3d: 'model', '3d': 'model'
        };

        // Kick LIVE is the ONE exception to "embed always wins" (task BPYUATZ).
        // player.kick.com sends X-Frame-Options: SAMEORIGIN so the iframe is
        // refused, and a cross-origin embedder physically cannot detect that
        // refusal — the result is a silent black rectangle. So a live Kick
        // channel must be resolved to real HLS BEFORE the embed check claims it.
        // VODs and clips are unaffected and still embed normally.
        if (this._kickLiveChannel(url)) return 'kick-live';

        // Embed detection ALWAYS wins — YouTube/TikTok/etc must go through iframe,
        // not raw <video>. providedType is a hint, not an override for known platforms.
        const embedKind = this.detectEmbed(url);
        if (embedKind) return 'embed';

        if (providedType && providedType !== 'auto') return aliases[providedType] ?? providedType;

        const u = (url || '').toLowerCase().split('?')[0].split('#')[0];
        const ext = u.split('.').pop();

        // Streams
        if (ext === 'm3u8' || ext === 'mpd' || ext === 'ism') return 'stream';
        // Video
        if (['mp4','webm','mkv','mov','m4v','avi','wmv','flv','ogv','3gp','ts','m2ts','mts','divx','xvid','vob','asf','rm','rmvb'].includes(ext)) return 'video';
        // Audio
        if (['mp3','wav','ogg','flac','aac','m4a','opus','wma','aiff','aif','mid','midi','ape','alac','amr','au','ra'].includes(ext)) return 'audio';
        // Image
        if (['jpg','jpeg','png','gif','webp','svg','bmp','ico','tiff','tif','avif','heic','heif','jxl','raw','cr2','nef','arw','dng'].includes(ext)) return 'image';
        // Document
        if (ext === 'pdf') return 'pdf';
        if (['epub','mobi','azw','azw3','fb2','djvu','lit','pdb','cbr','cbz'].includes(ext)) return 'ebook';
        // Text / code
        if (['txt','md','markdown','json','xml','csv','tsv','log','js','mjs','cjs','ts','tsx','jsx','py','rb','go','rs','java','c','cpp','h','hpp','cs','php','swift','kt','scala','lua','pl','sh','bash','zsh','fish','yaml','yml','toml','ini','cfg','conf','env','sql','dockerfile','makefile','html','htm','css','scss','sass','less','vue','svelte'].includes(ext)) return 'text';
        // 3D
        if (['glb','gltf','obj','fbx','stl','dae','ply','usdz','3ds','blend'].includes(ext)) return 'model';
        // Archive
        if (['zip','rar','7z','tar','gz','bz2','xz','zst','tgz','tbz','txz','iso','dmg','pkg','deb','rpm','msi','exe','apk'].includes(ext)) return 'archive';
        // Torrent
        if (ext === 'torrent') return 'torrent';
        // Magnet links
        if ((url || '').startsWith('magnet:')) return 'torrent';

        // Platform fallbacks for bare URLs without extension
        if (/v\.redd\.it/.test(url)) return 'video';

        // TikTok Live — goes through yt-dlp extraction
        if (/tiktok\.com\/@[^/]+\/live/i.test(url) || /vm\.tiktok\.com/i.test(url)) return 'tiktok-live';


        // Generic yt-dlp extraction fallback for social/streaming URLs with no extension
        if (/tiktok\.com|instagram\.com\/reel|facebook\.com\/watch|rumble\.com\/v/i.test(url)) return 'ytdlp';

        // Last resort: assume video (browser will try, then fallback chain kicks in)
        return 'unknown';
      }

      /**
       * Detects if a URL is a known embeddable platform.
       * Returns { kind, embedUrl } or null.
       */
      /**
       * The `parent` param Twitch/Kick require must be the BARE HOSTNAME of the
       * page doing the embedding — no port, no scheme. Getting it wrong makes the
       * provider render its own "this embed seems misconfigured" error inside our
       * iframe (that string is theirs, not ours).
       *
       * `location.hostname` already excludes the port, so we never reintroduce it.
       * Bare IPs are rejected by most embed providers, so 127.0.0.1 (how the
       * council task board GUI binds) is normalized to `localhost` — the standard
       * workaround Twitch documents and Kick honors.
       */
      embedParent() {
        let h = location.hostname || '';
        if (h === '127.0.0.1' || h === '[::1]' || h === '::1' || h === '0.0.0.0') h = 'localhost';
        return h || 'vintaclectic.github.io';
      }

      detectEmbed(url) {
        if (!url) return null;
        try {
          const u = new URL(url);
          const host = u.hostname.replace(/^www\./, '');

          // YouTube (watch, youtu.be, shorts, embed, music, live)
          if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com') {
            let id = u.searchParams.get('v');
            if (!id && u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
            if (!id && u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
            if (!id && u.pathname.startsWith('/live/')) id = u.pathname.split('/')[2];
            if (!id && u.pathname.startsWith('/watch')) id = u.searchParams.get('v'); // belt+suspenders
            if (id) {
              const t = u.searchParams.get('t') || u.searchParams.get('start');
              const start = t ? `&start=${parseInt(t)}` : '';
              return { kind: 'YouTube', embedUrl: `https://www.youtube-nocookie.com/embed/${id}?autoplay=1${start}` };
            }
            // Channel/playlist/homepage — not embeddable as a specific video
            return null;
          }
          if (host === 'youtu.be') {
            const id = u.pathname.slice(1).split('?')[0].split('/')[0];
            if (id) return { kind: 'YouTube', embedUrl: `https://www.youtube-nocookie.com/embed/${id}?autoplay=1` };
          }

          // Vimeo
          if (host === 'vimeo.com' || host === 'player.vimeo.com') {
            const id = (u.pathname.match(/(\d+)/) || [])[1];
            if (id) return { kind: 'Vimeo', embedUrl: `https://player.vimeo.com/video/${id}?autoplay=1` };
          }

          // Twitch
          if (host === 'twitch.tv' || host.endsWith('.twitch.tv')) {
            const parent = this.embedParent();
            const parts = u.pathname.split('/').filter(Boolean);
            if (parts[0] === 'videos' && parts[1]) {
              return { kind: 'Twitch', embedUrl: `https://player.twitch.tv/?video=${parts[1]}&parent=${parent}&autoplay=true` };
            }
            if (parts[0] && parts[0] !== 'directory') {
              return { kind: 'Twitch', embedUrl: `https://player.twitch.tv/?channel=${parts[0]}&parent=${parent}&autoplay=true` };
            }
          }

          // SoundCloud
          if (host === 'soundcloud.com' || host === 'm.soundcloud.com') {
            return { kind: 'SoundCloud', embedUrl: `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=true&color=%23F5A623` };
          }

          // Spotify
          if (host === 'open.spotify.com' || host === 'spotify.com') {
            const parts = u.pathname.split('/').filter(Boolean);
            const kind = parts[0]; // track | album | playlist | episode | show | artist
            const id = parts[1];
            if (kind && id) {
              return { kind: 'Spotify', embedUrl: `https://open.spotify.com/embed/${kind}/${id}?utm_source=oembed` };
            }
          }

          // Bandcamp (track page)
          if (host.endsWith('bandcamp.com')) {
            return { kind: 'Bandcamp', embedUrl: url };
          }

          // Apple Music / Podcasts
          if (host === 'music.apple.com' || host === 'podcasts.apple.com') {
            return { kind: host === 'music.apple.com' ? 'Apple Music' : 'Apple Podcasts',
                     embedUrl: 'https://embed.music.apple.com' + u.pathname + u.search };
          }

          // Dailymotion
          if (host === 'dailymotion.com' || host === 'dai.ly') {
            const id = host === 'dai.ly' ? u.pathname.slice(1) : (u.pathname.match(/\/video\/([^/?]+)/) || [])[1];
            if (id) return { kind: 'Dailymotion', embedUrl: `https://www.dailymotion.com/embed/video/${id}?autoplay=1` };
          }

          // TikTok — regular videos embed; live goes through yt-dlp extraction
          if (host === 'tiktok.com' || host === 'vm.tiktok.com') {
            const vidMatch = u.pathname.match(/\/video\/(\d+)/);
            if (vidMatch) {
              return { kind: 'TikTok', embedUrl: `https://www.tiktok.com/embed/v2/${vidMatch[1]}` };
            }
            // /live URL — handled by the 'tiktok-live' media type, not as embed
            return null;
          }

          // Facebook public videos
          if (host === 'facebook.com' || host === 'fb.watch') {
            const fbUrl = host === 'fb.watch'
              ? `https://www.facebook.com/watch/?v=${u.pathname.slice(1)}`
              : url;
            return { kind: 'Facebook', embedUrl: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(fbUrl)}&show_text=false&autoplay=true&allowFullScreen=true` };
          }

          // Rumble
          if (host === 'rumble.com') {
            const embedMatch = u.pathname.match(/\/embed\/([^/?]+)/);
            const vidMatch = u.pathname.match(/\/v([a-z0-9]+)-/i);
            if (embedMatch) return { kind: 'Rumble', embedUrl: `https://rumble.com/embed/${embedMatch[1]}/` };
            if (vidMatch) return { kind: 'Rumble', embedUrl: `https://rumble.com/embed/v${vidMatch[1]}/` };
          }

          // Kick.com — player.kick.com requires ?channel=name&parent=<host>
          if (host === 'kick.com') {
            const parent = this.embedParent();
            const parts = u.pathname.split('/').filter(Boolean);
            if (!parts.length) return null; // homepage — not embeddable
            const channel = parts[0];

            // VOD: kick.com/video/VODID or kick.com/channel/videos/VODID
            const vodMatch = u.pathname.match(/\/(?:video|videos)\/([a-z0-9-]+)/i);
            if (vodMatch) {
              return { kind: 'Kick', embedUrl: `https://player.kick.com/?vod=${vodMatch[1]}&parent=${parent}` };
            }

            // Clip: kick.com/clip/CLIPID or kick.com/channel/clips/CLIPID
            const clipMatch = u.pathname.match(/\/clips?\/([a-z0-9-]+)/i);
            if (clipMatch) {
              return { kind: 'Kick', embedUrl: `https://player.kick.com/?clip=${clipMatch[1]}&parent=${parent}` };
            }

            // Category / category browse page — not a stream, skip
            if (channel === 'categories' || channel === 'browse' || channel === 'search') {
              return null;
            }

            // Live channel: kick.com/channelname (or kick.com/channelname/anything)
            //
            // NOT an iframe embed (task BTGZBTY). player.kick.com sends
            // X-Frame-Options: SAMEORIGIN, so the frame is refused from every
            // origin but Kick's own — and per the notes on /api/stream/kick-live,
            // a blocked frame is indistinguishable from a rendered one to the
            // embedder, so we can never detect the failure and the viewer just
            // gets a silent black rectangle. The `parent=` param is a Twitch
            // convention Kick does not honour, which is why hardcoding
            // vintaclectic.github.io never helped on board.vintaclectic.com.
            //
            // The brain resolves the channel's IVS playback URL instead, whose
            // manifest serves access-control-allow-origin:* — so hls.js can play
            // it from ANY origin. `liveChannel` routes to loadKickLive().
            return { kind: 'Kick', liveChannel: channel };
          }

          // X (Twitter) — videos and spaces (best-effort; may need login)
          if (host === 'twitter.com' || host === 'x.com') {
            // Spaces can't be embedded; regular tweets with video use the tweet embed
            const tweetMatch = u.pathname.match(/\/status\/(\d+)/);
            if (tweetMatch) {
              return { kind: 'X', embedUrl: `https://platform.twitter.com/embed/Tweet.html?id=${tweetMatch[1]}&theme=dark` };
            }
          }

          // Instagram — public reels/posts (limited; requires login for most content)
          if (host === 'instagram.com') {
            const reelMatch = u.pathname.match(/\/(p|reel|tv)\/([^/?]+)/);
            if (reelMatch) {
              return { kind: 'Instagram', embedUrl: `https://www.instagram.com/${reelMatch[1]}/${reelMatch[2]}/embed/` };
            }
          }

        } catch (_) {}
        return null;
      }

      /**
       * Lazy-load a JS or module from CDN. Caches by src.
       */
      loadScript(src, opts = {}) {
        if (!this._loadedScripts) this._loadedScripts = {};
        if (this._loadedScripts[src]) return this._loadedScripts[src];
        this._loadedScripts[src] = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          if (opts.module) s.type = 'module';
          s.onload = () => resolve();
          s.onerror = () => reject(new Error('Failed: ' + src));
          document.head.appendChild(s);
        });
        return this._loadedScripts[src];
      }

      loadStyle(href) {
        if (!this._loadedStyles) this._loadedStyles = {};
        if (this._loadedStyles[href]) return;
        this._loadedStyles[href] = true;
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href;
        document.head.appendChild(l);
      }

      setBadge(text) {
        if (!this.typeBadge) return;
        if (text) {
          this.typeBadge.textContent = text;
          this.typeBadge.style.display = '';
        } else {
          this.typeBadge.style.display = 'none';
        }
      }

      async loadMedia(url, title, type) {
        const resolvedTitle = title || this.extractTitle(url);
        const blocked = this._suspiciousPublicMediaReason(url, resolvedTitle);
        if (blocked) {
          this.mediaTitle.textContent = resolvedTitle;
          this.mediaSubtitle.textContent = '';
          this.setBadge(null);
          this.mediaElement = null;
          this.mediaContainer.querySelectorAll(
            'video, audio, img, iframe, .dirrm-audio-visualizer, .dirrm-document-viewer, ' +
            '.dirrm-embed, .dirrm-model-wrap, .dirrm-text-viewer, .dirrm-info-card, ' +
            '.dirrm-error-card, .dirrm-live-badge, .dirrm-selfview, .dirrm-call-ended'
          ).forEach(n => n.remove());
          this.showErrorCard(url, blocked);
          return;
        }
        this.loading.style.display = 'flex';
        this.loading.innerHTML = `
          <div class="dirrm-loading-orb"></div>
          <div class="dirrm-loading-text">Loading ${this.escapeHtml(resolvedTitle)}...</div>
        `;
        this.mediaTitle.textContent = resolvedTitle;
        this.mediaType = this.detectMediaType(url, type);
        this.mediaSubtitle.textContent = '';
        this.setBadge(null);
        this._lastUrl = url;
        this._lastTitle = resolvedTitle;

        // Start a new telemetry session for this media (U3 play history + memory hook)
        this._newPlaySession(url, resolvedTitle, this.mediaType);

        // Play history stack — powers prev()/next() (no playlist concept exists,
        // so we navigate the sequence of things actually loaded). When loading
        // fresh media (not via prev/next) we truncate any forward history.
        if (!this._navigating) {
          this._history = this._history || [];
          this._histIndex = (this._histIndex === undefined) ? -1 : this._histIndex;
          // Drop forward entries if we branched after going back
          if (this._histIndex < this._history.length - 1) {
            this._history = this._history.slice(0, this._histIndex + 1);
          }
          // Avoid duplicating the exact same url back-to-back
          const top = this._history[this._history.length - 1];
          if (!top || top.url !== url) {
            this._history.push({ url, title: resolvedTitle, type });
          }
          this._histIndex = this._history.length - 1;
        }
        this._updateNavButtons && this._updateNavButtons();

        // Kill any armed offline auto-retry. The card is removed just below, but
        // the countdown/timer are owned by the player, so without this an offline
        // channel the user has already navigated away from would fire a retry and
        // yank the surface back (task K3NUPWK).
        this._clearOfflineRetry();

        // Clear any prior media + injected containers (including error cards, live overlays)
        this.mediaContainer.querySelectorAll(
          'video, audio, img, iframe, .dirrm-audio-visualizer, .dirrm-document-viewer, ' +
          '.dirrm-embed, .dirrm-model-wrap, .dirrm-text-viewer, .dirrm-info-card, ' +
          '.dirrm-error-card, .dirrm-live-badge, .dirrm-selfview, .dirrm-call-ended'
        ).forEach(n => n.remove());
        // Restore seek bar visibility (live mode hides it; next media should see it again)
        const seekContainerRestore = this.controls && this.controls.querySelector('.dirrm-seek-container');
        if (seekContainerRestore) seekContainerRestore.style.display = '';
        const skipBtnsRestore = this.controls && this.controls.querySelectorAll('#btn-back10, #btn-fwd10, #btn-prev, #btn-next');
        if (skipBtnsRestore) skipBtnsRestore.forEach(b => { b.style.display = ''; });
        // Reset controls visibility (image/pdf/etc hide them; new load resets)
        this.controls.style.display = '';
        document.getElementById('btn-viz').style.display = 'none';

        // Stop any prior raf loop tied to the old audio
        if (this._vizRaf) { cancelAnimationFrame(this._vizRaf); this._vizRaf = null; }
        // Disarm any pending embed framing-guard — otherwise a guard armed by the
        // previous item fires late and drops its refusal card over THIS item.
        if (this._embedGuard) { clearTimeout(this._embedGuard); this._embedGuard = null; }
        this.mediaElement = null;

        try {
          switch (this.mediaType) {
            case 'live':
              // WebRTC MediaStream — stream object passed via _pendingLiveStream, not a URL.
              await this.loadLiveStream(this._pendingLiveStream || null, this._pendingLocalStream || null);
              break;
            case 'embed':
              await this.loadEmbed(url);
              break;
            case 'stream':
              await this.loadStream(url);
              break;
            case 'video':
              await this.loadVideo(url);
              break;
            case 'audio':
              await this.loadAudio(url);
              break;
            case 'image':
              await this.loadImage(url);
              break;
            case 'pdf':
              this.loadPdf(url);
              break;
            case 'ebook':
              this.loadEbook(url);
              break;
            case 'text':
              await this.loadText(url);
              break;
            case 'model':
              await this.loadModel(url);
              break;
            case 'archive':
              await this.loadArchive(url);
              break;
            case 'torrent':
              this.loadTorrent(url);
              break;
            case 'tiktok-live':
              await this.loadTikTokLive(url);
              break;
            case 'kick-live':
              await this.loadKickLive(url);
              break;
            case 'ytdlp':
              await this.loadYtDlp(url);
              break;
            default:
              await this.loadUnknown(url);
          }
        } catch (err) {
          console.error('Failed to load media:', err);
          this.showErrorCard(url, err && err.message ? err.message : 'Could not load this media.');
        }
        // Update platform badge
        this._updatePlatformBadge(url);
      }

      _updatePlatformBadge(url) {
        const badge = document.getElementById('dirrm-platform-badge');
        if (!badge) return;
        badge.removeAttribute('data-platform');
        badge.textContent = '';
        if (!url) return;
        const u = url.toLowerCase();
        let platform, label;
        if (/youtube\.com|youtu\.be|music\.youtube\.com/.test(u))           { platform = 'youtube';  label = 'YouTube'; }
        else if (/tiktok\.com/.test(u))                                      { platform = 'tiktok';   label = 'TikTok'; }
        else if (/twitch\.tv/.test(u))                                       { platform = 'twitch';   label = 'Twitch'; }
        else if (/kick\.com/.test(u))                                        { platform = 'embed';    label = 'Kick'; }
        else if (/vimeo\.com/.test(u))                                       { platform = 'embed';    label = 'Vimeo'; }
        else if (/soundcloud\.com/.test(u))                                  { platform = 'audio';    label = 'SoundCloud'; }
        else if (/spotify\.com/.test(u))                                     { platform = 'embed';    label = 'Spotify'; }
        else if (/\.(mp3|wav|ogg|flac|aac|m4a|opus)(\?|$)/.test(u))        { platform = 'audio';    label = 'Audio'; }
        else if (/\.(mp4|webm|mkv|mov|m4v|ts)(\?|$)/.test(u))              { platform = 'direct';   label = 'Direct'; }
        else if (/\.(m3u8|mpd)(\?|$)/.test(u))                              { platform = 'direct';   label = 'HLS/DASH'; }
        else if (this.mediaType === 'embed')                                 { platform = 'embed';    label = 'Embed'; }
        else return; // no badge for unknown
        badge.dataset.platform = platform;
        badge.textContent = label;
      }

      /**
       * Beautiful error state — shown when fetch/load fails or media element errors out.
       * Provides direct download + copy URL escape hatches.
       */
      showErrorCard(url, message) {
        this.loading.style.display = 'none';
        this.controls.style.display = 'none';
        // Remove any prior error card to avoid stacking
        this.mediaContainer.querySelectorAll('.dirrm-error-card').forEach(n => n.remove());

        const truncatedUrl = url || '';
        const card = document.createElement('div');
        card.className = 'dirrm-error-card';
        card.innerHTML = `
          <div class="dirrm-error-icon">!</div>
          <div class="dirrm-error-title">This one didn't open.</div>
          <div class="dirrm-error-msg">${this.escapeHtml(message || 'The media could not be loaded in the player.')}</div>
          <div class="dirrm-error-url" title="${this.escapeHtml(truncatedUrl)}">${this.escapeHtml(truncatedUrl)}</div>
          <div class="dirrm-error-actions">
            <a class="dirrm-error-btn" href="${this.escapeHtml(truncatedUrl)}" target="_blank" rel="noopener" download>
              Try Direct Download
            </a>
            <button class="dirrm-error-btn dirrm-error-btn--ghost" data-action="copy">
              Copy URL
            </button>
            <button class="dirrm-error-btn dirrm-error-btn--ghost" data-action="retry">
              Retry
            </button>
          </div>
        `;

        const copyBtn = card.querySelector('[data-action="copy"]');
        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(truncatedUrl);
              copyBtn.textContent = 'Copied';
              setTimeout(() => { copyBtn.textContent = 'Copy URL'; }, 1600);
            } catch (_) {
              copyBtn.textContent = 'Copy failed';
              setTimeout(() => { copyBtn.textContent = 'Copy URL'; }, 1600);
            }
          });
        }
        const retryBtn = card.querySelector('[data-action="retry"]');
        if (retryBtn) {
          retryBtn.addEventListener('click', () => {
            this.loadMedia(this._lastUrl, this._lastTitle, this.mediaType);
          });
        }

        this.mediaContainer.appendChild(card);
      }

      /**
       * HLS RECOVERY — keeps a live stream alive past its token expiry (task X3PS75Z).
       * ---------------------------------------------------------------------------
       * WHY THIS EXISTS. Kick live plays through an AWS IVS manifest whose URL
       * carries a signed token that expires in ~10 MINUTES (measured: 9.6min).
       * Once it lapses, IVS answers the manifest request with a 4xx that carries
       * NO CORS headers — so the browser reports it as
       *   "blocked by CORS policy: No 'Access-Control-Allow-Origin' header"
       * which is a LIE about the cause. The manifest is not origin-locked at all
       * (the token sets aws:strict-origin-enforcement:false and IVS returns
       * `access-control-allow-origin: *` to every origin, verified). The stream
       * died of OLD AGE, not of origin policy. That misleading message is why
       * this looked like a CORS bug for so long.
       *
       * Before this, `new Hls()` had NO error listener whatsoever, so a fatal
       * network error just stopped the video with no card, no retry, no log —
       * a live stream silently froze after ~10 minutes, every time.
       *
       * WHAT IT DOES. On a FATAL error we re-resolve a FRESH manifest URL from
       * the brain (a new token) and reload, rather than retrying the dead URL
       * (which can never recover — the token is expired, not flaky). Non-fatal
       * errors are left to hls.js, which self-heals them.
       */
      _attachHlsRecovery(hls, url, video) {
        const Hls = window.Hls;
        if (!Hls || !hls) return;

        // Only Kick live URLs can be re-resolved; a plain .m3u8 has no issuer to
        // ask for a new token, so for those we fall back to hls.js's own recovery.
        const kickChannel = this._kickLiveChannel(this._lastUrl || '') || this._kickChannelForRefresh || null;
        this._kickChannelForRefresh = kickChannel;
        this._hlsReloads = 0;

        hls.on(Hls.Events.ERROR, async (_evt, data) => {
          if (!data || !data.fatal) return;            // hls.js handles non-fatal itself
          if (this._hls !== hls) return;               // stale instance, we've moved on

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            try { hls.recoverMediaError(); return; } catch (_) {}
          }

          // A fatal NETWORK error on a token-signed manifest = expired token.
          // Retrying the same URL is futile; get a new one.
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR && kickChannel) {
            if (this._hlsReloads >= 5) {
              return this._showLiveOfflineCard(
                this._lastUrl || url, kickChannel,
                'The live stream kept dropping after several reconnects.', 'unreachable');
            }
            this._hlsReloads++;
            try {
