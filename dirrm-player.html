              const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
              const resp = await fetch(
                `${apiBase}/api/stream/kick-live?channel=${encodeURIComponent(kickChannel)}&fresh=1`,
                { credentials: 'include' });
              const fresh = await resp.json();
              if (this._hls !== hls) return;           // superseded while awaiting
              if (fresh && fresh.ok && fresh.streamUrl) {
                hls.loadSource(this._corsSafeStreamUrl(fresh.streamUrl)); // new token, same instance
                hls.startLoad();
                return;
              }
              // The brain says they're no longer live — that's not an error, it's news.
              return this._showLiveOfflineCard(
                this._lastUrl || url, kickChannel,
                (fresh && fresh.message) || 'The stream ended.',
                (fresh && fresh.error) || 'not_live');
            } catch (_) {
              try { hls.startLoad(); } catch (__) {}   // brain unreachable — let hls retry
              return;
            }
          }

          // Anything else fatal and unrecoverable.
          try { hls.startLoad(); } catch (_) {}
        });
      }

      async loadVideo(url) {
        this.setBadge('Video');
        const video = document.createElement('video');
        video.controls = false;
        video.playsInline = true;
        video.volume = this.volume;

        const isM3U8 = /\.m3u8(\?|#|$)/i.test(url);
        const isMPD  = /\.mpd(\?|#|$)/i.test(url);

        // HLS/DASH streams can have CORS restrictions (AWS IVS, CDNs with origin locks).
        // Proxy cross-origin streams upfront so hls.js/dash.js get CORS-clean manifests.
        // Task JZJ5768: direct IVS URLs (kick.com's actual stream backend) were failing
        // because the token restricts playback to kick.com domains only.
        const streamUrl = (isM3U8 || isMPD) && this._shouldProxyUpfront(url) ? this._proxify(url) : url;

        if (isM3U8) {
          this.setBadge('HLS Stream');
          // Native HLS (Safari, iOS) — just set src
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
          } else {
            try {
              await this.loadScript('https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js');
              if (window.Hls && window.Hls.isSupported()) {
                // Tear down any previous instance — a second loadVideo() would
                // otherwise leave the old hls.js pulling segments forever.
                if (this._hls) { try { this._hls.destroy(); } catch (_) {} this._hls = null; }
                const hls = new window.Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                this._hls = hls;
                this._attachHlsRecovery(hls, streamUrl, video);
              } else {
                video.src = streamUrl; // last-ditch
              }
            } catch (e) {
              console.warn('hls.js load failed, native attempt', e);
              video.src = streamUrl;
            }
          }
        } else if (isMPD) {
          this.setBadge('DASH Stream');
          try {
            await this.loadScript('https://cdn.dashjs.org/latest/dash.all.min.js');
            if (window.dashjs) {
              const dash = window.dashjs.MediaPlayer().create();
              dash.initialize(video, streamUrl, true);
              this._dash = dash;
            } else {
              video.src = streamUrl;
            }
          } catch (e) {
            console.warn('dash.js load failed', e);
            video.src = streamUrl;
          }
        } else {
          // Direct video file. Cross-origin (open-dir / junk cert) → proxy
          // upfront with crossOrigin so it loads AND is CORS-clean. Direct
          // fallback if the proxy itself errors.
          if (this._shouldProxyUpfront(url)) {
            video.crossOrigin = 'anonymous';
            video.dataset.proxied = '1';
            video.addEventListener('error', () => {
              if (video.dataset.fellBack === '1') return;
              video.dataset.fellBack = '1';
              try { video.removeAttribute('crossorigin'); video.src = url; video.load && video.load(); } catch (_) {}
            }, { once: true });
            video.src = this._proxify(url);
          } else {
            this._setMediaSrc(video, url);
          }
        }

        video.addEventListener('loadedmetadata', () => {
          this.loading.style.display = 'none';
          this.timeDuration.textContent = this.formatTime(video.duration);
        });

        /* THE OVERLAY MUST NEVER OUTLIVE THE FIRST FRAME.
           .dirrm-loading is inset:0, z-index:5 and has NO pointer-events:none —
           it is a full-bleed shield over the media. `loadedmetadata` alone was
           the only thing dismissing it, and that is not guaranteed for a LIVE
           HLS stream (Kick): hls.js can be pushing decoded frames and audio
           while metadata never resolves the way a file does, leaving the shield
           up over playing video. That reads as "audio plays, video dead, clicks
           do nothing" — the exact report. Every one of these events proves a
           frame exists, so any of them is sufficient to drop the shield. */
        ['loadeddata', 'canplay', 'playing'].forEach(ev =>
          video.addEventListener(ev, () => { this.loading.style.display = 'none'; }, { once: true })
        );

        video.addEventListener('timeupdate', () => {
          if (this._scrubbing) return; // finger owns the bar while scrubbing
          const progress = (video.currentTime / video.duration) * 100;
          this.seekFill.style.width = `${progress}%`;
          this.timeCurrent.textContent = this.formatTime(video.currentTime);
        });

        video.addEventListener('play',  () => { this.isPlaying = true;  this.playIcon.textContent = '⏸'; });
        video.addEventListener('pause', () => { this.isPlaying = false; this.playIcon.textContent = '▶'; });
        video.addEventListener('ended', () => { this.isPlaying = false; this.playIcon.textContent = '▶'; });

        video.addEventListener('error', () => {
          // Fallback chain: if video errors, present download option
          console.warn('Video failed, offering fallback for', url);
          this.loadUnknown(url, 'Could not play video');
        });

        this.mediaContainer.appendChild(video);
        this.mediaElement = video;
        this._attachTelemetry(video);

        // ALWAYS autoplay — no clicking, ever (Vinta directive).
        // Muted autoplay is ALWAYS permitted by every browser with zero gesture.
        // So: try with sound; if blocked, mute → play → unmute on the first
        // ambient gesture (or immediately if the policy lets us). The user never
        // has to touch anything.
        this._autoplay(video);
      }

      // Gesture-free autoplay. Tries sound-on; on block, falls to muted autoplay
      // (always allowed) and arms a one-shot unmute on the next pointer/key/visibility
      // event so sound returns the instant the user does literally anything — but
      // playback NEVER waits on a click to begin.
      async _autoplay(el, afterPlay) {
        const tryUnmuteOnGesture = () => {
          const unmute = () => {
            try { el.muted = false; el.volume = this.volume; } catch (_) {}
            if (afterPlay) { try { afterPlay(); } catch (_) {} }
          };
          // Unmute on ANY ambient interaction with the page.
          const opts = { once: true, capture: true };
          ['pointerdown','keydown','touchstart','click','wheel','scroll'].forEach(ev =>
            window.addEventListener(ev, unmute, opts));
          // Also try to unmute on a short delay — some embeds/policies allow it.
          setTimeout(() => { try { if (el.muted) { el.muted = false; el.volume = this.volume; if (afterPlay) afterPlay(); } } catch (_) {} }, 400);
        };
        try {
          el.muted = false;
          await el.play();
          if (afterPlay) { try { afterPlay(); } catch (_) {} }
        } catch (e) {
          // Sound-on blocked. Mute and play (always allowed), then arm unmute.
          try {
            el.muted = true;
            await el.play();
            tryUnmuteOnGesture();
          } catch (e2) {
            // Even muted autoplay failed — last resort, retry shortly. Still no click.
            console.warn('muted autoplay failed, retrying', e2 && e2.name);
            setTimeout(async () => {
              try { el.muted = true; await el.play(); tryUnmuteOnGesture(); } catch (_) {}
            }, 300);
          }
        }
      }

      /**
       * Streaming wrapper — routes m3u8 / mpd / .ism / generic streams through loadVideo.
       */
      async loadStream(url) {
        return this.loadVideo(url);
      }

      /**
       * Live WebRTC MediaStream handler.
       *
       * Called for type:'live'. `stream` is a live RTCPeerConnection remote MediaStream
       * (or any MediaStream from getUserMedia / synthetic). `localStream` is the optional
       * local camera feed that appears as a small self-view PIP overlay.
       *
       * Mechanism: dirrm-launch.js stores MediaStream objects in window.__DIRRM_LIVE_STREAMS
       * (keyed by a random ID) in the SAME document, then sends a postMessage with that key.
       * handleMessage() retrieves them here — no cross-origin boundary is crossed, so the
       * MediaStream object transfers cleanly. This is the ONLY safe path for MediaStream
       * handoff; JSON serialisation of a MediaStream is impossible.
       *
       * Controls: seek bar is hidden (live = no timeline). Mute/unmute and mode switch
       * (main/mini/pip/theater) continue to work normally. The LIVE badge pulses.
       */
      async loadLiveStream(stream, localStream) {
        this._liveStream = stream;
        this._localStream = localStream || null;

        // ── Seek controls OFF for live — no timeline ──────────────────────────
        const seekContainer = this.controls && this.controls.querySelector('.dirrm-seek-container');
        if (seekContainer) seekContainer.style.display = 'none';
        // Skip/prev/next hidden for live
        const skipBtns = this.controls && this.controls.querySelectorAll('#btn-back10, #btn-fwd10, #btn-prev, #btn-next');
        if (skipBtns) skipBtns.forEach(b => { b.style.display = 'none'; });

        this.setBadge('LIVE');

        if (!stream) {
          this._showCallEnded('No stream received.');
          return;
        }

        // ── Remote video element ───────────────────────────────────────────────
        const video = document.createElement('video');
        video.className = 'dirrm-live-video';
        video.playsInline = true;
        video.autoplay = true;
        video.muted = false;   // remote stream: NOT muted (user wants to hear the other person)
        video.volume = this.volume;
        video.srcObject = stream;

        // ── LIVE badge overlay ─────────────────────────────────────────────────
        const badge = document.createElement('div');
        badge.className = 'dirrm-live-badge';
        badge.setAttribute('aria-label', 'Live stream active');
        badge.innerHTML = '<span class="dirrm-live-dot" aria-hidden="true"></span>LIVE';

        this.mediaContainer.appendChild(video);
        this.mediaContainer.appendChild(badge);

        this.mediaElement = video;
        this.loading.style.display = 'none';

        // Autoplay (remote stream, so muted=false — but if blocked, mute then arm unmute)
        try {
          await video.play();
          this.isPlaying = true;
          this.playIcon.textContent = '⏸';
        } catch {
          video.muted = true;
          try {
            await video.play();
            this.isPlaying = true;
            this.playIcon.textContent = '⏸';
            // Arm unmute on next gesture
            const unmute = () => { try { video.muted = false; video.volume = this.volume; } catch (_) {} };
            ['pointerdown','keydown','touchstart'].forEach(ev =>
              window.addEventListener(ev, unmute, { once: true, capture: true }));
          } catch (e) {
            console.warn('[dirrm] live autoplay fully blocked', e);
          }
        }

        // ── Track ended → call ended card ──────────────────────────────────────
        const checkEnded = () => {
          const tracks = stream.getTracks();
          const allEnded = tracks.length > 0 && tracks.every(t => t.readyState === 'ended');
          if (allEnded) this._showCallEnded();
        };
        stream.getTracks().forEach(t => {
          t.addEventListener('ended', checkEnded);
        });
        // Also watch for the stream losing all tracks dynamically
        stream.addEventListener('removetrack', () => {
          const remaining = stream.getTracks().filter(t => t.readyState !== 'ended');
          if (remaining.length === 0) this._showCallEnded();
        });

        // ── Self-view PIP overlay ──────────────────────────────────────────────
        this._attachSelfView(this._localStream);

        // ── Volume sync ────────────────────────────────────────────────────────
        video.addEventListener('volumechange', () => {
          this.isMuted = video.muted || video.volume === 0;
          this.volumeIcon.textContent = this.isMuted ? '🔇' : '🔊';
        });
      }

      /**
       * Attach or replace the self-view PIP (local camera) inside the media container.
       * Safe to call multiple times — removes the previous self-view first.
       * Calling with null removes the self-view entirely.
       */
      _attachSelfView(localStream) {
        // Remove any existing self-view
        this.mediaContainer.querySelectorAll('.dirrm-selfview').forEach(el => el.remove());
        if (!localStream) return;

        this._localStream = localStream;

        const wrap = document.createElement('div');
        wrap.className = 'dirrm-selfview';
        wrap.title = 'Your camera (drag to reposition)';
        wrap.setAttribute('aria-label', 'Self view');

        const selfVideo = document.createElement('video');
        selfVideo.playsInline = true;
        selfVideo.muted = true;       // local stream — always muted to prevent feedback
        selfVideo.autoplay = true;
        selfVideo.srcObject = localStream;

        wrap.appendChild(selfVideo);
        this.mediaContainer.appendChild(wrap);

        selfVideo.play().catch(() => {});

        // Simple drag-to-reposition for the self-view PIP within the media container.
        // Clamped so it NEVER escapes the media container bounds (no-overflow rule).
        let dragging = false, ox = 0, oy = 0, startRight = 0, startBottom = 0;
        const onDown = (e) => {
          dragging = true;
          const touch = e.touches ? e.touches[0] : e;
          ox = touch.clientX;
          oy = touch.clientY;
          const cs = getComputedStyle(wrap);
          startRight  = parseInt(cs.right,  10) || 8;
          startBottom = parseInt(cs.bottom, 10) || 8;
          e.preventDefault();
        };
        const onMove = (e) => {
          if (!dragging) return;
          const touch = e.touches ? e.touches[0] : e;
          const dx = touch.clientX - ox;
          const dy = touch.clientY - oy;
          const parent = this.mediaContainer;
          const pw = parent.offsetWidth;
          const ph = parent.offsetHeight;
          const ww = wrap.offsetWidth;
          const wh = wrap.offsetHeight;
          const newRight  = Math.max(4, Math.min(pw - ww - 4, startRight  - dx));
          const newBottom = Math.max(4, Math.min(ph - wh - 4, startBottom + dy));
          wrap.style.right  = newRight  + 'px';
          wrap.style.bottom = newBottom + 'px';
          wrap.style.left   = 'auto';
          wrap.style.top    = 'auto';
          e.preventDefault();
        };
        const onUp = () => { dragging = false; };
        wrap.addEventListener('mousedown',  onDown);
        wrap.addEventListener('touchstart', onDown, { passive: false });
        document.addEventListener('mousemove',  onMove);
        document.addEventListener('touchmove',  onMove, { passive: false });
        document.addEventListener('mouseup',  onUp);
        document.addEventListener('touchend', onUp);
      }

      /**
       * Show the "call ended" state. Replaces the live video with an info card.
       * The controls bar stays for mute/close (user may want to dismiss).
       */
      _showCallEnded(reason) {
        // Remove live badge if still present
        this.mediaContainer.querySelectorAll('.dirrm-live-badge, .dirrm-selfview').forEach(el => el.remove());
        // Pause the frozen video if still attached
        if (this.mediaElement && this.mediaElement.pause) {
          try { this.mediaElement.pause(); } catch (_) {}
        }

        // Remove the live video element
        this.mediaContainer.querySelectorAll('video.dirrm-live-video').forEach(el => el.remove());

        // Don't stack call-ended cards
        this.mediaContainer.querySelectorAll('.dirrm-call-ended').forEach(el => el.remove());

        const card = document.createElement('div');
        card.className = 'dirrm-call-ended';
        card.innerHTML = `
          <div class="dirrm-call-ended-icon" aria-hidden="true">📵</div>
          <div class="dirrm-call-ended-title">Call Ended</div>
          <div class="dirrm-call-ended-meta">${reason ? this.escapeHtml(reason) : 'The connection was closed.'}</div>
        `;
        this.mediaContainer.appendChild(card);

        this.isPlaying = false;
        this.playIcon.textContent = '▶';

        // Re-show seek container for next non-live load
        const seekContainer = this.controls && this.controls.querySelector('.dirrm-seek-container');
        if (seekContainer) seekContainer.style.display = '';

        // Emit liveEnded event to parent so DirMegle can clean up peer connection
        window.parent?.postMessage({ action: 'liveEnded' }, '*');
      }

      /**
       * Platform embed loader — YouTube, Vimeo, Twitch, SoundCloud, Spotify, Bandcamp, etc.
       * Hides standard transport controls (the iframe has its own).
       */
      async loadEmbed(url) {
        const embed = this.detectEmbed(url);
        if (!embed) {
          // Defensive — should not reach here unless type was forced
          return this.loadUnknown(url, 'Unknown embed source');
        }
        // Kick live channels are NOT iframe-embeddable (X-Frame-Options:
        // SAMEORIGIN). detectEmbed hands us a liveChannel instead of an
        // embedUrl; resolve it to a CORS-open HLS manifest via the brain.
        if (embed.liveChannel) {
          return this.loadKickLive(embed.liveChannel, url);
        }

        this.setBadge(embed.kind);
        this.mediaSubtitle.textContent = '';

        const wrap = document.createElement('div');
        wrap.className = 'dirrm-embed';
        const iframe = document.createElement('iframe');
        iframe.src = embed.embedUrl;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write; accelerometer; gyroscope');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');

        // Some providers (Kick's player.kick.com sends X-Frame-Options: SAMEORIGIN)
        // refuse to be framed at all. A browser that blocks a frame this way STILL
        // fires `load`, so a load event alone never proves the embed is alive —
        // without this guard the spinner just hides and leaves a dead black
        // rectangle with no explanation and no way forward.
        let settled = false;
        const clearGuard = () => {
          if (this._embedGuard) { clearTimeout(this._embedGuard); this._embedGuard = null; }
        };
        const framingRefused = () => {
          if (settled) return;
          settled = true;
          clearGuard();
          wrap.remove();
          this.loadEmbedRefused(url, embed.kind);
        };

        iframe.addEventListener('load', () => {
          this.loading.style.display = 'none';
          // A cross-origin frame that actually rendered exposes a live (opaque)
          // window with a non-zero frame count container. A frame blocked by
          // X-Frame-Options / CSP leaves contentWindow null or unreachable.
          let usable = true;
          try {
            if (!iframe.contentWindow) usable = false;
          } catch (_) {
            usable = true; // cross-origin throw = a real document is there
          }
          if (!usable) return framingRefused();
          settled = true;
          clearGuard();
        });
        iframe.addEventListener('error', framingRefused);

        // Bounded: if the frame never loads at all, stop waiting and be honest.
        clearGuard();
        this._embedGuard = setTimeout(() => {
          if (!settled) framingRefused();
        }, 4500);

        wrap.appendChild(iframe);
        this.mediaContainer.appendChild(wrap);

        // Embeds bring their own UI — hide our transport bar
        this.controls.style.display = 'none';
        this.mediaElement = null;
      }

      /**
       * Shown when a platform refuses to be embedded from this origin.
       * Reuses the existing .dirrm-info-card surface (absolute, inset:0,
       * overflow:auto) so it fills the player box, scrolls internally when the
       * viewport is short, and never bleeds onto the rail, transport bar or
       * window chrome. The player window stays fully usable — the queue can
       * still advance past this item.
       */
      loadEmbedRefused(url, kind) {
        this.loading.style.display = 'none';
        this.controls.style.display = 'none';
        this.mediaElement = null;
        this.setBadge(kind || 'Embed');

        const host = location.hostname || 'this page';
        const label = kind || 'This site';
        let openUrl = url;
        let openLabel = `Open on ${label}`;
        try {
          const u = new URL(url);
          const channel = u.pathname.split('/').filter(Boolean)[0];
          if (u.hostname.replace(/^www\./, '') === 'kick.com' && channel) {
            openUrl = `https://kick.com/${channel}`;
            openLabel = 'Open on Kick';
          }
        } catch (_) {}

        const card = document.createElement('div');
        card.className = 'dirrm-info-card';
        card.innerHTML = `
          <div class="dirrm-info-card-inner">
            <div class="dirrm-info-icon">🚫</div>
            <div class="dirrm-info-title">${this.escapeHtml(label)} refused to embed</div>
            <div class="dirrm-info-meta">
              ${this.escapeHtml(label)} will not allow its player to be framed from
              <strong>${this.escapeHtml(host)}</strong>. Watch it on the source site instead —
              the queue still works, so you can skip to the next item.
            </div>
            <div class="dirrm-info-actions">
              <a class="dirrm-info-btn" href="${this.escapeHtml(openUrl)}" target="_blank" rel="noopener">${this.escapeHtml(openLabel)}</a>
            </div>
          </div>
        `;
        this.mediaContainer.appendChild(card);
      }

      async loadAudio(url) {
        this.setBadge('Audio');
        // Try without crossOrigin first — if server doesn't send CORS headers,
        // crossOrigin='anonymous' causes a load error even though plain fetch works.
        // We attempt Web Audio; if blocked, fall back to a time-based fake analyser.
        const audio = document.createElement('audio');
        audio.volume = this.volume;

        // Build visualizer container
        const vizWrap = document.createElement('div');
        vizWrap.className = 'dirrm-audio-visualizer';
        const canvas = document.createElement('canvas');
        const label = document.createElement('div');
        label.className = 'dirrm-viz-label';
        vizWrap.appendChild(canvas);
        vizWrap.appendChild(label);
        this.mediaContainer.appendChild(vizWrap);
        this.mediaContainer.appendChild(audio);
        this.mediaElement = audio;
        this._attachTelemetry(audio);
        this._vizCanvas = canvas;
        this._vizLabel = label;

        // Web Audio setup — try with CORS, fall back without
        let analyser = null, dataArray = null, rafId = null;
        let fakeMode = false; // true when CORS blocked Web Audio
        const setupAudio = () => {
          if (analyser) return;
          try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            this._audioCtx = actx;
            // CRITICAL: Chrome creates AudioContexts SUSPENDED until a user
            // gesture. Once we call createMediaElementSource, ALL output routes
            // through this graph — so if it stays suspended, there is NO SOUND
            // (this is the "plays no sound" bug). Resume it; the play() click
            // already counts as the gesture.
            if (actx.state === 'suspended') actx.resume().catch(() => {});
            const src = actx.createMediaElementSource(audio);
            analyser = actx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            // src → analyser → destination (speakers). The destination link is
            // what makes sound come out. Missing it = silent visualizer.
            src.connect(analyser);
            analyser.connect(actx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            this._analyser = analyser;
            this._dataArray = dataArray;
            // Belt-and-suspenders: keep trying to resume on the next ticks in
            // case the gesture landed slightly after context creation.
            const kick = () => { if (actx.state === 'suspended') actx.resume().catch(() => {}); };
            setTimeout(kick, 200); setTimeout(kick, 1000);
            document.addEventListener('click', kick, { once: true });
          } catch(e) {
            // createMediaElementSource can THROW on a tainted (cross-origin)
            // source. In that case we did NOT reroute audio — the <audio>
            // element plays normally on its own. We just lose the real
            // analyser and use a synthetic one for the visualizer. SOUND STILL
            // PLAYS because we never hijacked the output.
            console.warn('WebAudio analyser unavailable — audio plays direct, viz synthetic:', e && e.name);
            fakeMode = true;
            dataArray = new Uint8Array(1024);
            this._dataArray = dataArray;
          }
        };

        // Load audio. For cross-origin media (open-dir hosts with junk certs /
        // no CORS) we proxy UPFRONT through the brain and set crossOrigin so the
        // Web Audio graph gets a CORS-clean source — that's what restores BOTH
        // sound and real visualizer reactivity (a tainted source is silently
        // muted by Chrome when routed through createMediaElementSource).
        if (this._shouldProxyUpfront(url)) {
          audio.crossOrigin = 'anonymous';
          audio.dataset.proxied = '1';
          audio.dataset.origUrl = url;
          const px = this._proxify(url);
          // If even the proxied load errors, fall back to a direct (un-CORS) load
          // so at least sound plays (viz goes synthetic via fakeMode).
          audio.addEventListener('error', () => {
            if (audio.dataset.fellBack === '1') return;
            audio.dataset.fellBack = '1';
            console.warn('[DirRM] proxied audio failed, last-ditch direct load');
            try { audio.removeAttribute('crossorigin'); audio.src = url; audio.load && audio.load(); } catch (_) {}
          }, { once: true });
          audio.src = px;
        } else {
          // Same-origin or already safe — direct, with one-time proxy retry.
          this._setMediaSrc(audio, url);
        }

        // Canvas resize
        const resizeCanvas = () => {
          const r = vizWrap.getBoundingClientRect();
          if (r.width && r.height) {
            canvas.width = r.width * devicePixelRatio;
            canvas.height = r.height * devicePixelRatio;
          }
        };
        new ResizeObserver(resizeCanvas).observe(vizWrap);
        resizeCanvas();

        // Viz modes — the 5 native DirRM modes + the 6 OG DirHaven (TUNEZ)
        // visualizers ported verbatim: ogbars, ogwave, ring, nebula, fire, crystal.
        // THE UNION (Vinta directive 2026-08-04): the standalone player and the
        // DirHaven app carry the SAME 20 visualizers. The 11 native DirRM modes
        // below, plus the 9 ported from DirHaven's AudioFusion. `nebula` here is
        // the OG-TUNEZ one and stays as-is; DirHaven's violet particle-network
        // nebula comes in as `dhnebula` so neither effect is lost.
        const VIZ_MODES = ['bars', 'wave', 'radial', 'mirror', 'particles',
                           'ogbars', 'ogwave', 'ring', 'nebula', 'fire', 'crystal',
                           'sacred', 'mercury', 'aurora', 'grid', 'chromatic',
                           'landscape', 'helix', 'constellation', 'vinyl', 'dhnebula'];
        const VIZ_LABELS = { bars:'Bars', wave:'Wave', radial:'Radial', mirror:'Mirror', particles:'Particles',
                             ogbars:'OG Bars', ogwave:'OG Wave', ring:'Ring', nebula:'Nebula', fire:'Fire', crystal:'Crystal',
                             sacred:'Sacred', mercury:'Mercury', aurora:'Aurora', grid:'Grid', chromatic:'Chromatic',
                             landscape:'Landscape', helix:'Helix', constellation:'Constellation',
                             vinyl:'Vinyl', dhnebula:'DH Nebula' };
        // Modes ported from DirHaven's AudioFusion — they draw off a 0..1 `energy`
        // scalar (derived from the live analyser) plus seeded per-instance state.
        const DH_MODES = new Set(['sacred','mercury','aurora','grid','chromatic',
                                  'landscape','helix','constellation','vinyl','dhnebula']);
        this._vizMode = this._vizMode || 'bars';
        this._vizModeList = VIZ_MODES;
        this._vizLabelMap = VIZ_LABELS;
        label.textContent = VIZ_LABELS[this._vizMode];
        document.getElementById('btn-viz').style.display = '';

        // Particle state (native particles mode)
        const particles = Array.from({length: 80}, () => ({
          x: Math.random(), y: Math.random() + 0.2,
          vx: (Math.random() - 0.5) * 0.002,
          vy: -(Math.random() * 0.003 + 0.001),
          size: Math.random() * 3 + 1, life: Math.random(),
        }));

        // ---- OG DirHaven (TUNEZ) visualizer state ----
        // The OG drawers read 0..1 float arrays. We derive smoothFreq01 / timeData01
        // from the live dataArray (real Web Audio) OR the synthetic one (fakeMode),
        // so the OG modes look identical to DirHaven with REAL audio reactivity.
        const OG_BINS = 64;
        const ogSmoothFreq = new Float32Array(OG_BINS);
        const ogTimeData   = new Float32Array(OG_BINS).fill(0.5);
        const ogBarCaps    = new Float32Array(OG_BINS);
        const ogTimeArr    = new Uint8Array(2048); // for real time-domain in OG wave
        const nebulaP = Array.from({length: 80}, () => ({
          x: Math.random(), y: Math.random(), sz: Math.random()*2+1,
          sp: Math.random()*0.002+0.001, a: Math.random()*Math.PI*2,
        }));

        // ---- DirHaven (AudioFusion) visualizer state, ported verbatim ----
        // The DH drawers are seeded so a given track always looks the same; the
        // seed is the current source URL, matching AudioFusion's `seed={item.id}`.
        const dhHash = (s) => {
          let x = 2166136261;
          for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
          return x >>> 0;
        };
        const dhMulberry = (a) => function () {
          let x = (a += 0x6D2B79F5);
          x = Math.imul(x ^ (x >>> 15), x | 1);
          x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
        const dhRng = dhMulberry(dhHash(String(url || 'dirhaven')));
        const dhNodes = Array.from({length: 22}, () => ({
          x: dhRng(), y: dhRng(), vx: (dhRng()-0.5)*0.12, vy: (dhRng()-0.5)*0.12,
        }));
        const dhStars = Array.from({length: 80}, () => ({
          x: dhRng(), y: dhRng(), size: 0.5 + dhRng()*2.5, brightness: dhRng(), phase: dhRng()*Math.PI*2,
        }));
        const dhParticles = Array.from({length: 60}, () => ({
          angle: dhRng()*Math.PI*2, speed: 0.3 + dhRng()*2.5,
          life: dhRng(), hue: dhRng()*360, size: 1 + dhRng()*3,
        }));
        const dhGridDots = Array.from({length: 15*15}, (_, i) => ({
          col: i % 15, row: Math.floor(i / 15), phase: dhRng()*Math.PI*2,
        }));
        const dhSacredPhases = Array.from({length: 6}, () => dhRng()*Math.PI*2);
        let ogT = 0;
        const OGC = { gold:'#F5A623', goldLight:'#FFD700' };
        // Fold the current dataArray (0..255, freq) into ogSmoothFreq (0..1, 64 bins).
        const ogSyncData = () => {
          ogT++;
          const n = dataArray ? dataArray.length : 0;
          for (let i = 0; i < OG_BINS; i++) {
            let v = 0;
            if (n) { const idx = Math.floor(i * n / OG_BINS); v = (dataArray[idx] || 0) / 255; }
            ogSmoothFreq[i] += (v - ogSmoothFreq[i]) * 0.3;
          }
          // time-domain for OG wave: pull real if we have an analyser, else synth.
          if (analyser && !fakeMode) {
            analyser.getByteTimeDomainData(ogTimeArr);
            for (let i = 0; i < OG_BINS; i++) {
              const idx = Math.floor(i * ogTimeArr.length / OG_BINS);
              ogTimeData[i] = (ogTimeArr[idx] || 128) / 255;
            }
          } else {
            for (let i = 0; i < OG_BINS; i++) {
              const wave = Math.sin(ogT*0.005 + i*0.2)*0.3 + Math.sin(ogT*0.011 + i*0.5)*0.15;
              const energy = this.isPlaying ? 0.6 : 0.05;
              ogTimeData[i] = 0.5 + wave * energy;
            }
          }
        };

        const GOLD = '#F5A623';
        const GOLD2 = 'rgba(245,166,35,';

        const draw = () => {
          rafId = requestAnimationFrame(draw);
          this._vizRaf = rafId;
          const W = canvas.width, H = canvas.height;
          const ctx = canvas.getContext('2d');
          const playing = this.isPlaying;

          if (!dataArray) { ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); return; }

          if (fakeMode && playing) {
            // Synthesize frequency data: bass pulse + treble shimmer
            const t = performance.now() / 1000;
            const beat = 0.5 + 0.5 * Math.sin(t * 6.28 * 1.8); // ~108bpm base
            const beat2 = 0.5 + 0.5 * Math.sin(t * 6.28 * 3.6);
            for (let i = 0; i < dataArray.length; i++) {
              const norm = i / dataArray.length;
              let v = 0;
              if (norm < 0.08) v = beat * 220 + Math.random() * 30;          // bass
              else if (norm < 0.2) v = beat * 140 + Math.random() * 40;       // low-mid
              else if (norm < 0.5) v = beat2 * 80 + Math.random() * 50;       // mid
              else v = (0.3 + 0.3 * Math.sin(t*5 + i)) * 60 + Math.random()*20; // high
              dataArray[i] = Math.min(255, Math.max(0, v));
            }
          } else if (!fakeMode && analyser) {
            analyser.getByteFrequencyData(dataArray);
          } else if (!playing) {
            // Decay to silence when paused
            for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 4);
          }
          const mode = this._vizMode;

          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.fillRect(0, 0, W, H);

          if (mode === 'bars') {
            const bars = Math.floor(W / (4 * devicePixelRatio));
            const bw = W / bars;
            for (let i = 0; i < bars; i++) {
              const v = dataArray[Math.floor(i * dataArray.length / bars)] / 255;
              const h = v * H * 0.85;
              const x = i * bw;
              const grad = ctx.createLinearGradient(0, H, 0, H - h);
              grad.addColorStop(0, GOLD2 + '0.9)');
              grad.addColorStop(1, GOLD2 + '0.3)');
              ctx.fillStyle = grad;
              ctx.fillRect(x + 1, H - h, bw - 2, h);
            }

          } else if (mode === 'wave') {
            if (analyser && !fakeMode) analyser.getByteTimeDomainData(dataArray);
            // In fakeMode, dataArray already has synthesized values — interpret as wave.
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 2 * devicePixelRatio;
            ctx.shadowColor = GOLD;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            const step = W / dataArray.length;
            for (let i = 0; i < dataArray.length; i++) {
              const y = (dataArray[i] / 128) * (H / 2);
              i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * step, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

          } else if (mode === 'radial') {
            const cx = W / 2, cy = H / 2;
            const R = Math.min(W, H) * 0.3;
            const bars = 128;
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 1.5 * devicePixelRatio;
            for (let i = 0; i < bars; i++) {
              const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
              const v = dataArray[Math.floor(i * dataArray.length / bars)] / 255;
              const len = v * R * 1.2;
              const cos = Math.cos(angle), sin = Math.sin(angle);
              ctx.globalAlpha = 0.4 + v * 0.6;
              ctx.beginPath();
              ctx.moveTo(cx + cos * R, cy + sin * R);
              ctx.lineTo(cx + cos * (R + len), cy + sin * (R + len));
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
            // Core glow
            const avg = dataArray.slice(0, 64).reduce((a,b) => a+b, 0) / 64 / 255;
            const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.6);
            grd.addColorStop(0, GOLD2 + (avg * 0.6) + ')');
            grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd;
            ctx.beginPath(); ctx.arc(cx, cy, R * 0.6, 0, Math.PI*2); ctx.fill();

          } else if (mode === 'mirror') {
            const bars = Math.floor(W / (3 * devicePixelRatio));
            const bw = W / bars;
            const cy = H / 2;
            for (let i = 0; i < bars; i++) {
              const v = dataArray[Math.floor(i * dataArray.length / bars)] / 255;
              const h = v * cy * 0.95;
              const x = i * bw;
              const grad = ctx.createLinearGradient(0, cy, 0, cy - h);
              grad.addColorStop(0, GOLD2 + '0.9)');
              grad.addColorStop(1, GOLD2 + '0.1)');
              ctx.fillStyle = grad;
              ctx.fillRect(x + 1, cy - h, bw - 2, h);      // top half
              ctx.fillRect(x + 1, cy,     bw - 2, h);      // bottom mirror
            }
            // Center line
            ctx.strokeStyle = GOLD2 + '0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();

          } else if (mode === 'particles') {
            const avg = dataArray.slice(0, 128).reduce((a,b)=>a+b,0)/128/255;
            particles.forEach(p => {
              p.vy -= avg * 0.005;
              p.x += p.vx; p.y += p.vy;
              p.life -= 0.004;
              if (p.life <= 0 || p.y < -0.05) {
                p.x = Math.random(); p.y = 1.05;
                p.vx = (Math.random()-0.5)*0.002;
                p.vy = -(Math.random()*0.003+0.001) - avg*0.01;
                p.size = Math.random()*3+1; p.life = 1;
              }
              ctx.globalAlpha = p.life * (0.4 + avg * 0.6);
              ctx.fillStyle = GOLD;
              ctx.shadowColor = GOLD; ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.arc(p.x*W, p.y*H, p.size*devicePixelRatio, 0, Math.PI*2);
              ctx.fill();
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

          } else if (mode === 'ogbars' || mode === 'ogwave' || mode === 'ring'
                     || mode === 'nebula' || mode === 'fire' || mode === 'crystal') {
            // ---- OG DirHaven (TUNEZ) visualizers, ported verbatim ----
            ogSyncData();
            const w = W, h = H, dpr = devicePixelRatio;

            if (mode === 'ogbars') {
              const count = Math.min(48, OG_BINS);
              const barW = w / count;
              const grad = ctx.createLinearGradient(0, h, 0, 0);
              grad.addColorStop(0, OGC.gold); grad.addColorStop(1, OGC.goldLight);
              for (let i = 0; i < count; i++) {
                const val = ogSmoothFreq[i]; const barH = val * h * 0.85; const x = i * barW;
                ctx.fillStyle = grad; ctx.fillRect(x + 1, h - barH, barW - 2, barH);
                if (val > 0.6) { ctx.shadowColor = OGC.goldLight; ctx.shadowBlur = 10 * val; ctx.fillRect(x + 1, h - barH, barW - 2, barH); ctx.shadowBlur = 0; }
                ctx.fillStyle = `rgba(245, 166, 35, ${val * 0.12})`; ctx.fillRect(x + 1, h, barW - 2, -barH * 0.25);
                const capY = h - barH - 3 * dpr;
                if (capY < ogBarCaps[i]) ogBarCaps[i] = capY; else ogBarCaps[i] += 1 * dpr;
                if (ogBarCaps[i] > h) ogBarCaps[i] = h;
                ctx.fillStyle = OGC.goldLight; ctx.fillRect(x + 1, ogBarCaps[i], barW - 2, 2 * dpr);
              }
            } else if (mode === 'ogwave') {
              const sliceW = w / OG_BINS; const bass = ogSmoothFreq[2] || 0;
              ctx.lineWidth = (2 + bass * 3) * dpr; ctx.strokeStyle = OGC.gold;
              ctx.shadowColor = OGC.gold; ctx.shadowBlur = 8 + bass * 12; ctx.beginPath();
              for (let i = 0; i < OG_BINS; i++) { const y = ogTimeData[i] * h; i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sliceW, y); }
              ctx.stroke(); ctx.shadowBlur = 0;
              ctx.strokeStyle = `rgba(245, 166, 35, 0.25)`; ctx.lineWidth = 1 * dpr; ctx.beginPath();
              for (let i = 0; i < OG_BINS; i++) { const y = ogTimeData[i] * h + Math.sin(ogT * 0.003 + i * 0.1) * 8 * dpr; i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sliceW, y); }
              ctx.stroke();
            } else if (mode === 'ring') {
              const cx = w / 2, cy = h / 2; const baseR = Math.min(w, h) * 0.18; const maxR = Math.min(w, h) * 0.42;
              const bins = Math.min(64, OG_BINS); const bass = ogSmoothFreq[2] || 0; const bassScale = 1 + bass * 0.15;
              const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * bassScale);
              glow.addColorStop(0, `rgba(245, 166, 35, ${0.1 + bass * 0.25})`); glow.addColorStop(1, 'rgba(245, 166, 35, 0)');
              ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, baseR * bassScale, 0, Math.PI * 2); ctx.fill();
              for (let i = 0; i < bins; i++) {
                const angle = (i / bins) * Math.PI * 2 - Math.PI / 2 + ogT * 0.0003; const val = ogSmoothFreq[i];
                const r1 = baseR * bassScale; const r2 = r1 + val * (maxR - baseR);
                ctx.strokeStyle = `rgba(255, 215, 0, ${0.3 + val * 0.7})`; ctx.lineWidth = 1.5 * dpr; ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1); ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2); ctx.stroke();
              }
            } else if (mode === 'nebula') {
              const bass = ogSmoothFreq[2] || 0; const energy = (ogSmoothFreq[2] + ogSmoothFreq[16] + ogSmoothFreq[40]) / 3;
              for (const p of nebulaP) {
                p.a += p.sp + energy * 0.02; p.x += Math.cos(p.a) * 0.001; p.y += Math.sin(p.a) * 0.001;
                if (p.x < -0.05) p.x = 1.05; if (p.x > 1.05) p.x = -0.05; if (p.y < -0.05) p.y = 1.05; if (p.y > 1.05) p.y = -0.05;
                const sz = p.sz * (1 + bass * 2) * dpr; const px = p.x * w, py = p.y * h;
                const grad = ctx.createRadialGradient(px, py, 0, px, py, sz * 3);
                grad.addColorStop(0, `rgba(245, 166, 35, ${0.5 + energy * 0.5})`); grad.addColorStop(1, 'rgba(245, 166, 35, 0)');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(px, py, sz * 3, 0, Math.PI * 2); ctx.fill();
              }
            } else if (mode === 'fire') {
              const count = Math.min(36, OG_BINS); const barW = w / count;
              for (let i = 0; i < count; i++) {
                const val = ogSmoothFreq[i]; const flicker = val * (0.9 + Math.random() * 0.2); const barH = flicker * h * 0.85; const x = i * barW;
                const grad = ctx.createLinearGradient(x, h, x, h - barH);
                grad.addColorStop(0, 'rgba(255, 60, 0, 0.9)'); grad.addColorStop(0.4, 'rgba(255, 140, 0, 0.8)');
                grad.addColorStop(0.8, 'rgba(255, 220, 50, 0.6)'); grad.addColorStop(1, 'rgba(255, 255, 100, 0.2)');
                ctx.fillStyle = grad; ctx.fillRect(x + 1, h - barH, barW - 2, barH);
                if (val > 0.4 && Math.random() > 0.6) {
                  ctx.fillStyle = `rgba(255, 200, 50, ${Math.random() * 0.7})`; ctx.beginPath();
                  ctx.arc(x + barW / 2, h - barH - Math.random() * 15 * dpr, (1 + Math.random()) * dpr, 0, Math.PI * 2); ctx.fill();
                }
              }
            } else if (mode === 'crystal') {
              const count = Math.min(36, OG_BINS); const barW = w / count; const mid = h / 2;
              for (let i = 0; i < count; i++) {
                const val = ogSmoothFreq[i]; const barH = val * mid * 0.85; const x = i * barW + barW / 2;
                const grad = ctx.createLinearGradient(0, mid - barH, 0, mid);
                grad.addColorStop(0, `rgba(180, 220, 255, ${0.5 + val * 0.5})`); grad.addColorStop(1, OGC.gold);
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.moveTo(x - barW / 2 + 2, 0); ctx.lineTo(x + barW / 2 - 2, 0); ctx.lineTo(x, barH); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(x - barW / 2 + 2, h); ctx.lineTo(x + barW / 2 - 2, h); ctx.lineTo(x, h - barH); ctx.closePath(); ctx.fill();
              }
            }

          } else if (DH_MODES.has(mode)) {
            // ================= PORTED FROM DirHaven's AudioFusion =================
            // Same nine effects, same math. DirHaven drives them off a synthetic
            // `energy` prop; here we derive energy from the LIVE analyser, so they
            // react to real audio. `t` is ms, matching AudioFusion's rAF timestamp.
            ogSyncData();
            const w = W, h = H, dpr = devicePixelRatio;
            const t = performance.now();
            const energy = Math.min(1, ((ogSmoothFreq[2] + ogSmoothFreq[16] + ogSmoothFreq[40]) / 3) * 1.4);

            if (mode === 'sacred') {
              const cx = w / 2, cy = h / 2;
              const baseR = Math.min(w, h) * 0.3;
              const pulse = energy * 0.3;
              for (let ring = 0; ring < 3; ring++) {
                const r = baseR * (0.4 + ring * 0.3) * (1 + pulse * Math.sin(t * 0.002 + dhSacredPhases[ring]));
                const rot = t * 0.0008 * (ring % 2 === 0 ? 1 : -1) + dhSacredPhases[ring];
                ctx.globalAlpha = 0.5 + energy * 0.4 - ring * 0.1;
                ctx.strokeStyle = ring === 0 ? 'rgba(245,166,35,0.8)' : ring === 1 ? 'rgba(139,92,246,0.7)' : 'rgba(240,230,211,0.5)';
                ctx.lineWidth = (1.5 + energy * 1.5) * dpr;
                ctx.beginPath();
                for (let i = 0; i <= 6; i++) {
                  const a = (i / 6) * Math.PI * 2 + rot;
                  const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
                  i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.stroke();
              }
              for (let c = 0; c < 3; c++) {
                const r = baseR * (0.15 + c * 0.12) * (1 + pulse * 0.5 * Math.sin(t * 0.003 + dhSacredPhases[c + 3]));
                ctx.globalAlpha = 0.3 + energy * 0.3;
                ctx.strokeStyle = c === 1 ? 'rgba(245,166,35,0.6)' : 'rgba(139,92,246,0.4)';
                ctx.lineWidth = 1 * dpr;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
              }
              const outerR = baseR * 0.9 * (1 + pulse * Math.sin(t * 0.002));
              const rot0 = t * 0.0008;
              ctx.globalAlpha = 0.15 + energy * 0.2;
              ctx.strokeStyle = 'rgba(245,166,35,0.4)';
              ctx.lineWidth = 0.8 * dpr;
              for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 + rot0;
                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR); ctx.stroke();
              }

            } else if (mode === 'mercury') {
              const cx = w / 2, cy = h / 2;
              const baseR = Math.min(w, h) * 0.25;
              for (let b = 0; b < 5; b++) {
                const bPhase = b * 1.3 + t * 0.001;
                const bx = cx + Math.sin(bPhase) * baseR * 0.4 * (0.5 + energy * 0.5);
                const by = cy + Math.cos(bPhase * 0.7 + b) * baseR * 0.3 * (0.5 + energy * 0.5);
                const br = baseR * (0.3 + 0.15 * Math.sin(t * 0.002 + b * 2)) * (0.6 + energy * 0.6);
                const grad = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.3, 0, bx, by, Math.max(1, br));
                grad.addColorStop(0, 'rgba(220,220,230,0.7)');
                grad.addColorStop(0.4, 'rgba(180,180,195,0.5)');
                grad.addColorStop(0.7, 'rgba(140,140,160,0.3)');
                grad.addColorStop(1, 'rgba(100,100,120,0.05)');
                ctx.globalAlpha = 0.6 + energy * 0.35;
                ctx.fillStyle = grad;
                ctx.beginPath();
                for (let i = 0; i <= 32; i++) {
                  const a = (i / 32) * Math.PI * 2;
                  const wob = 1 + 0.15 * Math.sin(a * 3 + t * 0.003 + b) * energy
                                + 0.1 * Math.sin(a * 5 + t * 0.002 + b * 2) * energy;
                  const r = br * wob;
                  const px = bx + Math.cos(a) * r, py = by + Math.sin(a) * r;
                  i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.fill();
                ctx.globalAlpha = 0.15 + energy * 0.2;
                ctx.fillStyle = 'rgba(245,166,35,0.35)';
                ctx.beginPath(); ctx.arc(bx - br * 0.2, by - br * 0.25, Math.max(0.5, br * 0.25), 0, Math.PI * 2); ctx.fill();
              }

            } else if (mode === 'aurora') {
              for (let l = 0; l < 5; l++) {
                const yBase = h * (0.2 + l * 0.12);
                const layerPhase = l * 0.8;
                ctx.globalAlpha = (0.2 + energy * 0.3) * (1 - l * 0.12);
                ctx.lineWidth = (3 + energy * 4) * dpr;
                const grad = ctx.createLinearGradient(0, 0, w, 0);
                if (l % 3 === 0) {
                  grad.addColorStop(0, 'rgba(34,197,94,0.7)'); grad.addColorStop(0.5, 'rgba(245,166,35,0.8)'); grad.addColorStop(1, 'rgba(139,92,246,0.6)');
                } else if (l % 3 === 1) {
                  grad.addColorStop(0, 'rgba(139,92,246,0.6)'); grad.addColorStop(0.5, 'rgba(34,197,94,0.7)'); grad.addColorStop(1, 'rgba(245,166,35,0.7)');
                } else {
                  grad.addColorStop(0, 'rgba(245,166,35,0.6)'); grad.addColorStop(0.5, 'rgba(139,92,246,0.7)'); grad.addColorStop(1, 'rgba(34,197,94,0.6)');
                }
                ctx.strokeStyle = grad;
                ctx.beginPath();
                for (let x = 0; x <= w; x += 6 * dpr) {
                  const w1 = Math.sin(x * 0.008 / dpr + t * 0.001 + layerPhase) * 20 * dpr * (0.4 + energy);
                  const w2 = Math.sin(x * 0.015 / dpr + t * 0.0015 + layerPhase * 2) * 12 * dpr * energy;
                  const y = yBase + w1 + w2;
                  x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.globalAlpha = (0.08 + energy * 0.1) * (1 - l * 0.1);
                ctx.lineWidth = (10 + energy * 12) * dpr;
                ctx.stroke();
              }

            } else if (mode === 'grid') {
              const cx = w / 2, cy = h / 2;
              const spacingX = w / 16, spacingY = h / 16;
              const maxDist = Math.sqrt(cx * cx + cy * cy);
              const pulseWave = (t * 0.003) % (Math.PI * 2);
              for (const dot of dhGridDots) {
                const dx = spacingX * (dot.col + 1), dy = spacingY * (dot.row + 1);
                const normDist = Math.sqrt((dx - cx) ** 2 + (dy - cy) ** 2) / maxDist;
                const ringPhase = Math.sin(pulseWave - normDist * 6 + dot.phase * 0.3);
                const pulseSize = Math.max(0, ringPhase) * energy;
                const goldAmt = 1 - normDist;
                ctx.globalAlpha = Math.min(1, 0.2 + pulseSize * 0.7 + energy * 0.1);
                ctx.fillStyle = `rgb(${Math.round(245*goldAmt+139*(1-goldAmt))},${Math.round(166*goldAmt+92*(1-goldAmt))},${Math.round(35*goldAmt+246*(1-goldAmt))})`;
                ctx.beginPath(); ctx.arc(dx, dy, (1.5 + pulseSize * 4) * dpr, 0, Math.PI * 2); ctx.fill();
              }

            } else if (mode === 'chromatic') {
              const cx = w / 2, cy = h / 2;
              const maxR = Math.min(w, h) * 0.45;
              for (const p of dhParticles) {
                const life = (t * 0.001 * p.speed + p.life) % 1;
                const dist = life * maxR * (0.3 + energy * 0.9);
                const px = cx + Math.cos(p.angle + t * 0.0003) * dist;
                const py = cy + Math.sin(p.angle + t * 0.0003) * dist;
                const hueShift = (p.hue + t * 0.05) % 360;
                let cr, cg, cb;
                if (hueShift < 120) { const f = hueShift/120; cr = Math.round(245*(1-f)+139*f); cg = Math.round(166*(1-f)+92*f); cb = Math.round(35*(1-f)+246*f); }
                else if (hueShift < 240) { const f = (hueShift-120)/120; cr = Math.round(139*(1-f)+240*f); cg = Math.round(92*(1-f)+230*f); cb = Math.round(246*(1-f)+211*f); }
                else { const f = (hueShift-240)/120; cr = Math.round(240*(1-f)+245*f); cg = Math.round(230*(1-f)+166*f); cb = Math.round(211*(1-f)+35*f); }
                ctx.globalAlpha = Math.min(1, (1 - life) * (0.4 + energy * 0.6));
                ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(0.5, p.size * dpr * (0.5 + energy * 0.8) * (1 - life * 0.5)), 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.globalAlpha = 0.1 + energy * 0.3;
              const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 0.3);
              cGrad.addColorStop(0, 'rgba(245,166,35,0.5)'); cGrad.addColorStop(1, 'rgba(245,166,35,0)');
              ctx.fillStyle = cGrad;
              ctx.beginPath(); ctx.arc(cx, cy, maxR * 0.3, 0, Math.PI * 2); ctx.fill();

            } else if (mode === 'landscape') {
              const lineCount = 12, baseY = h * 0.85, spacing = h * 0.055;
              for (let l = 0; l < lineCount; l++) {
                const depth = l / lineCount;
                const yOff = baseY - l * spacing;
                const amp = (8 + energy * 30) * dpr * (1 - depth * 0.5);
                const freq = (0.01 + depth * 0.005) / dpr;
                const speed = 0.002 + depth * 0.001;
                const goldAmt = 1 - depth;
                ctx.globalAlpha = (0.6 + energy * 0.3) * (1 - depth * 0.5);
                ctx.strokeStyle = `rgb(${Math.round(245*goldAmt+139*(1-goldAmt))},${Math.round(166*goldAmt+92*(1-goldAmt))},${Math.round(35*goldAmt+246*(1-goldAmt))})`;
                ctx.lineWidth = Math.max(0.5, (1.5 - depth * 0.5) * dpr);
                ctx.beginPath();
                for (let x = 0; x <= w; x += 4 * dpr) {
                  const wv = Math.sin(x * freq + t * speed + l * 0.5) * amp
                           + Math.sin(x * freq * 2.3 + t * speed * 1.5 + l * 0.8) * amp * 0.3 * energy;
                  const y = yOff + wv;
                  x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
              }

            } else if (mode === 'helix') {
              const cx = w / 2;
              const amp = Math.min(w, h) * 0.18 * (0.7 + energy * 0.5);
              const rot = t * 0.002;
              const rungCount = 20, step = h / rungCount;
              ctx.lineWidth = 1 * dpr;
              for (let i = 0; i < rungCount; i++) {
                const y = i * step + ((t * 0.03 * dpr) % step);
                if (y > h) continue;
                const phase = (y / dpr) * 0.025 + rot;
                const x1 = cx + Math.sin(phase) * amp;
                const x2 = cx + Math.sin(phase + Math.PI) * amp;
                const depth = Math.cos(phase);
                ctx.globalAlpha = (0.15 + energy * 0.2) * (0.3 + Math.abs(depth) * 0.7);
                ctx.strokeStyle = 'rgba(240,230,211,0.4)';
                ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
              }
              ctx.globalAlpha = Math.min(1, 0.8 + energy * 0.2);
              ctx.strokeStyle = 'rgba(245,166,35,0.85)';
              ctx.beginPath();
              for (let y = 0; y < h; y += 3 * dpr) {
                const phase = (y / dpr) * 0.025 + rot;
                const x = cx + Math.sin(phase) * amp;
                const depth = Math.cos(phase);
                if (y === 0) ctx.moveTo(x, y);
                else { ctx.lineWidth = (1.5 + energy * 1.5) * dpr * (0.5 + (depth + 1) * 0.3); ctx.lineTo(x, y); }
              }
              ctx.stroke();
              ctx.globalAlpha = Math.min(1, 0.7 + energy * 0.2);
              ctx.strokeStyle = 'rgba(139,92,246,0.8)';
              ctx.lineWidth = (2 + energy * 1.5) * dpr;
              ctx.beginPath();
              for (let y = 0; y < h; y += 3 * dpr) {
                const phase = (y / dpr) * 0.025 + rot + Math.PI;
                const x = cx + Math.sin(phase) * amp;
                y === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
              }
              ctx.stroke();

            } else if (mode === 'constellation') {
              const connectionDist = Math.min(w, h) * 0.18;
              ctx.lineWidth = 0.6 * dpr;
              for (let i = 0; i < dhStars.length; i++) {
                for (let j = i + 1; j < dhStars.length; j++) {
                  const dx = (dhStars[i].x - dhStars[j].x) * w;
                  const dy = (dhStars[i].y - dhStars[j].y) * h;
                  const d = Math.sqrt(dx * dx + dy * dy);
                  if (d < connectionDist) {
                    ctx.globalAlpha = (1 - d / connectionDist) * 0.3 * (0.3 + energy * 0.7);
                    ctx.strokeStyle = 'rgba(245,166,35,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(dhStars[i].x * w, dhStars[i].y * h);
                    ctx.lineTo(dhStars[j].x * w, dhStars[j].y * h);
                    ctx.stroke();
                  }
                }
              }
              for (const star of dhStars) {
                const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.003 + star.phase));
                const size = star.size * dpr * (0.6 + energy * 0.6) * twinkle;
                ctx.globalAlpha = twinkle * (0.3 + energy * 0.7);
                if (size > 1.5 * dpr) {
                  const glow = ctx.createRadialGradient(star.x * w, star.y * h, 0, star.x * w, star.y * h, size * 3);
                  glow.addColorStop(0, 'rgba(245,166,35,0.3)'); glow.addColorStop(1, 'rgba(245,166,35,0)');
                  ctx.fillStyle = glow;
                  ctx.beginPath(); ctx.arc(star.x * w, star.y * h, size * 3, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = star.brightness > 0.7 ? 'rgba(245,166,35,0.9)' : star.brightness > 0.4 ? 'rgba(240,230,211,0.85)' : 'rgba(139,92,246,0.7)';
                ctx.beginPath(); ctx.arc(star.x * w, star.y * h, Math.max(0.5, size), 0, Math.PI * 2); ctx.fill();
              }

            } else if (mode === 'vinyl') {
              const cx = w / 2, cy = h / 2;
              const maxR = Math.min(w, h) * 0.45;
              const grooveCount = 18;
              const spinAngle = t * 0.001;
              ctx.globalAlpha = 0.3 + energy * 0.2;
              const labelGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, maxR * 0.15));
              labelGrad.addColorStop(0, 'rgba(245,166,35,0.6)');
              labelGrad.addColorStop(1, 'rgba(245,166,35,0.1)');
              ctx.fillStyle = labelGrad;
              ctx.beginPath(); ctx.arc(cx, cy, maxR * 0.15, 0, Math.PI * 2); ctx.fill();
              for (let g = 0; g < grooveCount; g++) {
                const r = maxR * (0.2 + (g / grooveCount) * 0.8);
                const grooveEnergy = energy * Math.abs(Math.sin(t * 0.003 + g * 0.5));
                ctx.globalAlpha = 0.2 + grooveEnergy * 0.4 + (g % 3 === 0 ? 0.1 : 0);
                ctx.strokeStyle = g % 4 === 0 ? 'rgba(245,166,35,0.6)' : 'rgba(240,230,211,0.35)';
                ctx.lineWidth = (0.8 + grooveEnergy * 1.2) * dpr;
                ctx.beginPath();
                for (let i = 0; i <= 64; i++) {
                  const a = (i / 64) * Math.PI * 2 + spinAngle;
                  const wob = 1 + 0.02 * Math.sin(a * 8 + t * 0.004 + g) * grooveEnergy
                                + 0.01 * Math.sin(a * 16 + g * 2) * energy;
                  const px = cx + Math.cos(a) * r * wob, py = cy + Math.sin(a) * r * wob;
                  i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.stroke();
              }
              ctx.globalAlpha = 0.8;
              ctx.fillStyle = 'rgba(13,11,8,0.9)';
              ctx.beginPath(); ctx.arc(cx, cy, 3 * dpr, 0, Math.PI * 2); ctx.fill();
              ctx.globalAlpha = 0.06 + energy * 0.08;
              ctx.strokeStyle = 'rgba(255,255,255,0.4)';
              ctx.lineWidth = maxR * 0.5;
              ctx.beginPath(); ctx.arc(cx, cy, maxR * 0.5, spinAngle + 0.3, spinAngle + 0.9); ctx.stroke();

            } else if (mode === 'dhnebula') {
              // DirHaven's nebula: gold wave + violet-tinted particle network.
              const mid = h * 0.58;
              const amp = (10 + energy * 52) * dpr;
              ctx.globalAlpha = 1;
              ctx.strokeStyle = 'rgba(245,166,35,0.90)';
              ctx.lineWidth = 2 * dpr;
              ctx.beginPath();
              for (let x = 0; x < w; x += 8 * dpr) {
                const y = mid + Math.sin(t * 0.004 + (x / dpr) * 0.03) * amp * (0.55 + energy * 0.85);
                x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
              }
              ctx.stroke();
              for (const n of dhNodes) {
                n.x += n.vx * 0.01 * (0.35 + energy * 1.2);
                n.y += n.vy * 0.01 * (0.35 + energy * 1.2);
                if (n.x < 0) n.x += 1; if (n.x > 1) n.x -= 1;
                if (n.y < 0) n.y += 1; if (n.y > 1) n.y -= 1;
              }
              ctx.globalAlpha = 0.55 + energy * 0.4;
              ctx.strokeStyle = 'rgba(245,166,35,0.35)';
              ctx.lineWidth = 1 * dpr;
              for (let i = 0; i < dhNodes.length; i++) {
                for (let j = i + 1; j < dhNodes.length; j++) {
                  const a = dhNodes[i], b = dhNodes[j];
                  const dx = a.x - b.x, dy = a.y - b.y;
                  if (Math.sqrt(dx * dx + dy * dy) < 0.22) {
                    ctx.beginPath(); ctx.moveTo(a.x * w, a.y * h); ctx.lineTo(b.x * w, b.y * h); ctx.stroke();
                  }
                }
              }
              ctx.globalAlpha = 0.7 + energy * 0.3;
              ctx.fillStyle = 'rgba(255,215,0,0.55)';
              for (const n of dhNodes) {
                ctx.beginPath(); ctx.arc(n.x * w, n.y * h, (2.2 + energy * 2.4) * dpr, 0, Math.PI * 2); ctx.fill();
              }
            }
            ctx.globalAlpha = 1;
          }
        };

        audio.addEventListener('play', () => {
          setupAudio();
          this.isPlaying = true;
          this.playIcon.textContent = '⏸';
          if (!rafId) draw();
        });

        audio.addEventListener('pause', () => {
          this.isPlaying = false;
          this.playIcon.textContent = '▶';
        });

        audio.addEventListener('ended', () => {
          this.isPlaying = false;
          this.playIcon.textContent = '▶';
        });

        audio.addEventListener('loadedmetadata', () => {
          this.loading.style.display = 'none';
          this.timeDuration.textContent = this.formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
          if (this._scrubbing) return; // finger owns the bar while scrubbing
          const progress = (audio.currentTime / audio.duration) * 100;
          this.seekFill.style.width = `${progress}%`;
          this.timeCurrent.textContent = this.formatTime(audio.currentTime);
        });

        // Start idle draw loop so canvas isn't blank before play
        draw();

        // ALWAYS autoplay — no clicking (Vinta directive). For audio we delay
        // the Web Audio hijack (setupAudio) until playback is actually running,
        // because createMediaElementSource on a suspended context = silence.
        // Strategy: play the bare <audio> first (muted-fallback if blocked),
        // THEN wire the analyser and resume the context. Unmute on any gesture.
        const startAnalyser = () => { try { setupAudio(); } catch (_) {} };
        try {
          audio.muted = false;
          await audio.play();
          startAnalyser();
        } catch (e) {
          // Sound-on blocked. Mute → play (always allowed) → arm unmute + resume.
          console.log('audio autoplay blocked, falling to muted autoplay', e && e.name);
          const armUnmute = () => {
            const unmute = () => {
              try { audio.muted = false; audio.volume = this.volume; } catch (_) {}
              try { if (this._audioCtx && this._audioCtx.state === 'suspended') this._audioCtx.resume().catch(()=>{}); } catch (_) {}
              startAnalyser();
            };
            const opts = { once: true, capture: true };
            ['pointerdown','keydown','touchstart','click','wheel','scroll'].forEach(ev =>
              window.addEventListener(ev, unmute, opts));
            setTimeout(() => { try { if (audio.muted) { audio.muted = false; audio.volume = this.volume; startAnalyser(); } } catch (_) {} }, 400);
          };
          try {
            audio.muted = true;
            await audio.play();
            armUnmute();
          } catch (e2) {
            console.warn('muted audio autoplay failed, retrying', e2 && e2.name);
            setTimeout(async () => {
              try { audio.muted = true; await audio.play(); armUnmute(); } catch (_) {}
            }, 300);
          }
        }
      }

      // Big clickable overlay shown when autoplay is blocked. The user's click
      // is the gesture that lets the media play.
      _showTapToPlay(onPlay) {
        try {
          let ov = this.mediaContainer.querySelector('.dirrm-tap-play');
          if (ov) ov.remove();
          ov = document.createElement('div');
          ov.className = 'dirrm-tap-play';
          ov.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'
            + 'flex-direction:column;gap:14px;cursor:pointer;z-index:50;'
            + 'background:rgba(4,6,12,0.55);backdrop-filter:blur(2px);';
          ov.innerHTML = '<div style="font-size:54px;color:#F5A623;line-height:1;filter:drop-shadow(0 0 12px rgba(245,166,35,.5))">▶</div>'
            + '<div style="font-family:\'Space Mono\',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,166,35,.85)">tap to play</div>';
          const go = async (ev) => {
            ev && ev.stopPropagation();
            ov.remove();
            try { await onPlay(); } catch (_) {}
          };
          ov.addEventListener('click', go);
          this.mediaContainer.style.position = this.mediaContainer.style.position || 'relative';
          this.mediaContainer.appendChild(ov);
        } catch (_) {}
      }

      cycleViz() {
        const modes = this._vizModeList || ['bars','wave','radial','mirror','particles'];
        const labels = this._vizLabelMap || { bars:'Bars', wave:'Wave', radial:'Radial', mirror:'Mirror', particles:'Particles' };
        const icons  = { bars:'▮▮▮', wave:'〜', radial:'◎', mirror:'⊟', particles:'✦',
                         ogbars:'▌▌▌', ogwave:'≈', ring:'◯', nebula:'✸', fire:'🔥', crystal:'◆' };
        const idx = (modes.indexOf(this._vizMode) + 1) % modes.length;
        this._vizMode = modes[idx];
        if (this._vizLabel) this._vizLabel.textContent = labels[this._vizMode] || this._vizMode;
        const icon = document.getElementById('viz-icon');
        if (icon) icon.textContent = icons[this._vizMode] || '✦';
      }

      async loadImage(url) {
        this.setBadge('Image');
        const img = document.createElement('img');
        img.alt = this.mediaTitle.textContent || 'image';
        this._setMediaSrc(img, url); // auto-retry via proxy on bad-cert/CORS

        img.addEventListener('load', () => {
          this.loading.style.display = 'none';
          this.mediaSubtitle.textContent = `${img.naturalWidth}×${img.naturalHeight}`;
        });

        img.addEventListener('error', () => {
          // Fallback chain: try as video, then audio, then iframe, then download card
          img.remove();
          console.warn('Image failed, trying video fallback for', url);
          const v = document.createElement('video');
          v.src = url; v.controls = true; v.style.maxWidth = '100%'; v.style.maxHeight = '100%';
          v.addEventListener('loadedmetadata', () => { this.loading.style.display = 'none'; });
          v.addEventListener('error', () => {
            v.remove();
            const a = document.createElement('audio');
            a.src = url; a.controls = true;
            a.addEventListener('loadedmetadata', () => { this.loading.style.display = 'none'; });
            a.addEventListener('error', () => {
              a.remove();
              this.loadUnknown(url, 'Could not display file');
            });
            this.mediaContainer.appendChild(a);
          });
          this.mediaContainer.appendChild(v);
        });

        this.mediaContainer.appendChild(img);
        this.controls.style.display = 'none'; // Hide transport for images
      }

      loadPdf(url) {
        this.setBadge('PDF');
        const viewer = document.createElement('div');
        viewer.className = 'dirrm-document-viewer';

        const toolbar = document.createElement('div');
        toolbar.className = 'dirrm-doc-toolbar';
        toolbar.innerHTML = `
          <a href="${url}" target="_blank" rel="noopener">Open in new tab</a>
          <a href="${url}" download>Download</a>
        `;

        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.addEventListener('load', () => { this.loading.style.display = 'none'; });

        viewer.appendChild(toolbar);
        viewer.appendChild(iframe);
        this.mediaContainer.appendChild(viewer);
        this.controls.style.display = 'none';
      }

      loadEbook(url) {
        this.setBadge('eBook');
        const filename = this.extractTitle(url);
        this.loading.style.display = 'none';
        const card = document.createElement('div');
        card.className = 'dirrm-info-card';
        card.innerHTML = `
          <div class="dirrm-info-card-inner">
            <div class="dirrm-info-icon">📖</div>
            <div class="dirrm-info-title">${filename}</div>
            <div class="dirrm-info-meta">eBook · external reader recommended</div>
            <div class="dirrm-info-actions">
              <a class="dirrm-info-btn" href="${url}" target="_blank" rel="noopener">Open</a>
              <a class="dirrm-info-btn" href="${url}" download>Download</a>
            </div>
          </div>
        `;
        this.mediaContainer.appendChild(card);
        this.controls.style.display = 'none';
      }

      /**
       * Text / code / markdown viewer.
       * Fetches the file, renders as <pre> with syntax highlight, or marked() for .md.
       */
      async loadText(url) {
        this.setBadge('Text');
        const lower = url.toLowerCase().split('?')[0];
        const ext = lower.split('.').pop();
        const isMarkdown = ext === 'md' || ext === 'markdown';
        const langMap = {
          js:'javascript', mjs:'javascript', cjs:'javascript', ts:'typescript',
          tsx:'typescript', jsx:'javascript', py:'python', rb:'ruby', sh:'bash',
          bash:'bash', zsh:'bash', html:'xml', htm:'xml', xml:'xml', vue:'xml',
          svelte:'xml', css:'css', scss:'scss', sass:'scss', less:'less',
          json:'json', yaml:'yaml', yml:'yaml', toml:'ini', ini:'ini',
          cfg:'ini', conf:'ini', env:'bash', sql:'sql', dockerfile:'dockerfile',
          makefile:'makefile', c:'c', cpp:'cpp', h:'c', hpp:'cpp',
          cs:'csharp', php:'php', swift:'swift', kt:'kotlin', go:'go',
          rs:'rust', java:'java', scala:'scala', lua:'lua', pl:'perl',
          log:'plaintext', txt:'plaintext', csv:'plaintext', tsv:'plaintext'
        };
        const lang = langMap[ext] || 'plaintext';

        let text;
        try {
          const res = await fetch(url, { credentials: 'omit' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          text = await res.text();
        } catch (e) {
          console.warn('Text fetch failed', e);
          return this.loadUnknown(url, 'Could not read file (CORS or network)');
        }

        this.loading.style.display = 'none';

        const wrap = document.createElement('div');
        wrap.className = 'dirrm-text-viewer';

        const toolbar = document.createElement('div');
        toolbar.className = 'dirrm-text-toolbar';
        const copyBtn = document.createElement('button');
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = 'Copied';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
          } catch (_) {
            copyBtn.textContent = 'Copy failed';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
          }
        });
        const dlLink = document.createElement('a');
        dlLink.href = url;
        dlLink.download = '';
        dlLink.textContent = 'Download';
        toolbar.appendChild(copyBtn);
        toolbar.appendChild(dlLink);

        const body = document.createElement('div');
        body.className = 'dirrm-text-body';

        if (isMarkdown) {
          try {
            await this.loadScript('https://cdn.jsdelivr.net/npm/marked/marked.min.js');
            body.classList.add('markdown');
            body.innerHTML = window.marked ? window.marked.parse(text) : this.escapeHtml(text);
          } catch (_) {
            body.textContent = text;
          }
        } else {
          // Plain text + optional syntax highlight
          const code = document.createElement('code');
          code.className = `language-${lang}`;
          code.textContent = text;
          body.appendChild(code);
          try {
            this.loadStyle('https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css');
            await this.loadScript('https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js');
            if (window.hljs) window.hljs.highlightElement(code);
          } catch (_) { /* fall back to plain rendering */ }
        }

        wrap.appendChild(toolbar);
        wrap.appendChild(body);
        this.mediaContainer.appendChild(wrap);
        this.controls.style.display = 'none';
      }

      /**
       * 3D model viewer via Google's <model-viewer> web component.
       * Supports .glb, .gltf natively; .obj/.stl/.fbx etc are presented as download
       * cards since model-viewer is GLTF-focused.
       */
      async loadModel(url) {
        this.setBadge('3D Model');
        const lower = url.toLowerCase().split('?')[0];
        const ext = lower.split('.').pop();
        const supported = (ext === 'glb' || ext === 'gltf');

        if (!supported) {
          // Show info card with download for non-GLTF formats
          this.loading.style.display = 'none';
          const card = document.createElement('div');
          card.className = 'dirrm-info-card';
          card.innerHTML = `
            <div class="dirrm-info-card-inner">
              <div class="dirrm-info-icon">🧊</div>
              <div class="dirrm-info-title">${this.extractTitle(url)}</div>
              <div class="dirrm-info-meta">.${ext.toUpperCase()} · open in 3D viewer of choice</div>
              <div class="dirrm-info-actions">
                <a class="dirrm-info-btn" href="${url}" download>Download</a>
                <a class="dirrm-info-btn" href="${url}" target="_blank" rel="noopener">Open</a>
              </div>
            </div>
          `;
          this.mediaContainer.appendChild(card);
          this.controls.style.display = 'none';
          return;
        }

        try {
          await this.loadScript('https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js', { module: true });
        } catch (e) {
          console.warn('model-viewer failed to load', e);
          return this.loadUnknown(url, 'Could not load 3D viewer');

        const wrap = document.createElement('div');
        wrap.className = 'dirrm-model-wrap';
        const mv = document.createElement('model-viewer');

        mv.setAttribute('auto-rotate', '');
        mv.setAttribute('camera-controls', '');
        mv.setAttribute('shadow-intensity', '1');
        mv.setAttribute('interaction-prompt', 'none');
        mv.setAttribute('exposure', '0.9');
        mv.addEventListener('load', () => { this.loading.style.display = 'none'; });
        mv.addEventListener('error', () => { this.loadUnknown(url, 'Model failed to render'); });
        wrap.appendChild(mv);
        this.mediaContainer.appendChild(wrap);

      /**

      /**

        this.loading.style.display = 'none';
        const isMagnet = (url || '').startsWith('magnet:');
        const filename = isMagnet ? 'Magnet link' : this.extractTitle(url);

        card.className = 'dirrm-info-card';

        this.mediaContainer.appendChild(card);
