      /**
       * Kick Live (task BTGZBTY) — the ONLY way a Kick channel actually plays.
       *
       * player.kick.com refuses to be framed (X-Frame-Options: SAMEORIGIN) and
       * that refusal is undetectable from the parent, so the old iframe path
       * produced a silent black rectangle on every origin. Instead we ask the
       * brain for the channel's IVS playback URL, whose manifest sends
       * access-control-allow-origin:* — hls.js can then play it from any origin
       * (board.vintaclectic.com included).
       *
       * The playback token lives ~10 minutes, so the URL is resolved at play
       * time and never cached client-side.
       */
      async loadKickLive(channel, originalUrl) {
        this.setBadge('Kick Live');
        this._updateLoading(`Resolving ${channel}'s Kick stream…`);

        const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
        const endpoint = `${apiBase}/api/stream/kick-live?channel=${encodeURIComponent(channel)}`;

        let data;
        try {
          const resp = await fetch(endpoint);
          data = await resp.json();
        } catch (e) {
          return this._showKickOfflineCard(originalUrl, channel,
            'Could not reach the brain to resolve this stream.');
        }

        if (!data || !data.ok || !data.streamUrl) {
          // no_channel is the typo case — say so plainly instead of "offline",
          // because "vintacletic is offline" sends you hunting a dead stream.
          const reason = data && data.error === 'no_channel'
            ? `Kick has no channel named "${channel}". Check the spelling.`
            : (data && data.message) || 'Could not resolve this Kick stream.';
          return this._showKickOfflineCard(originalUrl, channel, reason);
        }

        if (data.title) this.mediaTitle.textContent = data.title;
        this.setBadge('Kick LIVE');
        await this.loadStream(data.streamUrl);
      }

      /** "Not live / no such channel" card for Kick, with retry + open-on-Kick. */
      _showKickOfflineCard(url, channel, reason) {
        this.loading.style.display = 'none';
        this.controls.style.display = 'none';
        this.setBadge('Kick');

        const card = document.createElement('div');
        card.className = 'dirrm-info-card';
        const safeUrl = String(url || `https://kick.com/${channel}`);
        card.innerHTML = `
          <div class="dirrm-info-icon" style="font-size:2rem;margin-bottom:12px;">📡</div>
          <div class="dirrm-info-title"></div>
          <div class="dirrm-info-meta" style="margin-top:8px;color:rgba(240,230,211,0.6);"></div>
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
            <button class="dirrm-action-btn" data-kick-retry>Retry</button>
            <a class="dirrm-action-btn" target="_blank" rel="noopener">Open on Kick</a>
          </div>`;
        // textContent, not innerHTML — a channel slug is user input.
        card.querySelector('.dirrm-info-title').textContent = channel || 'Kick';
        card.querySelector('.dirrm-info-meta').textContent = reason;
        const link = card.querySelector('a');
        link.href = safeUrl;
        card.querySelector('[data-kick-retry]')
            .addEventListener('click', () => this.load(safeUrl));
        this.mediaContainer.appendChild(card);
      }

      /**
       * TikTok Live — resolves the live stream URL via the brain's yt-dlp endpoint,
       * then plays it as an HLS stream. Shows a clear "not live" card if offline.
       */
      /**
       * Returns the Kick channel slug when `url` is a LIVE kick.com channel page
       * (not a VOD, clip, or a browse/category page), else null.
       * Mirrors the routing in detectEmbed() so the two never disagree.
       */
      /**
       * Routes an IVS/Kick playback URL through the brain's CORS proxy when the
       * page's own origin is not one Kick's playback token permits.
       *
       * WHY (task DNE8UHK, 2026-08-25): the IVS playback token pins
       * `access-control-allow-origin` to an allowlist of Kick's own domains
       * (kick.com, player.kick.com, *.kick.live, ...). It is NOT `*`, despite
       * what the older comment here claimed. So hls.js fetching the manifest
       * from https://board.vintaclectic.com is blocked by the browser before a
       * single byte arrives. That header comes from AWS and cannot be changed
       * from the client, so the manifest has to be fetched server-side instead.
       *
       * Only proxied when needed: on an allowed origin we keep the DIRECT URL so
       * playback stays peer-to-edge with no extra hop and no brain dependency.
       */
      _corsSafeStreamUrl(streamUrl) {
        try {
          const u = new URL(streamUrl, location.href);
          // Non-IVS/Kick hosts (yt-dlp results etc.) are left completely alone.
          if (!/(^|\.)live-video\.net$|(^|\.)amazonaws\.com$/i.test(u.hostname)) return streamUrl;
          const origin = location.origin;
          const ALLOWED = /^https:\/\/(kick\.com|player\.kick\.com|admin\.kick\.com|beta\.kick\.com|next\.kick\.com|dashboard\.kick\.com|xbox\.kick\.com|playstation\.kick\.com|tizen\.kick\.com|webos\.kick\.com|[^.]+\.kick\.live)$/i;
          if (ALLOWED.test(origin)) return streamUrl;   // token already permits us
          const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
          return `${apiBase}/api/stream/hls?src=${encodeURIComponent(u.href)}`;
        } catch (_) { return streamUrl; }
      }

      _kickLiveChannel(url) {
        try {
          const u = new URL(url);
          if (u.hostname.replace(/^www\./, '') !== 'kick.com') return null;
          const parts = u.pathname.split('/').filter(Boolean);
          if (!parts.length) return null;                       // homepage
          if (/\/(?:video|videos)\/[a-z0-9-]+/i.test(u.pathname)) return null; // VOD → embed
          if (/\/clips?\/[a-z0-9-]+/i.test(u.pathname)) return null;           // clip → embed
          const slug = parts[0];
          if (['categories', 'browse', 'search', 'following', 'about'].includes(slug)) return null;
          if (!/^[a-zA-Z0-9_-]{1,64}$/.test(slug)) return null;
          return slug;
        } catch (_) { return null; }
      }

      /**
       * Kick LIVE — plays the real stream instead of an iframe that can never work.
       *
       * Kick's player refuses to be framed (X-Frame-Options: SAMEORIGIN), and a
       * cross-origin embedder physically cannot detect that refusal, so the old
       * embed path produced a silent black rectangle with no error. The brain's
       * /api/stream/kick-live resolves the channel's IVS playback URL (via the
       * curl-cffi Cloudflare bypass).
       *
       * CORRECTED 2026-08-25 (task DNE8UHK): this used to claim the IVS manifest
       * serves `access-control-allow-origin: *` and "plays fine from any origin".
       * It does not. The playback token pins ACAO to an allowlist of Kick's own
       * domains, so any other origin (e.g. board.vintaclectic.com) is blocked by
       * CORS before hls.js reads a byte. _corsSafeStreamUrl() routes the manifest
       * through the brain's /api/stream/hls proxy on those origins.
       */
      async loadKickLive(url) {
        const channel = this._kickLiveChannel(url) || '';
        this.setBadge('Kick Live');
        this._updateLoading(`Resolving ${channel || 'Kick'} live stream…`);

        const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
        const endpoint = `${apiBase}/api/stream/kick-live?channel=${encodeURIComponent(channel || url)}`;

        let data;
        try {
          const resp = await fetch(endpoint, { credentials: 'include' });
          data = await resp.json();
        } catch (e) {
          // The brain is unreachable — that is OUR fault, not the streamer's.
          // Passing `unreachable` keeps the card from claiming the channel is
          // offline when we simply never got to ask (task K3NUPWK).
          return this._showLiveOfflineCard(url, channel, 'Could not reach the brain API to resolve this Kick stream. Is the brain running?', 'unreachable');
        }

        if (!data || !data.ok || !data.streamUrl) {
          const msg = (data && data.message)
            || 'Could not resolve this Kick stream.';
          // /api/stream/kick-live answers with a precise error code:
          //   not_live  → the channel exists and simply isn't streaming
          //   no_channel→ no such channel on Kick (a typo, or renamed)
          //   resolve_failed / bad_channel → our side failed to ask
          // Collapsing all of these into one grey "something went wrong" card is
          // exactly what made an offline channel read as a broken player.
          return this._showLiveOfflineCard(url, channel, msg, (data && data.error) || null);
        }

        // They're live — forget the offline backoff so the NEXT time this channel
        // drops we start checking again at 30s, not at the 5-minute cap.
        this._offlineUrl = null; this._offlineAttempt = 0;

        if (data.title) this.mediaTitle.textContent = data.title;
        if (this.mediaSubtitle) {
          this.mediaSubtitle.textContent = data.viewers != null
            ? `${Number(data.viewers).toLocaleString()} watching on Kick`
            : 'Live on Kick';
        }
        await this.loadStream(this._corsSafeStreamUrl(data.streamUrl));
      }

      async loadTikTokLive(url) {
        this.setBadge('TikTok Live');
        this._updateLoading('Extracting TikTok Live stream via yt-dlp…');

        // Extract @username from URL
        const usernameMatch = url.match(/@([^/?#]+)/);
        const username = usernameMatch ? usernameMatch[1] : null;

        const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
        const endpoint = username
          ? `${apiBase}/api/stream/tiktok-live?username=${encodeURIComponent(username)}`
          : `${apiBase}/api/stream/extract?url=${encodeURIComponent(url)}`;

        let data;
        try {
          const resp = await fetch(endpoint, { credentials: 'include' });
          data = await resp.json();
        } catch (e) {
          return this._showLiveOfflineCard(url, username, 'Could not reach brain API. Is the brain running?', 'unreachable');
        }

        if (!data.ok) {
          if (data.error === 'not_live') {
            return this._showLiveOfflineCard(url, username, data.message || 'Not currently live.', 'not_live');
          }
          if (data.error === 'private') {
            return this._showLiveOfflineCard(url, username, 'This account is private or requires login.', 'private');
          }
          return this._showLiveOfflineCard(url, username, data.message || 'Extraction failed.', data.error || null);
        }

        // Got a stream URL — update title and play as HLS/video
        if (data.title) this.mediaTitle.textContent = data.title;
        await this.loadStream(data.streamUrl);
      }

      /**
       * Generic yt-dlp extraction for URLs that have no embeddable format
       * but yt-dlp can handle (Facebook Watch, Rumble, etc.)
       */
      async loadYtDlp(url) {
        this.setBadge('Extracting…');
        this._updateLoading('Extracting stream URL…');

        const apiBase = window.__VINTINUUM_API_BASE || window.VINTINUUM_API || window.__VINT_API || 'https://api.vintaclectic.com';
        const endpoint = `${apiBase}/api/stream/extract?url=${encodeURIComponent(url)}`;

        let data;
        try {
          const resp = await fetch(endpoint, { credentials: 'include' });
          data = await resp.json();
        } catch (e) {
          return this.loadUnknown(url, 'Could not reach brain API for extraction.');
        }

        if (!data.ok || !data.streamUrl) {
          return this.loadUnknown(url, data.message || 'Could not extract stream URL.');
        }

        if (data.title) this.mediaTitle.textContent = data.title;
        this.setBadge('Video');
        await this.loadStream(data.streamUrl);
      }

      /**
       * Cancels any armed auto-retry countdown. Called whenever the offline card
       * is replaced (a new load, a manual retry, or the auto-retry firing).
       *
       * LOAD-BEARING: loadMedia() removes `.dirrm-info-card` nodes from the DOM,
       * but a setInterval closed over that node keeps running against a detached
       * element and would fire a retry for a channel the user already left. The
       * timer must be owned by the player, not by the card.
       */
      _clearOfflineRetry() {
        if (this._offlineTick)  { clearInterval(this._offlineTick);  this._offlineTick = null; }
        if (this._offlineTimer) { clearTimeout(this._offlineTimer);  this._offlineTimer = null; }
      }

      /**
       * THE OFFLINE CARD (task K3NUPWK).
       *
       * WHY THIS WAS REWRITTEN: an offline Kick channel read as a broken player.
       * The old card was a bare emoji, the API's raw message string, and two
       * buttons in a class (`dirrm-action-btn`) that HAS NO CSS RULE ANYWHERE in
       * this file — so they rendered as unstyled browser default buttons, well
       * under the 44px touch minimum. It also never distinguished "this channel
       * is simply not streaming" (normal, expected, nobody's fault) from "we
       * failed to reach the brain" (our bug). Both looked identical and both
       * looked broken.
       *
       * The card now answers the four questions a confused user actually has:
       *   1. WHO?    — the channel name, large, unmistakable.
       *   2. WHAT?   — "Not live right now", stated plainly, not an error string.
       *   3. WHEN?   — a live countdown to the next automatic check.
       *   4. NOW?    — "Open on Kick" to go watch/follow at the source.
       *
       * Platform-aware (task BPYUATZ): shared by TikTok Live and Kick Live, so it
       * must never tell a Kick user to "Open on TikTok". Every interpolation is
       * escaped and every handler is a real listener, never an inline onclick.
       *
       * NO-COLLISION: the card is `.dirrm-info-card` — absolute, inset:0,
       * overflow:auto — so it fills the media box, scrolls INTERNALLY when the
       * frame is short, and can never bleed onto the titlebar, transport bar or
       * host chrome. Its inner box is min-width:0 / max-width:420px so a long
       * channel slug cannot push it past the player at 320px.
       */
      _showLiveOfflineCard(url, handle, reason, code) {
        this._clearOfflineRetry();
        this.loading.style.display = 'none';
        this.controls.style.display = 'none';
        this.mediaElement = null;

        let platform = 'TikTok', display = handle ? '@' + handle : 'TikTok Live';
        let openUrl = url;
        try {
          const u = new URL(url);
          const host = u.hostname.replace(/^www\./, '');
          if (host === 'kick.com') {
            platform = 'Kick';
            display = handle || 'Kick Live';
            // Always send them to the CHANNEL page, never a deep sub-path that
            // may 404 — this button is the whole point of the card.
            if (handle) openUrl = `https://kick.com/${encodeURIComponent(handle)}`;
          }
        } catch (_) {}

        // Three distinct truths, three distinct cards. Only the first is the
        // ordinary "they're not streaming" case that must never read as an error.
        const isOffline    = code === 'not_live' || (!code && /not (currently )?live/i.test(reason || ''));
        const isNoChannel  = code === 'no_channel';
        const isOurFault   = code === 'unreachable' || code === 'resolve_failed' || code === 'bad_channel';

        // INLINE SVG, NOT EMOJI. Every other info card here uses an emoji glyph,
        // and that is fine for decoration — but this icon carries the meaning of
        // the whole card, and emoji are a font-availability gamble (they render
        // as a tofu box on bare Linux and some older Android builds; confirmed
        // tofu in headless Chrome while shipping this). A drawn SVG always
        // renders, and `currentColor` keeps it on the gold ramp.
        const svg = (paths) =>
          `<svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                role="img" aria-hidden="true" focusable="false">${paths}</svg>`;
        // A dimmed screen with a "z" — asleep, not broken.
        const ICON_SLEEP  = svg('<rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8 20.5h8"/><path d="M9.5 9h5l-5 5h5"/>');
        // Magnifier — we looked, there's nothing by that name.
        const ICON_SEARCH = svg('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>');
        // Broken signal — the failure is on our side of the wire.
        const ICON_SIGNAL = svg('<path d="M12 20h.01"/><path d="M5 12.5a10 10 0 0 1 4-2.4"/><path d="M15 10.1a10 10 0 0 1 4 2.4"/><path d="M2 9a14 14 0 0 1 5-3.2"/><path d="M17 5.8A14 14 0 0 1 22 9"/><path d="M9.5 16a5 5 0 0 1 5 0"/><path d="M3 3l18 18"/>');

        let icon, headline, detail, retryable = true;
        if (isOffline) {
          icon     = ICON_SLEEP;
          headline = 'Not live right now';
          detail   = `${display} isn’t streaming at the moment. The player is fine — there’s just nothing to play yet. We’ll keep checking.`;
        } else if (isNoChannel) {
          icon     = ICON_SEARCH;
          headline = `No ${platform} channel by that name`;
          detail   = `We couldn’t find “${display}” on ${platform}. Check the spelling, or open ${platform} to search for it.`;
          retryable = false; // a name that doesn't exist won't start existing on a timer
        } else if (isOurFault) {
          icon     = ICON_SIGNAL;
          headline = 'Couldn’t check if they’re live';
          detail   = `${reason} This is on our side, not the channel’s — ${display} may well be streaming.`;
        } else {
          icon     = ICON_SLEEP;
          headline = 'Not live right now';
          detail   = reason || `${display} isn’t streaming at the moment.`;
        }

        this.setBadge(isOffline ? 'Offline' : `${platform} Live`);
        this.mediaTitle.textContent = display;
        if (this.mediaSubtitle) {
          this.mediaSubtitle.textContent = isOffline ? `Offline on ${platform}` : '';
        }

        const card = document.createElement('div');
        card.className = 'dirrm-info-card dirrm-offline-card';
        card.innerHTML = `
          <div class="dirrm-info-card-inner">
            <div class="dirrm-info-icon">${icon}</div>
            <!-- Wrapped so the ~98px board dock can lay this out as a single row
                 (text column | action column) without reparenting anything. -->
            <div class="dirrm-offline-text">
              <div class="dirrm-offline-channel">${this.escapeHtml(display)}</div>
              <div class="dirrm-offline-headline">${this.escapeHtml(headline)}</div>
            </div>
            <div class="dirrm-info-meta">${this.escapeHtml(detail)}</div>
            ${retryable ? `<div class="dirrm-offline-countdown" data-dirrm-countdown aria-live="polite"></div>` : ''}
            <div class="dirrm-info-actions">
              ${retryable ? `<button class="dirrm-info-btn" type="button" data-dirrm-retry>Check now</button>` : ''}
              <a class="dirrm-info-btn" href="${this.escapeHtml(openUrl)}" target="_blank" rel="noopener">Open on ${this.escapeHtml(platform)}</a>
            </div>
          </div>
        `;
        this.mediaContainer.appendChild(card);

        const again = () => {
          this._clearOfflineRetry();
          this.loadMedia(url, this._lastTitle || null, this.mediaType || null);
        };
        const retryBtn = card.querySelector('[data-dirrm-retry]');
        if (retryBtn) retryBtn.addEventListener('click', again);

        if (!retryable) return;

        // AUTO-RETRY WITH A VISIBLE COUNTDOWN.
        // Backs off 30s → 60s → 120s → 300s (capped) across consecutive offline
        // results for the SAME url, so a channel that's offline all night doesn't
        // hammer the brain, while a channel about to go live is caught fast.
        if (this._offlineUrl !== url) { this._offlineUrl = url; this._offlineAttempt = 0; }
        const ladder = [30, 60, 120, 300];
        const wait   = ladder[Math.min(this._offlineAttempt, ladder.length - 1)];
        this._offlineAttempt++;

        const countdownEl = card.querySelector('[data-dirrm-countdown]');
        let left = wait;
        const render = () => {
          if (!countdownEl || !countdownEl.isConnected) return;
          const m = Math.floor(left / 60), s = left % 60;
          const clock = m ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
          countdownEl.textContent = left > 0
            ? `Checking again in ${clock}`
            : 'Checking now…';
        };
        render();
        this._offlineTick = setInterval(() => {
          left--;
          if (left < 0) left = 0;
          render();
          // The card was replaced or the player moved on — stop cleanly.
          if (!countdownEl.isConnected) this._clearOfflineRetry();
        }, 1000);
        this._offlineTimer = setTimeout(() => {
          if (!card.isConnected) return this._clearOfflineRetry();
          again();
        }, wait * 1000);
      }

      _updateLoading(text) {
        const el = this.loading.querySelector('.dirrm-loading-text');
        if (el) el.textContent = text;
        else this.loading.innerHTML = `<div class="dirrm-loading-orb"></div><div class="dirrm-loading-text">${this.escapeHtml(text)}</div>`;
        this.loading.style.display = 'flex';
      }

      /**
       * Future-proof fallback. Cascade:
       *   1. Try <video src>
       *   2. Try <audio src>
       *   3. Try iframe embed
       *   4. Present download card with detected MIME (HEAD request)
       */
      async loadUnknown(url, reasonText) {
        this.setBadge('File');

        // Step 1: video
        const tryVideo = () => new Promise(resolve => {
          const v = document.createElement('video');
          v.src = url; v.controls = false; v.playsInline = true; v.volume = this.volume;
          let settled = false;
          const done = (ok) => { if (settled) return; settled = true; resolve(ok ? v : null); if (!ok) v.remove(); };
          v.addEventListener('loadedmetadata', () => done(true), { once: true });
          v.addEventListener('error', () => done(false), { once: true });
          // Don't append yet — only on success
          setTimeout(() => done(false), 4000);
        });

        const v = await tryVideo();
        if (v) {
          this.loading.style.display = 'none';
          v.controls = true;
          v.addEventListener('play',  () => { this.isPlaying = true;  this.playIcon.textContent = '⏸'; });
          v.addEventListener('pause', () => { this.isPlaying = false; this.playIcon.textContent = '▶'; });
          v.addEventListener('timeupdate', () => {
            if (this._scrubbing) return; // finger owns the bar while scrubbing
            const p = (v.currentTime / v.duration) * 100;
            this.seekFill.style.width = `${p}%`;
            this.timeCurrent.textContent = this.formatTime(v.currentTime);
          });
          this.timeDuration.textContent = this.formatTime(v.duration);
          this.mediaContainer.appendChild(v);
          this.mediaElement = v;
          this.controls.style.display = '';
          try { await v.play(); } catch (_) {}
          this.setBadge('Video');
          return;
        }

        // Step 2: audio
        const tryAudio = () => new Promise(resolve => {
          const a = document.createElement('audio');
          a.src = url; a.controls = true;
          let settled = false;
          const done = (ok) => { if (settled) return; settled = true; resolve(ok ? a : null); if (!ok) a.remove(); };
          a.addEventListener('loadedmetadata', () => done(true), { once: true });
          a.addEventListener('error', () => done(false), { once: true });
          setTimeout(() => done(false), 4000);
        });

        const a = await tryAudio();
        if (a) {
          this.loading.style.display = 'none';
          this.mediaContainer.appendChild(a);
          this.mediaElement = a;
          this.controls.style.display = '';
          this.setBadge('Audio');
          return;
        }

        // Step 3 + 4: detect MIME and either iframe or download card
        let mime = '';
        try {
          const head = await fetch(url, { method: 'HEAD' });
          mime = (head.headers.get('content-type') || '').split(';')[0].trim();
        } catch (_) {}

        if (mime.startsWith('text/html') || mime === 'application/xhtml+xml') {
          // Embed as iframe
          this.loading.style.display = 'none';
          const viewer = document.createElement('div');
          viewer.className = 'dirrm-document-viewer';
          const iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.addEventListener('load', () => { this.loading.style.display = 'none'; });
          viewer.appendChild(iframe);
          this.mediaContainer.appendChild(viewer);
          this.controls.style.display = 'none';
          this.setBadge('Web Page');
          return;
        }

        // Final: download card
        this.loading.style.display = 'none';
        const filename = this.extractTitle(url);
        const card = document.createElement('div');
        card.className = 'dirrm-info-card';
        card.innerHTML = `
          <div class="dirrm-info-card-inner">
            <div class="dirrm-info-icon">📁</div>
            <div class="dirrm-info-title">${filename}</div>
            <div class="dirrm-info-meta">${reasonText || (mime || 'Unknown file type')}</div>
            <div class="dirrm-info-actions">
              <a class="dirrm-info-btn" href="${url}" download>Download</a>
              <a class="dirrm-info-btn" href="${url}" target="_blank" rel="noopener">Open in browser</a>
            </div>
          </div>
        `;
        this.mediaContainer.appendChild(card);
        this.controls.style.display = 'none';
      }

      /**
       * Helpers.
       */
      escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, c => ({
          '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[c]));
      }

      formatBytes(n) {
        if (!n || !isFinite(n)) return '';
        const units = ['B','KB','MB','GB','TB'];
        let i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return `${n.toFixed(n >= 100 || i === 0 ? 0 : 1)} ${units[i]}`;
      }

      formatTime(sec) {
        if (!sec || !isFinite(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      // Playback controls
      togglePlay() {
        if (!this.mediaElement) return;
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }

      play() {
        if (this.mediaElement?.play) {
          this.mediaElement.play();
        }
      }

      pause() {
        if (this.mediaElement?.pause) {
          this.mediaElement.pause();
        }
      }

      seek(delta) {
        if (!this.mediaElement) return;
        this.mediaElement.currentTime = Math.max(0, 
          Math.min(this.mediaElement.duration, this.mediaElement.currentTime + delta)
        );
      }

      handleSeek(e) {
        if (!this.mediaElement) return;
        const rect = this.seekTrack.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        this.mediaElement.currentTime = ratio * this.mediaElement.duration;
      }

      // Pointer-drag scrubbing: press anywhere on the (44px-tall hit area of
      // the) seek track and drag — the fill + a time bubble follow the finger
      // live; the actual seek commits on release. A plain tap degrades to a
      // single-shot seek. Works for mouse, touch, and pen via Pointer Events.
      _bindScrub() {
        const track = this.seekTrack;
        const bubble = document.getElementById('scrub-bubble');
        let active = false;

        const ratioOf = (e) => {
          const rect = track.getBoundingClientRect();
          return Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
        };
        const canScrub = () => this.mediaElement
          && typeof this.mediaElement.duration === 'number'
          && isFinite(this.mediaElement.duration)
          && this.mediaElement.duration > 0;

        const preview = (e) => {
          const ratio = ratioOf(e);
          const t = ratio * this.mediaElement.duration;
          this.seekFill.style.width = `${ratio * 100}%`;
          this.timeCurrent.textContent = this.formatTime(t);
          if (bubble) {
            const rect = track.getBoundingClientRect();
            bubble.textContent = this.formatTime(t);
            bubble.classList.add('visible');
            // Clamp so the bubble never bleeds past the track edges (no-overflow law).
            const half = (bubble.offsetWidth || 40) / 2;
            const x = Math.max(half, Math.min(rect.width - half, ratio * rect.width));
            bubble.style.left = `${x}px`;
          }
          return t;
        };
        const stopVisuals = () => {
          if (bubble) bubble.classList.remove('visible');
          this.seekFill.style.transition = '';
        };

        track.addEventListener('pointerdown', (e) => {
          if (!canScrub()) return;
          active = true;
          this._scrubbing = true;            // suppresses timeupdate fill writes
          try { track.setPointerCapture(e.pointerId); } catch (_) {}
          this.seekFill.style.transition = 'none';
          preview(e);
          e.preventDefault();
        });
        track.addEventListener('pointermove', (e) => {
          if (active) preview(e);
        });
        track.addEventListener('pointerup', (e) => {
          if (!active) return;
          active = false;
          const t = preview(e);
          this._scrubbing = false;
          if (t != null && canScrub()) this.mediaElement.currentTime = t;
          stopVisuals();
          try { track.releasePointerCapture(e.pointerId); } catch (_) {}
        });
        track.addEventListener('pointercancel', () => {
          active = false;
          this._scrubbing = false;
          stopVisuals();
        });
      }

      toggleMute() {
        if (!this.mediaElement) return;
        this.isMuted = !this.isMuted;
        this.mediaElement.muted = this.isMuted;
        this.volumeIcon.textContent = this.isMuted ? '🔇' : '🔊';
        this.volumeFill.style.width = this.isMuted ? '0%' : `${this.volume * 100}%`;
      }

      handleVolume(e) {
        if (!this.mediaElement) return;
        const rect = this.volumeTrack.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        this.volume = ratio;
        this.mediaElement.volume = ratio;
        this.volumeFill.style.width = `${ratio * 100}%`;
        this.isMuted = ratio === 0;
        this.volumeIcon.textContent = ratio === 0 ? '🔇' : '🔊';
      }

      // Navigate the play-history stack. There is no playlist in this player,
      // so prev/next walk the sequence of media actually loaded this session.
      prev() {
        if (!this._history || this._histIndex <= 0) return;
        this._histIndex--;
        this._playFromHistory();
      }

      next() {
        if (!this._history || this._histIndex >= this._history.length - 1) return;
        this._histIndex++;
        this._playFromHistory();
      }

      _playFromHistory() {
        const entry = this._history[this._histIndex];
        if (!entry) return;
        this._navigating = true;              // suppress history mutation in loadMedia
        try { this.loadMedia(entry.url, entry.title, entry.type); }
        finally { this._navigating = false; }
        this._updateNavButtons();
      }

      // Enable/disable + dim the prev/next buttons at the ends of history.
      _updateNavButtons() {
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const hist = this._history || [];
        const atStart = this._histIndex <= 0;
        const atEnd = this._histIndex >= hist.length - 1;
        if (prevBtn) { prevBtn.disabled = atStart; prevBtn.style.opacity = atStart ? '0.35' : ''; }
        if (nextBtn) { nextBtn.disabled = atEnd;   nextBtn.style.opacity = atEnd ? '0.35' : ''; }
      }

      // Window modes
      setMode(mode) {
        this.mode = mode;
        this.player.dataset.mode = mode;

        // GEOMETRY HAS EXACTLY ONE OWNER. Embedded, the HOST iframe owns the
        // box — writing 380px/860px/auto here is what clipped the media
        // container out of a short frame and produced "all sound, no video".
        // We still set data-mode (so mini/pip chrome behaviour is unchanged)
        // and still notify the parent, which is the side that legitimately
        // resizes the frame. We just never contradict our container.
        if (DIRRM_EMBEDDED) {
          this.player.style.width = '';
          this.player.style.height = '';
        } else
        // Adjust size based on mode
        if (mode === 'main') {
          this.player.style.width = '860px';
          this.player.style.height = '520px';
        } else if (mode === 'mini') {
          this.player.style.width = '380px';
          this.player.style.height = 'auto';
        } else if (mode === 'pip') {
          this.player.style.width = '320px';
          this.player.style.height = '180px';
        } else if (mode === 'theater') {
          this.player.style.width = '100vw';
          this.player.style.height = '100vh';
        }

        // Re-apply any saved incremental scale for this mode.
        this._applyScale();

        // Notify parent frame so it can resize the iframe to match
        window.parent?.postMessage({ action: 'modeChanged', mode: mode }, '*');
      }

      // OG DirHaven incremental sizing: each click steps the scale by 0.1,
      // clamped 0.5..2.0, persisted per-mode. Theater/pip ignore (fixed).
      nudgeSize(dir) {
        const mode = this.mode || 'main';
        if (mode === 'pip' || mode === 'theater') return;
        const key = 'dirrm:scale:' + mode;
        let s = parseFloat(localStorage.getItem(key) || '1') || 1;
        s = Math.max(0.5, Math.min(2.0, +(s + dir * 0.1).toFixed(2)));
        try { localStorage.setItem(key, String(s)); } catch (_) {}
        this._applyScale();
        // Tell the parent iframe how big we now want to be, so embeds resize.
        window.parent?.postMessage({ action: 'scaleChanged', mode, scale: s }, '*');
      }

      _applyScale() {
        const mode = this.mode || 'main';
        const s = parseFloat(localStorage.getItem('dirrm:scale:' + mode) || '1') || 1;
        const varName = mode === 'mini' ? '--dirrm-scale-mini' : '--dirrm-scale';
        // Clear both so only the active mode's var applies.
        this.player.style.removeProperty('--dirrm-scale');
        this.player.style.removeProperty('--dirrm-scale-mini');
        if (mode === 'main' || mode === 'mini') this.player.style.setProperty(varName, String(s));
      }

      toggleFullscreen() {
        if (this.mediaElement && this.mediaElement.requestFullscreen) {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            this.mediaElement.requestFullscreen();
          }
        }
      }

      close() {
        if (this.mediaElement) {
          this.mediaElement.pause();
        }
        this.player.style.display = 'none';
        
        // Notify parent
        window.parent?.postMessage({ action: 'playerClosed' }, '*');
      }

      // Positioning
      centerPlayer() {
        // On mobile (<= 900px) the CSS makes it fullscreen — no JS centering needed
        if (window.innerWidth <= 900) return;
        const w = this.player.offsetWidth || 860;
        const h = this.player.offsetHeight || 520;
        this.player.style.left = `${Math.max(0, (window.innerWidth - w) / 2)}px`;
        this.player.style.top = `${Math.max(0, (window.innerHeight - h) / 2)}px`;
      }

      // Drag functionality
      startDrag(e) {
        if (e.target.closest('.dirrm-btn')) return;
        this.isDragging = true;
        const rect = this.player.getBoundingClientRect();
        this.dragOffset = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
        this.player.style.willChange = 'left, top';
        this.player.style.transition = 'none';
      }

      onDrag(e) {
        if (!this.isDragging) return;
        
        const newX = e.clientX - this.dragOffset.x;
        const newY = e.clientY - this.dragOffset.y;
        
        // Clamp to viewport
        const maxX = window.innerWidth - this.player.offsetWidth;
        const maxY = window.innerHeight - this.player.offsetHeight;
        
        this.player.style.left = `${Math.max(0, Math.min(maxX, newX))}px`;
        this.player.style.top = `${Math.max(0, Math.min(maxY, newY))}px`;
      }

      endDrag() {
        this.isDragging = false;
        this.player.style.willChange = '';
      }

      // Resize functionality
      startResize(e) {
        this.isResizing = true;
        this.resizeDir = e.target.dataset.dir;
        this.startRect = this.player.getBoundingClientRect();
        this.startPos = { x: e.clientX, y: e.clientY };
        this.player.style.willChange = 'width, height, left, top';
        this.player.style.transition = 'none';
        e.preventDefault();
      }

      onResize(e) {
        if (!this.isResizing) return;

        const dx = e.clientX - this.startPos.x;
        const dy = e.clientY - this.startPos.y;
        const dir = this.resizeDir;

        let newWidth = this.startRect.width;
        let newHeight = this.startRect.height;
        let newLeft = this.startRect.left;
        let newTop = this.startRect.top;

        // Calculate new dimensions based on resize direction
        if (dir.includes('e')) newWidth = this.startRect.width + dx;
        if (dir.includes('w')) {
          newWidth = this.startRect.width - dx;
          newLeft = this.startRect.left + dx;
        }
        if (dir.includes('s')) newHeight = this.startRect.height + dy;
        if (dir.includes('n')) {
          newHeight = this.startRect.height - dy;
          newTop = this.startRect.top + dy;
        }

        // Apply min constraints
        const minW = parseInt(getComputedStyle(this.player).minWidth) || 200;
        const minH = parseInt(getComputedStyle(this.player).minHeight) || 120;

        // Apply max constraints — the player must never escape the viewport.
        // Anti-overlap rule: no edge may cross the viewport boundary.
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        // West edge: left cannot go below 0; clamp width accordingly.
        if (dir.includes('w') && newLeft < 0) {
          newWidth = newWidth + newLeft; // shrink by overshoot
          newLeft = 0;
        }
        // North edge: top cannot go below 0; clamp height accordingly.
        if (dir.includes('n') && newTop < 0) {
          newHeight = newHeight + newTop;
          newTop = 0;
        }
        // East edge: left + width cannot exceed viewport width.
        if (dir.includes('e') && (this.startRect.left + newWidth) > vw) {
          newWidth = vw - this.startRect.left;
        }
        // South edge: top + height cannot exceed viewport height.
        if (dir.includes('s') && (this.startRect.top + newHeight) > vh) {
          newHeight = vh - this.startRect.top;
        }
        // Absolute clamp regardless of direction.
        newWidth = Math.min(newWidth, vw);
        newHeight = Math.min(newHeight, vh);

        if (newWidth >= minW) {
          this.player.style.width = `${newWidth}px`;
          if (dir.includes('w')) this.player.style.left = `${newLeft}px`;
        }
        if (newHeight >= minH) {
          this.player.style.height = `${newHeight}px`;
          if (dir.includes('n')) this.player.style.top = `${newTop}px`;
        }
      }

      endResize() {
        this.isResizing = false;
        this.resizeDir = null;
        this.player.style.willChange = '';
      }

      // Keyboard shortcuts
      handleKeyboard(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        // Surface the legend on first key, auto-hide after 4s
        const legendKeys = [' ', 'k', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'm', 'f'];
        if (legendKeys.includes(e.key)) this.showKbdLegend(4000);

        switch (e.key) {
          case ' ':
          case 'k':
            e.preventDefault();
            this.togglePlay();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            this.seek(-5);
            break;
          case 'ArrowRight':
            e.preventDefault();
            this.seek(5);
            break;
          case 'ArrowUp':
            e.preventDefault();
            this.handleVolumeKey(0.1);
            break;
          case 'ArrowDown':
            e.preventDefault();
            this.handleVolumeKey(-0.1);
            break;
          case 'm':
            e.preventDefault();
            this.toggleMute();
            break;
          case 'f':
            e.preventDefault();
            this.toggleFullscreen();
            break;
          case 'Escape':
            if (this.mode === 'pip') {
              this.setMode('main');
            } else if (document.fullscreenElement) {
              document.exitFullscreen();
            }
            break;
        }
      }

      handleVolumeKey(delta) {
        if (!this.mediaElement) return;
        this.volume = Math.max(0, Math.min(1, this.volume + delta));
        this.mediaElement.volume = this.volume;
        this.volumeFill.style.width = `${this.volume * 100}%`;
        this.isMuted = this.volume === 0;
        this.volumeIcon.textContent = this.volume === 0 ? '🔇' : '🔊';
      }
    }

    // Initialize player
    const player = new DirRMPlayer();

    // Expose global API for external control
    window.DirRM = {
      load: (url, title, type) => player.loadMedia(url, title, type),
      play: () => player.play(),
      pause: () => player.pause(),
      togglePlay: () => player.togglePlay(),
      seek: (delta) => player.seek(delta),
      setMode: (mode) => player.setMode(mode),
      close: () => player.close(),
      setVolume: (v) => {
        player.volume = Math.max(0, Math.min(1, v));
        if (player.mediaElement) player.mediaElement.volume = player.volume;
        player.volumeFill.style.width = `${player.volume * 100}%`;
      },
      /**
       * Primary entry point for live WebRTC streams (same-page only).
       * Called by dirrm-launch.js after embedding the player in the current document.
       * `stream`      — RTCPeerConnection remote MediaStream (required)
       * `localStream` — local getUserMedia stream for self-view PIP (optional)
       * `title`       — display title, e.g. "Live: Vinta" (optional)
       */
      loadLive: (stream, localStream, title) => {
        player._pendingLiveStream = stream || null;
        player._pendingLocalStream = localStream || null;
        player.loadMedia('', title || 'Live', 'live');
      },
      /**
       * Attach or swap the local self-view PIP after a live session has started.
       * Safe to call at any time during an active live session.
       */
      setLocalStream: (localStream) => {
        player._attachSelfView(localStream || null);
      },
    };

    // Also expose as window.__dirrm for backward compat with info-card retry buttons
    window.__dirrm = window.DirRM;
  </script>
  <script src="body/welcome-gate.js"></script>
</body>
</html>
