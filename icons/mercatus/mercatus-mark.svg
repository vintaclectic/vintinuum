<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mercatus">
  <!-- MERCATUS mark: "the winged ledger".
       The M is a price path — up, down to the valley, up, down — so the name and the
       market are one stroke. Mercury's wings (god of commerce and of messengers) sit on
       the two highs: the peaks are where the market speaks. The coin in the valley is
       the entry: Mercatus buys only where merit is, never at the top. Gold = the ledger
       that never lies; teal = paper/buy, the war room's own colours. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d98a"/>
      <stop offset=".55" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#8a6f26"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#040810"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="13.25" fill="none" stroke="#c8a84b" stroke-opacity=".45" stroke-width="1.5"/>
  <g id="wl" fill="#c8a84b" fill-opacity=".92">
      <path d="M18.5 18 Q12.5 13 9 8 Q14.5 10.5 19.5 15.5 Z"/>
      <path d="M18 21 Q11 18 6 14.5 Q12 15  18.5 18.5 Z"/>
      <path d="M17.5 24 Q11.5 23 6.5 21 Q12 20.5 17.8 21.8 Z"/>
    </g>
    <use href="#wl" transform="translate(64 0) scale(-1 1)"/>
  <path d="M11 50 L19.5 19 L32 40 L44.5 19 L53 50" fill="none" stroke="url(#mg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="40" r="6" fill="#040810"/>
  <circle cx="32" cy="40" r="4.2" fill="#56c7a8"/>
</svg>
