<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VINTINUUM — Long Projects</title>
<meta name="theme-color" content="#040810">
<link rel="icon" type="image/svg+xml" href="branding/vintinuum/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --void: #040810;
  --text: rgba(210, 225, 255, 0.9);
  --text-dim: rgba(150, 175, 215, 0.5);
  --text-ghost: rgba(130, 155, 190, 0.3);
  --panel: rgba(10, 14, 22, 0.22);
  --card: rgba(16, 22, 34, 0.16);
  --border: rgba(255, 255, 255, 0.06);
  --gold: #c8a84b;
  --gold-dim: rgba(200, 168, 75, 0.5);
  --deep-blue: rgba(30, 60, 120, 0.15);
  --gold-glow: 200, 168, 75;
  --complete-color: rgba(70, 200, 140, 0.85);
  --abandon-color: rgba(200, 150, 50, 0.85);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  background: var(--void);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ATMOSPHERE ── */
.atmosphere {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(20, 40, 90, 0.25) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 50% 90%, rgba(40, 25, 5, 0.15) 0%, transparent 60%);
}

/* Compass rose background */
.compass-bg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 0;
  pointer-events: none;
  width: min(500px, 80vw);
  height: min(500px, 80vw);
  opacity: 0.025;
  animation: compassSpin 120s linear infinite;
}

@keyframes compassSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ── TOPBAR ── */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(48px + env(safe-area-inset-top, 0px));
  z-index: 100;
  /* NO-COLLISION: the topbar is fixed above scrolling content, so it must be
     fully OPAQUE. At 0.88 alpha the content underneath bled through it while
     scrolling — two things sharing the same pixels. The blur stays for depth
     on the atmosphere layer behind, but nothing shows through the bar now. */
  background: rgb(4, 8, 16);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  padding: env(safe-area-inset-top, 0px) 16px 0;
  gap: 12px;
}
.topbar > * { margin-bottom: 6px; }

.topbar-back {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.2s;
  min-height: 36px;
  padding: 0 4px;
  -webkit-tap-highlight-color: transparent;
}
.topbar-back:hover { color: var(--text); }
.topbar-back svg { width: 14px; height: 14px; flex-shrink: 0; }

.topbar-title {
  flex: 1;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 0.95rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.topbar-spacer { width: 60px; }

/* ── PAGE ── */
.page {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: calc(64px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 20px)) calc(100px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 20px));
  min-height: 100svh;
}

/* ── HEADER ── */
.proj-header {
  text-align: center;
  padding: 28px 0 36px;
}

.compass-icon {
  width: 60px;
  height: 60px;
  margin: 0 auto 18px;
}

.proj-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(1.8rem, 5vw, 3rem);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  background: linear-gradient(130deg, rgba(200, 168, 75, 0.95), rgba(170, 130, 50, 0.7), rgba(210, 190, 120, 0.8));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.proj-header .epigraph {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.85rem, 2vw, 1rem);
  color: var(--text-dim);
}

/* ── SECTION LABEL ── */
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-ghost);
  margin-bottom: 12px;
  padding-left: 4px;
}

/* ── ACTIVE PROJECT CARD ── */
.active-project {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  background: linear-gradient(160deg, rgba(20, 40, 90, 0.35) 0%, rgba(40, 28, 8, 0.2) 100%);
  border: 1px solid rgba(200, 168, 75, 0.18);
  border-radius: 24px;
  padding: 32px 28px;
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}

.active-project::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(200, 168, 75, 0.5), transparent);
}

.active-glow {
  position: absolute;
  top: -60px;
  right: -60px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 168, 75, 0.06), transparent 70%);
  pointer-events: none;
}

.active-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(200, 168, 75, 0.08);
  border: 1px solid rgba(200, 168, 75, 0.2);
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.48rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 16px;
}

.active-badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  animation: livePulse 1.8s ease-in-out infinite;
}

@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.active-title {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  line-height: 1.2;
  letter-spacing: 0.03em;
  color: rgba(220, 195, 130, 0.95);
  margin-bottom: 10px;
}

.active-why {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  line-height: 1.7;
  color: var(--text-dim);
  margin-bottom: 20px;
  border-left: 2px solid rgba(200, 168, 75, 0.2);
  padding-left: 14px;
}

.active-phase-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.phase-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-ghost);
}

.phase-badge {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  padding: 5px 14px;
  background: rgba(200, 168, 75, 0.08);
  border: 1px solid rgba(200, 168, 75, 0.2);
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  color: var(--gold-dim);
}

.start-date {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.08em;
  color: var(--text-ghost);
  text-transform: uppercase;
}

.active-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ── INLINE PROGRESS FORM ── */
.progress-form {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(200, 168, 75, 0.08);
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-group {
  margin-bottom: 14px;
}

.form-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: block;
  margin-bottom: 6px;
}

textarea.form-input, input.form-input {
  width: 100%;
  background: rgba(200, 168, 75, 0.03);
  border: 1px solid rgba(200, 168, 75, 0.12);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; /* iOS: >=16px prevents auto-zoom */
  line-height: 1.6;
  outline: none;
  resize: vertical;
  transition: border-color 0.2s ease;
  min-height: 80px;
  -webkit-appearance: none;
  box-sizing: border-box;
}

input.form-input {
  min-height: 44px;
  height: 44px;
  resize: none;
}

textarea.form-input:focus, input.form-input:focus {
  border-color: rgba(200, 168, 75, 0.3);
}

textarea.form-input::placeholder, input.form-input::placeholder {
  color: var(--text-ghost);
  font-style: italic;
}

.form-row-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 4px;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 22px;
  border-radius: 36px;
  border: 1px solid rgba(200, 168, 75, 0.25);
  background: rgba(200, 168, 75, 0.07);
  color: var(--gold-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.22s ease;
  min-height: 44px;
  white-space: nowrap;
}

.btn:hover {
  border-color: rgba(200, 168, 75, 0.45);
  background: rgba(200, 168, 75, 0.13);
  box-shadow: 0 0 20px rgba(200, 168, 75, 0.08);
  transform: translateY(-1px);
  color: rgba(220, 195, 130, 0.9);
}

.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-dim);
}

.btn-ghost:hover {
  border-color: rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.03);
  box-shadow: none;
  color: var(--text);
}

.btn-complete {
  border-color: rgba(70, 200, 140, 0.25);
  background: rgba(70, 200, 140, 0.06);
  color: rgba(70, 200, 140, 0.75);
}

.btn-complete:hover {
  border-color: rgba(70, 200, 140, 0.45);
  background: rgba(70, 200, 140, 0.12);
  box-shadow: 0 0 20px rgba(70, 200, 140, 0.08);
  color: rgba(100, 220, 160, 0.9);
}

.btn-abandon {
  border-color: rgba(200, 140, 50, 0.25);
  background: rgba(200, 140, 50, 0.06);
  color: rgba(200, 140, 50, 0.7);
}

.btn-abandon:hover {
  border-color: rgba(200, 140, 50, 0.4);
  background: rgba(200, 140, 50, 0.1);
  color: rgba(220, 160, 70, 0.85);
  box-shadow: none;
}

.btn-danger {
  border-color: rgba(200, 80, 80, 0.3);
  background: rgba(200, 80, 80, 0.08);
  color: rgba(220, 100, 100, 0.8);
}

.btn-danger:hover {
  border-color: rgba(200, 80, 80, 0.5);
  background: rgba(200, 80, 80, 0.14);
  box-shadow: 0 0 16px rgba(200, 80, 80, 0.08);
  color: rgba(230, 120, 120, 0.9);
}

/* ── PAST PROJECTS ── */
.past-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 32px;
}

.past-card {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s ease;
}

.past-card:hover { border-color: rgba(255,255,255,0.1); }

.past-card.completed {
  border-left: 3px solid rgba(70, 200, 140, 0.3);
}

.past-card.abandoned {
  border-left: 3px solid rgba(200, 140, 50, 0.3);
}

.past-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}

.past-title {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(1rem, 2.5vw, 1.15rem);
  line-height: 1.3;
  color: var(--text);
}

.past-status-badge {
  flex-shrink: 0;
  padding: 3px 10px;
  border-radius: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.45rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
}

.completed .past-status-badge {
  background: rgba(70, 200, 140, 0.08);
  border: 1px solid rgba(70, 200, 140, 0.2);
  color: var(--complete-color);
}

.abandoned .past-status-badge {
  background: rgba(200, 140, 50, 0.08);
  border: 1px solid rgba(200, 140, 50, 0.2);
  color: var(--abandon-color);
}

.past-why {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.9rem;
  line-height: 1.55;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.past-meta {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.48rem;
  letter-spacing: 0.08em;
  color: var(--text-ghost);
  text-transform: uppercase;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ── NEW PROJECT FORM ── */
.new-project-panel {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.new-project-panel.locked {
  opacity: 0.5;
  pointer-events: none;
}

.np-glow {
  position: absolute;
  bottom: -40px;
  left: -40px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 168, 75, 0.05), transparent 70%);
  pointer-events: none;
}

.panel-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 18px;
}

.locked-note {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--text-ghost);
  margin-bottom: 12px;
}

/* ── CONFIRM DIALOG ── */
.confirm-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(4, 8, 16, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(20px, env(safe-area-inset-top, 20px)) 20px max(20px, env(safe-area-inset-bottom, 20px));
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.confirm-box {
  background: rgba(12, 18, 32, 0.98);
  border: 1px solid rgba(200, 168, 75, 0.15);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 420px;
  width: 100%;
  animation: popIn 0.25s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.94) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.confirm-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: 0.05em;
  color: var(--text);
  margin-bottom: 10px;
}

.confirm-body {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 20px;
}

.confirm-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; /* iOS: >=16px prevents auto-zoom */
  min-height: 44px;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  box-sizing: border-box;
}

.confirm-input:focus { border-color: rgba(200, 168, 75, 0.25); }
.confirm-input::placeholder { color: var(--text-ghost); font-style: italic; }

.confirm-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

/* State messages */
.state-msg {
  text-align: center;
  padding: 40px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--text-ghost);
  text-transform: uppercase;
}

.no-active {
  text-align: center;
  padding: 32px 20px;
  background: var(--panel);
  border: 1px dashed var(--border);
  border-radius: 20px;
  margin-bottom: 32px;
}

.no-active p {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.no-active .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  color: var(--text-ghost);
  text-transform: uppercase;
}

/* ── LOAD ERROR PANEL ──
   Flows in the normal document column (no fixed/absolute positioning), so it
   cannot collide with the topbar, the dock, or anything else. It replaces
   #mainContent's children entirely — it never sits on top of them. */
.load-error {
  text-align: center;
  padding: 36px 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  margin-bottom: 32px;
}
.load-error-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.56rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.load-error-body {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.05rem;
  line-height: 1.5;
  color: var(--text);
  margin: 0 auto 20px;
  max-width: 44ch;
  /* Long unbroken strings wrap instead of widening the box. */
  overflow-wrap: anywhere;
  word-break: break-word;
}
.load-error-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.load-error-actions .btn { text-decoration: none; }

/* ── TOAST ──
   z-index 300 sits deliberately ABOVE the confirm overlay (200) because a
   toast reports the failure of a confirm action and must remain readable.
   That is the only intentional layering on this page. It is pinned to the
   BOTTOM centre and clamped to the viewport, so it can never reach the
   topbar (top, z100) and never overlaps page content, which scrolls beneath
   its own padding. Bottom inset clears the mobile dock + safe area. */
.toast-host {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  z-index: 300;
  width: min(440px, calc(100vw - 32px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  /* Never taller than the viewport; a burst of toasts scrolls inside its own
     box rather than growing upward into the page content. */
  max-height: calc(100svh - 160px);
  overflow-y: auto;
}
/* NO-COLLISION: the toast is the page's only floating layer, so the document
   RESERVES the strip it occupies. While a toast is on screen the page gains
   bottom padding equal to the toast rail, so real content scrolls clear of it
   instead of passing underneath. Nothing is ever covered. */
body.has-toast .page {
  padding-bottom: calc(100px + var(--toast-rail, 0px) + env(safe-area-inset-bottom, 0px));
}

  pointer-events: auto;

  border-left: 3px solid #e0604a;

@keyframes toastIn {

@media (prefers-reduced-motion: reduce) {

<script>
const API = 'https://api.vintaclectic.com';
const token = () => localStorage.getItem('vint_token');
const headers = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` });

let allProjects = [];
let confirmCallback = null;

// ── API ERRORS THAT A HUMAN CAN READ ──
// The old version threw `new Error(res.status)`, so the UI literally printed
// "Navigation error — 500". A bare HTTP status is not a message: every failure
// mode looked identical and told the reader nothing they could act on.
// ApiError carries the status, the server's `code`, and a human sentence.
class ApiError extends Error {
  constructor(message, status, code, isAuth) {
    super(message);
    this.name = 'ApiError';
    this.status = status;
    this.code = code || null;
    this.isAuth = !!isAuth;
  }
}

// Map a failed response to a sentence worth reading. Prefers the server's own
// human message when it sent one; otherwise falls back per status class.
async function describeFailure(res, path) {
  let body = null;
  // A failing response is not guaranteed to be JSON — Express hands back an
  // HTML error page for a malformed body, and a proxy/tunnel outage returns
  // HTML or nothing at all. Parsing must never throw over the real error.
  try {
    const raw = await res.text();
    if (raw) { try { body = JSON.parse(raw); } catch (_) { body = null; } }
  } catch (_) { body = null; }

  const serverMsg = body && typeof body.error === 'string' ? body.error.trim() : '';
  const code = body && typeof body.code === 'string' ? body.code : null;
  const s = res.status;

  if (s === 401 || s === 403) {
    return new ApiError(
      s === 403
        ? "This journey isn't yours to open."
        : "Your session has expired — sign in to see your projects.",
      s, code, true
    );
  }
  if (s === 404) {
    return new ApiError(serverMsg || 'That project no longer exists.', s, code, false);
  }
  if (s === 409) {
    return new ApiError(serverMsg || 'A journey is already underway.', s, code, false);
  }
  if (s === 400 || s === 422) {
    return new ApiError(serverMsg || "Something in that form wasn't quite right.", s, code, false);
  }
  if (s === 429) {
    return new ApiError('Too many requests — give it a moment, then try again.', s, code, false);
  }
  if (s >= 500) {
    // Never surface a server's internal text verbatim beyond its own safe
    // message; the backend already sanitizes, but don't rely on that here.
    return new ApiError(
      serverMsg || "Vintinuum couldn't reach your projects just now. This has been logged — try again in a moment.",
      s, code, false
    );
  }
  return new ApiError(serverMsg || `Unexpected response while loading ${path}.`, s, code, false);
}

async function apiFetch(path, opts = {}) {
  let res;
  try {
    res = await fetch(API + path, { ...opts, headers: headers() });
  } catch (netErr) {
    // fetch() only rejects on a network/CORS failure — that is offline, not 500.
    throw new ApiError("Can't reach Vintinuum — check your connection and try again.", 0, 'NETWORK', false);
  }
  if (!res.ok) throw await describeFailure(res, path);
  if (res.status === 204) return null;
  try {
    return await res.json();
  } catch (_) {
    throw new ApiError('Vintinuum sent back something unreadable. Try again in a moment.', res.status, 'BAD_JSON', false);
  }
}

function fmtDate(d) {
  if (!d) return null;
  return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── TOAST ──
// Replaces alert(): non-blocking, readable, and dismissible. Capped at 3 so a
// burst of failures can never grow the stack into the page content above it.
function notifyError(e) {
  const host = document.getElementById('toastHost');
  const msg = (e && e.message) ? e.message : 'Something went wrong.';
  if (!host) { console.error('[projects]', msg); return; }

  while (host.children.length >= 3) host.removeChild(host.firstElementChild);

  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'alert');
  el.innerHTML = `
    <span class="toast-text">${escHtml(msg)}</span>
    <button class="toast-close" aria-label="Dismiss">&times;</button>
  `;
  const dismiss = () => {
    if (el.parentNode) el.parentNode.removeChild(el);
    clearTimeout(timer);
    syncToastRail();
  };
  el.querySelector('.toast-close').addEventListener('click', dismiss);
  // An expired session message is worth a longer read than a transient failure.
  const timer = setTimeout(dismiss, (e && e.isAuth) ? 9000 : 6000);
  host.appendChild(el);
  syncToastRail();
}

// Keep the reserved bottom strip exactly as tall as the live toast rail, so
// page content always scrolls clear of it and is never covered (NO-COLLISION).
function syncToastRail() {
  const host = document.getElementById('toastHost');
  if (!host) return;
  const any = host.children.length > 0;
  document.body.classList.toggle('has-toast', any);
  const h = any ? Math.ceil(host.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--toast-rail', h + 'px');
}
window.addEventListener('resize', syncToastRail);

// ── CONFIRM DIALOG ──
let confirmExtra = null;

function openConfirm(title, body, okLabel, okClass, inputPlaceholder, cb) {
  confirmCallback = cb;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;
  const btn = document.getElementById('confirmOkBtn');
  btn.textContent = okLabel;
  btn.className = `btn ${okClass || ''}`;
  const inp = document.getElementById('confirmInput');
  if (inputPlaceholder) {
    inp.style.display = 'block';
    inp.placeholder = inputPlaceholder;
    inp.value = '';
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
  document.getElementById('confirmOverlay').style.display = 'flex';
}

function closeConfirm() {
  document.getElementById('confirmOverlay').style.display = 'none';
  confirmCallback = null;
}

function doConfirm() {
  const inputVal = document.getElementById('confirmInput').value.trim();
  if (confirmCallback) confirmCallback(inputVal);
  closeConfirm();
}

// ── RENDER ──
// A project is finished when the backend says so (`status`), falling back to
// the legacy completed_at/abandoned_at fields if an older payload arrives.
function isEnded(p) {
  if (p && typeof p.status === 'string') return p.status === 'complete' || p.status === 'abandoned';
  return !!(p && (p.completed_at || p.abandoned_at));
}

function renderAll(projects) {
  allProjects = Array.isArray(projects) ? projects : [];
  const active = allProjects.find(p => !isEnded(p));
  const past = allProjects.filter(isEnded)
    .sort((a, b) => (b.last_updated || 0) - (a.last_updated || 0));
  const hasActive = !!active;

  // ── TRUE EMPTY STATE ──
  // Zero projects is not an error and not a blank page: it is an invitation.
  if (allProjects.length === 0) {
    document.getElementById('mainContent').innerHTML = `
      <div class="no-active">
        <p>No long projects yet.</p>
        <span class="sub">Every journey starts with one bearing</span>
      </div>
      ${newProjectPanelHtml(false)}
    `;
    return;
  }

  let html = '';

  // Active section
  html += `<div class="section-label">Active Journey</div>`;

  if (active) {
    html += `
      <div class="active-project" id="activeProject">
        <div class="active-glow"></div>
        <div class="active-badge"><span class="active-badge-dot"></span>In Progress</div>
        <div class="active-title">${escHtml(active.title)}</div>
        <p class="active-why">${escHtml(active.why || '')}</p>
        <div class="active-phase-row">
          <span class="phase-label">Phase:</span>
          <span class="phase-badge">${escHtml(active.phase || 'Undefined')}</span>
          ${active.start_date ? `<span class="start-date">Since ${fmtDate(active.start_date)}</span>` : ''}
        </div>
        <div class="active-actions">
          <button class="btn" data-draggable="true" onclick="toggleProgressForm()">Log Progress</button>
          <button class="btn btn-complete" data-draggable="true" onclick="confirmComplete(${active.id})">Complete</button>
          <button class="btn btn-abandon" data-draggable="true" onclick="confirmAbandon(${active.id})">Abandon</button>
        </div>
        <div id="progressForm" style="display:none" class="progress-form">
          <div class="form-group">
            <label class="form-label">Progress Note</label>
            <textarea class="form-input" id="progressNote" placeholder="What moved? What shifted? Where did the path lead today?" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">New Phase (optional)</label>
            <input class="form-input" id="progressPhase" placeholder="Leave blank to keep current phase">
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" data-draggable="true" onclick="toggleProgressForm()">Cancel</button>
            <button class="btn" data-draggable="true" onclick="logProgress(${active.id})">Log It</button>
          </div>
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="no-active">
        <p>No active journey underway.</p>
        <span class="sub">Begin one below — the compass awaits a bearing.</span>
      </div>
    `;
  }

  // Past section
  if (past.length > 0) {
    html += `<div class="section-label" style="margin-top:8px">Past Journeys</div>`;
    html += `<div class="past-list">`;
    past.forEach(p => {
      const done = (p.status === 'complete') || (!p.status && p.completed_at);
      const status = done ? 'completed' : 'abandoned';
      const statusLabel = done ? 'Completed' : 'Abandoned';
      const endDate = fmtDate(p.completed_at || p.abandoned_at || (p.last_updated ? p.last_updated * 1000 : null));
      html += `
        <div class="past-card ${status}">
          <div class="past-card-header">
            <div class="past-title">${escHtml(p.title)}</div>
            <span class="past-status-badge">${statusLabel}</span>
          </div>
          <p class="past-why">${escHtml(p.why || '')}</p>
          <div class="past-meta">
            <span>Phase: ${escHtml(p.phase || '—')}</span>
            ${p.start_date ? `<span>Started ${fmtDate(p.start_date)}</span>` : ''}
            ${endDate ? `<span>Ended ${endDate}</span>` : ''}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  // New project form
  html += newProjectPanelHtml(hasActive);

  document.getElementById('mainContent').innerHTML = html;
}

// The create affordance — shared by the populated view and the empty state, so
// a user with zero projects always has a way to begin one.
function newProjectPanelHtml(hasActive) {
  return `
    <div class="section-label">Begin New Journey</div>
    <div class="new-project-panel ${hasActive ? 'locked' : ''}" id="newProjectPanel">
      <div class="np-glow"></div>
      <div class="panel-label">Chart a New Course</div>
      ${hasActive ? `<p class="locked-note">A journey is already underway. Complete or abandon it before beginning another.</p>` : ''}
      <div class="form-group">
        <label class="form-label" for="npTitle">Title</label>
        <input class="form-input" id="npTitle" maxlength="300" placeholder="The name of this undertaking">
      </div>
      <div class="form-group">
        <label class="form-label" for="npWhy">Why — the soul of it</label>
        <textarea class="form-input" id="npWhy" rows="3" placeholder="What is the deepest reason? Why does this matter enough to be a long journey?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="npPhase">Initial Phase</label>
        <input class="form-input" id="npPhase" maxlength="120" placeholder="e.g. Orientation, Foundation, Inquiry…">
      </div>
      <div class="form-actions">
        <button class="btn" data-draggable="true" onclick="createProject()" ${hasActive ? 'disabled' : ''}>Begin the Journey</button>
      </div>
    </div>
  `;
}

function toggleProgressForm() {
  const form = document.getElementById('progressForm');
  if (!form) return;
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') {
    document.getElementById('progressNote').focus();
  }
}

async function logProgress(id) {
  const note = document.getElementById('progressNote').value.trim();
  const phase = document.getElementById('progressPhase').value.trim();
  if (!note) { notifyError(new ApiError('Write a note first — what moved?', 0, 'CLIENT_VALIDATION', false)); return; }
  try {
    await apiFetch(`/api/projects/${id}/progress`, {
      method: 'POST',
      body: JSON.stringify({ note, new_phase: phase || undefined })
    });
    load();
  } catch (e) {
    notifyError(e);
  }
}

function confirmComplete(id) {
  openConfirm(
    'Complete this journey',
    'Mark this project complete. A completion note helps capture what was learned or built.',
    'Complete',
    'btn-complete',
    'A closing note for the record…',
    async (note) => {
      try {
        await apiFetch(`/api/projects/${id}/complete`, { method: 'POST', body: JSON.stringify({ completion_note: note }) });
        load();
      } catch (e) { notifyError(e); }
    }
  );
}

function confirmAbandon(id) {
  openConfirm(
    'Abandon this journey',
    'Set this project aside. State the reason honestly — for the record, not for judgment.',
    'Abandon',
    'btn-abandon',
    'Why did the path end here?',
    async (reason) => {
      try {
        await apiFetch(`/api/projects/${id}/abandon`, { method: 'POST', body: JSON.stringify({ reason }) });
        load();
      } catch (e) { notifyError(e); }
    }
  );
}

async function createProject() {
  const title = document.getElementById('npTitle').value.trim();
  const why = document.getElementById('npWhy').value.trim();
  const phase = document.getElementById('npPhase').value.trim();
  if (!title || !why) { notifyError(new ApiError('A title and a why are both required to begin.', 0, 'CLIENT_VALIDATION', false)); return; }
  try {
    await apiFetch('/api/projects', { method: 'POST', body: JSON.stringify({ title, why, phase: phase || 'Orientation' }) });
    load();
  } catch (e) {
    notifyError(e);
  }
}

// A failed load gets a readable sentence and a way forward — never a raw code.
function renderLoadError(e) {
  const msg = escHtml(e && e.message ? e.message : 'Something went wrong.');
  const isAuth = !!(e && e.isAuth);
  const actionBtn = isAuth
    ? `<a class="btn" href="index.html">Sign in</a>`
    : `<button class="btn" data-draggable="true" onclick="load()">Try again</button>`;
  document.getElementById('mainContent').innerHTML = `
    <div class="load-error" role="alert">
      <div class="load-error-title">${isAuth ? 'Sign in to continue' : 'The compass lost its bearing'}</div>
      <p class="load-error-body">${msg}</p>
      <div class="load-error-actions">${actionBtn}</div>
    </div>
  `;
}

function renderLoading() {
  document.getElementById('mainContent').innerHTML =
    `<div class="state-msg" role="status">Charting your journeys…</div>`;
}

async function load() {
  renderLoading();
  try {
    const data = await apiFetch('/api/projects');
    renderAll(Array.isArray(data) ? data : ((data && data.projects) || []));
  } catch (e) {
    renderLoadError(e);
  }
}

load();
</script>
