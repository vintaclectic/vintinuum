<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse · notification check</title>
<style>
body{background:#05070f;color:#e6ecff;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:20px 16px;max-width:560px;margin:auto}
h1{font-size:18px;margin:0 0 12px} button{font:inherit;background:linear-gradient(135deg,#00ffc8,#8b7bff);color:#041016;border:0;border-radius:24px;height:48px;padding:0 22px;width:100%;margin:8px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1120;border:1px solid rgba(160,190,255,.15);border-radius:12px;padding:12px;font-size:13px;min-height:4em}
.v{color:#00ffc8;font-weight:600} p{color:rgba(214,224,255,.65);font-size:13px}
</style></head><body>
<h1>Notification check</h1>
<p>Tap the button. Whatever your phone answers shows below — copy it all and paste it to Claude.</p>
<button id="go">ask for notifications</button>
<button id="push">try Pulse’s notification sign-up</button>
<button id="copy" style="background:none;border:1px solid rgba(160,190,255,.3);color:#e6ecff">copy result</button>
<pre id="out">…</pre>
<script>
const out = document.getElementById('out'); const lines = [];
const log = (k, v) => { lines.push(k + ': ' + v); out.textContent = lines.join('\n'); };
const ua = navigator.userAgent;
const browser = navigator.brave ? 'Brave' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /EdgA/.test(ua) ? 'Edge' : /OPR|Opera/.test(ua) ? 'Opera'
  : /Firefox/.test(ua) ? 'Firefox' : /DuckDuckGo/.test(ua) ? 'DuckDuckGo' : /; wv\)/.test(ua) ? 'in-app WebView (not a real browser)'
  : /CriOS/.test(ua) ? 'Chrome on iPhone' : /Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'unknown';
async function snapshot(tag) {
  log('— ' + tag, new Date().toLocaleTimeString());
  log('browser', browser);
  log('secure page', window.isSecureContext);
  log('opened as installed app', matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
  log('Notification API', 'Notification' in window);
  log('Push API', 'PushManager' in window);
  log('service workers', 'serviceWorker' in navigator);
  if ('Notification' in window) log('Notification.permission', Notification.permission);
  try { log('permissions.query', (await navigator.permissions.query({ name: 'notifications' })).state); } catch (e) { log('permissions.query', 'error ' + e.message); }
  try { const regs = await navigator.serviceWorker.getRegistrations(); log('service workers here', regs.map(r => r.scope.replace(location.origin, '')).join(', ') || 'none'); } catch (_) {}
}
document.getElementById('go').onclick = async () => {
  if (!('Notification' in window)) { log('result', 'this browser has no notifications at all'); return; }
  const t0 = performance.now();
  try { const r = await Notification.requestPermission(); const ms = Math.round(performance.now() - t0);
    log('requestPermission answered', r + ' after ' + ms + ' ms' + (ms < 300 ? '  ← answered instantly: no prompt was shown' : '  ← a prompt was shown'));
  } catch (e) { log('requestPermission threw', e.name + ' ' + e.message); }
  await snapshot('after asking');
};
document.getElementById('copy').onclick = () => { navigator.clipboard.writeText(out.textContent).then(() => { document.getElementById('copy').textContent = 'copied ✓'; }, () => {}); };
// Runs exactly what the Pulse app does to sign up for notifications, logging every step.
document.getElementById('push').onclick = async () => {
  const API = 'https://api.vintaclectic.com';
  log('— pulse sign-up', new Date().toLocaleTimeString());
  try {
    const reg = await navigator.serviceWorker.getRegistration('/pulse/');
    log('1 pulse worker', reg ? (reg.scope.replace(location.origin, '') + ' · ' + (reg.active ? reg.active.state : 'no active worker')) : 'NOT registered');
    if (!reg) return;
    const ready = await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]);
    log('2 serviceWorker.ready', ready ? ready.scope.replace(location.origin, '') : 'never resolved (4s)');
    const existing = await reg.pushManager.getSubscription();
    log('3 existing subscription', existing ? new URL(existing.endpoint).host : 'none');
    const kr = await fetch(API + '/api/push/public-key'); const k = await kr.json().catch(() => ({}));
    log('4 brain public key', kr.status + (k.publicKey ? ' · ' + k.publicKey.slice(0, 12) + '…' : ' · MISSING'));
    const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)); };
    let sub = existing;
    if (!sub) { try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k.publicKey) }); log('5 subscribe', 'ok · ' + new URL(sub.endpoint).host); }
                catch (e) { log('5 subscribe', 'FAILED ' + e.name + ': ' + e.message); return; } }
    const tok = localStorage.getItem('vint_access_token') || localStorage.getItem('vint_token') || '';
    log('6 sign-in on this phone', tok ? 'yes (' + tok.length + ' chars)' : 'NONE — pair first');
    const r = await fetch(API + '/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-Id': localStorage.getItem('_vint_did') || '', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) },
      body: JSON.stringify({ subscription: sub.toJSON(), label: 'Pulse diag · ' + navigator.userAgent.slice(0, 60) }) });
    log('7 brain saved it', r.status + ' ' + (await r.text()).slice(0, 160));
  } catch (e) { log('stopped', e.name + ': ' + e.message); }
};
log('user agent', ua);
snapshot('on open');
</script></body></html>
